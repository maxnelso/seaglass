[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seaglass-rl"
version = "0.1.0"
description = "Reinforcement learning environment and agents for Seaglass Battlegrounds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.5",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["seaglass_rl*"]
