card: Blood Gem Barrage
scenarios:
  - name: each_refresh_plays_2_blood_gems_on_every_minion_in_the_tavern
    seed: 831
    tavern:
      gold: 1   # the Refresh
      auras: {blood_gem_bonus_atk: 1}   # Blood Gems give +2/+1
    steps:
      - add_to_hand: Blood Gem Barrage
      - play: Blood Gem Barrage
      - expect: {auras: {refresh_blood_gems: 2}}
      - refresh
    expect:
      shop:
        where: {is_spell: false}
        count: ">= 1"
        all: {blood_gems_played: 2, attack: "@base_attack + 4", health: "@base_health + 2"}
