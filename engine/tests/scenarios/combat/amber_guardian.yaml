card: Amber Guardian
scenarios:
  - name: start_of_combat_gives_another_dragon_2_2_and_divine_shield
    seed: 303
    combat: {board_a: [Glim Guardian, Amber Guardian], board_b: [Patient Scout]}   # Glim Guardian: a 1/4 Dragon
    expect:
      outcome: a_win
      survivors_a: {0: "Glim Guardian 5/6"}   # +2/+2 at Start of Combat, +2 Attack on Rally

  # Persistent Poet (a 2/3 Dragon) already has Divine Shield, so Glim Guardian (1/4) is picked on
  # every seed.
  - name: prefers_dragons_without_divine_shield
    seeds: "1..=10"
    combat: {board_a: [Amber Guardian, Persistent Poet, Glim Guardian], board_b: [Patient Scout]}
    expect:
      events:
        where: {type: stat_buff, reason: Amber Guardian}
        count: 1
        all: {attack: 3, health: 6}   # Glim Guardian + 2/2

  - name: falls_back_to_a_dragon_with_divine_shield
    seed: 303
    combat: {board_a: [Amber Guardian, Persistent Poet], board_b: [Patient Scout]}
    expect:
      events:
        where: {type: stat_buff, reason: Amber Guardian}
        count: 1
        all: {attack: 4, health: 5}   # Persistent Poet + 2/2

  # Golden Amber Guardian (6/4) gives two other Dragons +2/+2 and Divine Shield, but Glim Guardian
  # (1/4) is the only other Dragon: it is buffed once, 1/4 + 2/2 = 3/6.
  - name: golden_never_picks_the_same_dragon_twice
    seed: 303
    combat: {board_a: ["golden Amber Guardian 6/4", Glim Guardian], board_b: [Patient Scout]}
    expect:
      events:
        where: {type: stat_buff, reason: Amber Guardian}
        count: 1
        all: {attack: 3, health: 6}
