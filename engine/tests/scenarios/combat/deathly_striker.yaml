card: Deathly Striker
scenarios:
  - name: avenge_4_gets_a_random_undead
    seed: 606
    combat:
      board_a: [Risen Rider, Risen Rider, Risen Rider, Deathly Striker]
      board_b: ["Kalecgos, Arcane Aspect"]
    expect: {hand_a: [undead]}

  - name: deathrattle_summons_nothing_if_its_avenge_never_triggered
    description: >-
      The Striker trades with Proud Privateer before its Avenge (4) ever triggered: its Deathrattle
      summons nothing, even with an Undead in hand.
    seed: 606
    combat:
      board_a: [Deathly Striker]   # 8/8
      board_b: [Proud Privateer]   # 8/8
      hand_a: [Eternal Summoner]   # 8/1 Reborn Undead
    expect:
      outcome: draw
      survivors_a: []
      hand_a: [Eternal Summoner]

  # Two Boom-in-a-Boxes each deal 3 damage to all other minions at Start of Combat (the Striker:
  # 8/8 -> 8/2). The first kills both Harmless Boneheads and Cadaver Caretaker (3 deaths; their
  # Skeletons fill the board), the second the six Skeletons (deaths 4 to 9): Avenge (4) triggers
  # twice. The Striker then dies in its first fight with a 5/7 Boom-in-a-Box.
  - name: deathrattle_summons_every_undead_its_avenge_gave
    description: >-
      The Deathrattle summons exactly the two random Undead its Avenge gave, not the Eternal
      Summoner that was already in hand.
    seed: 607
    combat:
      board_a: [Harmless Bonehead, Harmless Bonehead, Cadaver Caretaker, Deathly Striker]
      board_b: [Boom-in-a-Box, Boom-in-a-Box]
      hand_a: [Eternal Summoner]
    expect:
      hand_a: {count: 3, 0: Eternal Summoner, 1: undead, 2: undead}
      events:
        all_of:
          - {where: {type: unit_summoned, source: 3}, count: 2}   # the Striker (unit 3)
          - {none: {type: unit_summoned, name: Eternal Summoner}}

  # Unit ids: A's Deathly Striker 0, ..., Titus Rivendare 5, Boom-in-a-Box 6; B's Tyrael 7. A's own
  # Boom-in-a-Box kills the four 1-3 Health minions at Start of Combat: Avenge (4) gives one
  # random Undead. The Striker (8/5) then trades with Tyrael (10/7).
  - name: with_titus_rivendare_the_second_trigger_summons_nothing
    description: >-
      Titus Rivendare makes the Deathrattle trigger twice (2 triggered), but the Undead its
      Avenge gave is summoned once: the second trigger summons nothing, and the card stays in hand.
    seed: 606
    combat:
      board_a:
        [Deathly Striker, Southsea Busker, Razorfen Geomancer, Patient Scout, Wrath Weaver,
         Titus Rivendare, Boom-in-a-Box]
      board_b: [Tyrael]
    expect:
      auras_a: {deathrattles_triggered: 2}
      hand_a: {count: 1}
      events: {where: {type: unit_summoned, source: 0}, count: 1}

  - name: never_gets_a_deathly_striker
    seeds: "1..101"
    combat:
      board_a: [Risen Rider, Risen Rider, Risen Rider, golden Deathly Striker]
      board_b: ["Kalecgos, Arcane Aspect"]
      hero_tier_a: 6   # the Undead it can get go up to Tier 6, its own Tier
    expect: {hand_a: {count: ">= 2", none: {card: Deathly Striker}}}
