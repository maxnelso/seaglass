topic: Mixed boards across tiers (smoke tests)
scenarios:
  - name: tier1_deathrattles_and_rally
    seed: 7
    combat:
      board_a:
        - "1/1 card:harmless_bonehead"
        - "1/4 card:flittering_bat"
        - "2/3 card:tusked_camper"
      board_b:
        - "1/1 card:cord_puller"
        - "1/1 card:buzzing_vermin"
