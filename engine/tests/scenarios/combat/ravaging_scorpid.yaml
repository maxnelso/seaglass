card: Ravaging Scorpid
scenarios:
  - name: attacking_buffs_beetles_and_deathrattle_summons_a_beetle
    seed: 618
    combat: {board_a: [Ravaging Scorpid], board_b: [Living Azerite]}   # a 6/7 Beast
    expect:
      auras_a: {counters: {Beetle: [4, 4]}}
      survivors_a: ["Beetle 6/6"]   # 2/2 + the 4/4 bonus

  - name: attacking_also_buffs_beetles_already_on_the_board
    description: >-
      Boon of Beetles summons two 2/2 Taunt Beetles at Start of Combat. Side A (more minions)
      attacks first with Ravaging Scorpid: the Beetles already on the board get the +4/+4 too, not
      only future ones. The Scorpid then kills the 3/1 Southsea Busker.
    seed: 619
    combat:
      board_a: [Ravaging Scorpid, Southsea Busker]
      board_b: [Southsea Busker]
      auras_a: {effects: [{card: Boon of Beetles, stacks: 2}]}
    expect:
      outcome: a_win
      auras_a: {counters: {Beetle: [4, 4]}}
      survivors_a:
        - "Ravaging Scorpid 6/4"   # 6/7 - 3
        - Southsea Busker
        - "Beetle 6/6 taunt"   # 2/2 + 4/4
        - "Beetle 6/6 taunt"

  # Unit ids: A's Buzzing Vermin 0, Ravaging Scorpid 1; B's Kalecgos 2; the Vermin's Beetle 3.
  # A has more minions and attacks first, with the Vermin.
  - name: an_attacking_beetle_hits_with_the_bonus_from_its_own_attack
    description: >-
      The Vermin attacks (future Beetles +4/+4) and dies; its Beetle is summoned 6/6 in its slot
      and attacks next for A. The Scorpid's trigger for that attack resolves before the damage,
      so the Beetle hits for 10 (2/2 + 4/4 + 4/4), not 6.
    seeds: "1..=4"   # Kalecgos (4/12) attacks the Beetle or the Scorpid; either way the Beetle lives
    combat:
      board_a: [Buzzing Vermin, Ravaging Scorpid]
      board_b: ["Kalecgos, Arcane Aspect"]
    expect:
      events: {any: {type: damage_dealt, from: 3, amount: 10}}
