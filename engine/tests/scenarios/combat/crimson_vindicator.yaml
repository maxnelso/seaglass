card: Crimson Vindicator
scenarios:
  - name: rally_casts_mighty_dragonbreath
    description: >-
      Mighty Dragonbreath gives +3/+2, plus +3/+2 for a Dragon and +3/+2 for a Divine Shield
      minion: Bronze Warden (2/1 Dragon, Divine Shield) gets +9/+6.
    seed: 604
    combat:
      board_a: [Crimson Vindicator, Bronze Warden]
      board_b: [Patient Scout]
    expect:
      survivors_a: {any: "Bronze Warden 11/7"}

  - name: a_living_humongozz_on_the_board_adds_its_spell_power
    description: >-
      A standalone combat board counts its own aura minions: Humon'gozz makes each Mighty
      Dragonbreath stack +4/+4 (3/2 + 1/2). The Vindicator (a Divine Shield Dragon) gets it three
      times, Humon'gozz (Divine Shield) twice.
    seed: 604
    combat:
      board_a: [Crimson Vindicator, Humon'gozz]
      board_b: [Patient Scout]
    expect:
      outcome: a_win
      survivors_a:
        - "Crimson Vindicator 20/21 -divine_shield"   # 8/9 + 12/12; the 1/1 popped its shield
        - "Humon'gozz 13/13"   # 5/5 + 8/8

  - name: a_magnetized_enchanted_sentinel_adds_its_spell_power
    description: >-
      Enchanted Sentinel Magnetized to Annoy-o-Module (5/9) gives +1/+1, so each Mighty
      Dragonbreath stack is +4/+3: three for the Vindicator, two for Annoy-o-Module (Divine
      Shield).
    seed: 604
    tavern: {board: [Crimson Vindicator, Annoy-o-Module], hand: [Enchanted Sentinel]}
    steps:
      - play: {hand: 0, pos: 1}
      - expect: {board: [Crimson Vindicator, "Annoy-o-Module 5/9"]}
      - fight: {board: [Patient Scout]}
    expect:
      combat:
        survivors_a:
          - "Crimson Vindicator 20/18 -divine_shield"   # 8/9 + 12/9
          - "Annoy-o-Module 13/15"   # 5/9 + 8/6

  # Each Mighty Dragonbreath counts as you casting a Tavern spell (docs/combat.md §2).

  # Unit ids: A's Crimson Vindicator 0, Vicious Mindslasher 1, Forsaken Weaver 2, Living Azerite 3;
  # B's Greedy Conniver 4.
  - name: whenever_you_cast_a_tavern_spell_minions_react_to_each_mighty_dragonbreath
    description: >-
      The Vindicator attacks once. Before its Mighty Dragonbreath (+3/+2, again for a Dragon and for
      Divine Shield), left to right: Vicious Mindslasher gives itself and the Deity +1/+2, Forsaken
      Weaver gives the Undead +3 Attack this game (itself, and Plaguerunner in hand), and Living
      Azerite gives the Elementals in the Tavern +4/+3 this game.
    seed: 604
    combat:
      board_a: [Crimson Vindicator, Vicious Mindslasher, Forsaken Weaver, Living Azerite]
      board_b: [Greedy Conniver]   # 7/7
      hand_a: [Plaguerunner]   # a 4/2 Undead
    expect:
      outcome: a_win
      survivors_a:
        - "Crimson Vindicator 17/15 -divine_shield"   # 8/9 + 9/6
        - "Vicious Mindslasher 5/6"   # 1/2 + 1/2 + 3/2
        - "Forsaken Weaver 9/10"   # 3/8 + 3/0 + 3/2
        - "Living Azerite 11/8"   # 8/6 + 3/2
      hand_a: ["Plaguerunner 7/2"]
      auras_a:
        tavern_spells_cast: 1
        deity: {attack: 2, health: 3}   # from the base 1/1
        undead_bonus_attack: 3
        tavern_elemental_atk: 4
        tavern_elemental_hp: 3
      events:
        sequence:
          - {type: attack_declared, side: a, attacker: 0, target: 4}
          - {type: stat_buff, unit: 1, reason: Vicious Mindslasher, attack: 2, health: 4}
          - {type: stat_buff, unit: 2, reason: Forsaken Weaver, attack: 6, health: 8}
          - {type: stat_buff, unit: 0, reason: Crimson Vindicator, attack: 17, health: 15}
          - {type: damage_dealt, unit: 4, amount: 17, from: 0}

  - name: golden_minions_react_with_their_golden_bonuses
    description: >-
      Before Mighty Dragonbreath, a Golden Mindslasher gives itself and the Deity +2/+4, a Golden
      Forsaken Weaver gives the Undead +6 Attack, and a Golden Living Azerite gives the Elementals
      in the Tavern +8/+6.
    seed: 604
    combat:
      board_a:
        - Crimson Vindicator
        - "golden Vicious Mindslasher 2/4"
        - "golden Forsaken Weaver 6/16"
        - "golden Living Azerite 16/12"
      board_b: [Greedy Conniver]
    expect:
      auras_a:
        deity: {attack: 3, health: 5}
        undead_bonus_attack: 6
        tavern_elemental_atk: 8
        tavern_elemental_hp: 6
      events:
        all_of:
          - {where: {type: stat_buff, reason: Vicious Mindslasher}, count: 1, all: {unit: 1, atk_delta: 2, hp_delta: 4}}
          - {where: {type: stat_buff, reason: Forsaken Weaver}, count: 1, all: {unit: 2, atk_delta: 6, hp_delta: 0}}

  - name: each_cast_counts_as_a_tavern_spell_cast_but_not_as_the_last_one
    description: >-
      A Golden Vindicator casts Mighty Dragonbreath twice when it attacks: tavern_spells_cast goes
      up by 2 (Faceless Converter), but Armor Stash stays the last Tavern spell cast, so Cataclysmic
      Harbinger gets a copy of it at the end of the turn.
    seed: 604
    tavern: {board: ["golden Crimson Vindicator 16/18", Cataclysmic Harbinger], hand: [Armor Stash]}
    steps:
      - play: {hand: Armor Stash, pos: 0}   # an untargeted spell is played at 0
      - expect: {auras: {tavern_spells_cast: 1, last_tavern_spell_cast: {capture: armor_stash}}}
      - fight: {board: [Patient Scout]}   # A has more minions: the Vindicator attacks first, once
      - expect:
          combat: {events: {where: {type: stat_buff, reason: Crimson Vindicator}, count: 4}}   # 2 casts x 2 minions
          auras: {tavern_spells_cast: 3, last_tavern_spell_cast: {same_as: armor_stash}}
      - end_turn
    expect: {hand: [Armor Stash]}

  - name: its_rally_in_the_tavern_is_a_mighty_dragonbreath_you_cast
    description: >-
      Sky-hatch Runaway triggers its Rally in the Tavern: Mighty Dragonbreath is cast like any
      spell your minion casts in the Tavern. Felboar counts it, it counts as a Tavern spell cast,
      and it becomes the last Tavern spell you cast.
    tavern: {gold: 1, board: [Sky-hatch Runaway, Crimson Vindicator, Felboar]}
    steps:
      - activate: {pos: Sky-hatch Runaway, target: 1}
    expect:
      auras: {tavern_spells_cast: 1, last_tavern_spell_cast: 839}   # Mighty Dragonbreath
      board:
        - "Sky-hatch Runaway 10/11"   # 4/7 + 3/2 twice (a Dragon)
        - "Crimson Vindicator 17/15"   # 8/9 + 3/2 three times (a Dragon with Divine Shield)
        - {card: Felboar, stats: 5/8, counter: 1}   # 2/6 + 3/2
