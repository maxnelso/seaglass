topic: Basic trades, keywords and hero damage
scenarios:
  - name: vanilla_3_3_beats_2_2
    seed: 1
    combat:
      board_a: [Flighty Scout]   # 3/3
      board_b: [Lullabot]   # 2/2
    expect:
      outcome: a_win
      survivors_a: ["Flighty Scout 3/1"]
      survivors_b: []
      hero_damage: 2

  - name: crackling_cyclone_vs_risen_rider
    seed: 2
    combat:
      board_a: [Crackling Cyclone, Lullabot]
      board_b: [Risen Rider]
    expect:
      outcome: a_win
      survivors_a: ["Lullabot 2/2 -taunt -divine_shield -windfury -reborn"]
      survivors_b: []
      hero_damage: 2

  # Boom-in-a-Box's Start of Combat kills both at once: the Bonehead's Deathrattle resolves
  # before Drifting Sacrifice (to its left) is Reborn.
  - name: reborn_waits_for_deathrattles_from_the_same_deaths
    seed: 1
    combat:
      board_a: [Drifting Sacrifice, Harmless Bonehead]
      board_b: [Boom-in-a-Box]
    expect:
      events:
        sequence:
          - {type: unit_summoned, side: a, reason: Deathrattle, name: Skeleton}
          - {type: unit_summoned, side: a, reason: Reborn, name: Drifting Sacrifice}
