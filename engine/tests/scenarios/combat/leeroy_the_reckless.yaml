card: Leeroy the Reckless
scenarios:
  - name: deathrattle_destroys_its_killer_through_divine_shield
    description: >-
      Leeroy pops the Divine Shield or is killed by the 50/500, then its Deathrattle destroys the
      50/500 anyway.
    seed: 529
    combat: {board_a: [Leeroy the Reckless], board_b: [Holy Vanguard]}
    expect: {outcome: draw, survivors_b: []}

  - name: deathrattle_destroys_a_friendly_killer
    description: >-
      Its own Boom-in-a-Box's Start of Combat kills Leeroy (6/2): the Deathrattle destroys the
      Boom-in-a-Box, which leaves side A empty.
    seed: 529
    combat:
      board_a: [Leeroy the Reckless, Boom-in-a-Box]
      board_b: ["Kalecgos, Arcane Aspect"]   # 4/12
    expect:
      outcome: b_win
      survivors_a: []
      survivors_b: ["Kalecgos, Arcane Aspect 4/9"]   # 3 damage from the Boom-in-a-Box

  - name: being_destroyed_isnt_being_killed
    description: >-
      Its own Stitched Salvager's Start of Combat destroys Leeroy. A destroy effect doesn't kill
      it, so the Deathrattle has no killer to destroy: the Salvager survives and kills the Patient
      Scout (1/1).
    seed: 529
    combat:
      board_a: [Leeroy the Reckless, Stitched Salvager]   # 16/4
      board_b: [Patient Scout]
    expect:
      outcome: a_win
      survivors_a: ["Stitched Salvager 16/3"]
