card: Jailbird Juggernaut
scenarios:
  - name: rally_golem_attacks_first_and_kills_the_target
    description: >-
      With more minions, side A attacks first. When the 6/15 Juggernaut attacks, its Rally summons
      a 6/15 Blood Golem that attacks the 10/6 first and kills it, so the Juggernaut's own strike
      is aborted and it takes no damage.
    seed: 705
    combat: {board_a: [Jailbird Juggernaut, Patient Scout], board_b: [Living Azerite]}
    expect:
      outcome: a_win
      survivors_a: ["Jailbird Juggernaut 6/15", "Blood Golem 6/7", Patient Scout]

  - name: the_golems_attack_triggers_friendly_attack_observers
    description: >-
      Side A (3 minions) attacks first. The Juggernaut's attack and then its Golem's attack each
      trigger Prodigious Tusker (a Blood Gem on the attacker: both become 7/16) and Ravaging
      Scorpid (Beetles +4/+4, twice). The 7/16 Golem kills the 8/6 and takes 8.
    seed: 705
    combat:
      board_a: [Jailbird Juggernaut, Prodigious Tusker, Ravaging Scorpid]
      board_b: [Living Azerite]
    expect:
      outcome: a_win
      survivors_a:
        - "Jailbird Juggernaut 7/16"   # 6/15 + a Blood Gem (after its Rally copied 6/15)
        - "Blood Golem 7/8"   # 6/15 + a Blood Gem, then 8 damage
        - Prodigious Tusker
        - Ravaging Scorpid
      auras_a: {counters: {Beetle: [8, 8]}}   # +4/+4 for each of the two attacks
