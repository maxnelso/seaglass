card: Risen Rider
scenarios:
  - name: reborn_drops_external_buffs_but_keeps_the_undead_aura
    description: >-
      Deathstrider triggers Plaguerunner (+2 Undead Attack aura) at Start of Combat and Wolf Pup's
      Rally gives Risen Rider +4/+1 (bringing it to 8/2). When Risen Rider dies and Reborns, it
      returns as a base 2/1 plus the +2 Undead aura (4/1), dropping the +4/+1 Wolf Pup buff.
    seed: 119
    combat:
      board_a: [Wolf Pup, Plaguerunner, Deathstrider, Risen Rider]
      board_b: [Greedy Conniver]
    expect:
      outcome: a_win
      survivors_a:
        - "Plaguerunner 10/3"
        - "Deathstrider 14/12"
        - "Risen Rider 4/1 taunt -reborn"
