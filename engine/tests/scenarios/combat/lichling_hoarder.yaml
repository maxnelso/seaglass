card: Lichling Hoarder
scenarios:
  - name: avenge_3_gets_a_plain_copy_of_a_starting_minion
    description: Risen Rider (2 deaths, with Reborn) and Harmless Bonehead (1) trigger Avenge (3).
    seed: 530
    combat:
      board_a: [Risen Rider, Harmless Bonehead, Lichling Hoarder]
      board_b: [Cataclysmic Harbinger]
    expect: {hand_a: {count: ">= 1"}}

  # Boom-in-a-Box's Start of Combat kills Harmless Bonehead, Southsea Busker and Razorfen
  # Geomancer at once (Lichling Hoarder: 6/9 -> 6/6). The Bonehead's two Skeletons are summoned
  # before the third death triggers Avenge (3), and the Skeletons later die too (5 deaths in all:
  # a single Avenge).
  - name: copies_only_minions_that_started_in_the_warband
    description: >-
      The copy is one of the four minions the warband started the combat with (dead or alive,
      Lichling Hoarder included), never a Skeleton summoned during it.
    seeds: "1..=40"
    combat:
      board_a: [Harmless Bonehead, Southsea Busker, Razorfen Geomancer, Lichling Hoarder]
      board_b: [Boom-in-a-Box]
    expect:
      hand_a:
        count: 1
        all: {any_of: [Harmless Bonehead, Southsea Busker, Razorfen Geomancer, Lichling Hoarder]}

  - name: can_copy_a_starting_minion_that_already_died
    description: >-
      Same Start of Combat: this seed's copy is Harmless Bonehead, which died before the Avenge
      triggered (it is neither on the board nor the minion that just died).
    seed: 6
    combat:
      board_a: [Harmless Bonehead, Southsea Busker, Razorfen Geomancer, Lichling Hoarder]
      board_b: [Boom-in-a-Box]
    expect: {hand_a: ["Harmless Bonehead 1/1"]}

  # Unit ids: A's Harmless Bonehead 0, Southsea Busker 1, Razorfen Geomancer 2, Patient Scout 3,
  # Lichling Hoarder 4; B's Boom-in-a-Box 5; the Skeletons 6, 7. Boom-in-a-Box's Start of Combat
  # kills units 0-3 at once (the Hoarder: 6/9 -> 6/6): deaths 1-4, so Avenge (3) triggers on the
  # third with 1 death left over. The Skeletons die before the Hoarder: deaths 5-6, 1 + 2 = 3.
  - name: deaths_beyond_the_avenge_count_carry_over
    description: >-
      Four deaths at once trigger Avenge (3) once and count one towards the next; two more
      deaths trigger it again (two copies).
    seed: 530
    combat:
      board_a: [Harmless Bonehead, Southsea Busker, Razorfen Geomancer, Patient Scout, Lichling Hoarder]
      board_b: [Boom-in-a-Box]
    expect:
      events: {where: {type: death}, sequence: [{unit: 6}, {unit: 7}, {unit: 4}]}
      hand_a: {count: 2}

  # Two enemy Boom-in-a-Boxes (one Golden) deal 3 damage three times at Start of Combat: the
  # third blast kills the three Proud Privateers (8/8) and Lichling Hoarder (6/9) at once.
  - name: does_not_trigger_when_it_dies_in_the_same_blast
    description: >-
      Three friendly minions die at the same time as the Hoarder (to its left, resolved first):
      it is dead too, so its Avenge (3) does not trigger.
    seed: 530
    combat:
      board_a: [Proud Privateer, Proud Privateer, Proud Privateer, Lichling Hoarder]
      board_b: ["golden Boom-in-a-Box 10/20", Boom-in-a-Box]
    expect:
      outcome: b_win
      hand_a: []
