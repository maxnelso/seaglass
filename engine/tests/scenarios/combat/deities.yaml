topic: Deities awaken after 4 friendly Aberration deaths
scenarios:
  - name: cthun_awakens_after_four_aberrations_die
    seed: 7
    combat:
      board_a: [Zoatroid, Zoatroid, Zoatroid, Zoatroid, Prodigious Tusker]
      board_b: [Boom-in-a-Box, Cataclysmic Harbinger]
      auras_a: {deity: {kind: cthun, attack: 6, health: 6}}
    expect:
      outcome: a_win

  - name: yshaarj_awakens_and_resummons_first_two_aberrations
    seed: 7
    combat:
      board_a: [Mysterious K'Thir, Joyous, Zoatroid, Zoatroid]
      board_b: [Sha of Fear, Cataclysmic Harbinger]
      auras_a: {deity: {kind: yshaarj, attack: 4, health: 4}}
    expect:
      outcome: a_win

  # The awakenings themselves, as logged events (ported from harness.rs
  # `cthun_and_yshaarj_awaken_after_4_friendly_aberrations_die`).
  - name: cthun_awakening_is_logged_after_four_aberrations_die
    seed: 7
    combat:
      board_a: [Zoatroid, Zoatroid, Zoatroid, Zoatroid, Lullabot]
      board_b: [Stalwart Kodo]
      auras_a: {deity: {kind: cthun, attack: 5, health: 5}}
    expect:
      events: {any: {type: deity_awakened, side: a, deity: cthun}}

  - name: yshaarj_awakening_is_logged_after_four_aberrations_die
    seed: 7
    combat:
      board_a: [Mysterious K'Thir, Joyous, Zoatroid, Zoatroid]
      board_b: [Sha of Fear, Cataclysmic Harbinger]
      auras_a: {deity: {kind: yshaarj, attack: 4, health: 4}}
    expect:
      outcome: a_win
      events: {any: {type: deity_awakened, side: a, deity: yshaarj}}

  # Boom-in-a-Box's Start of Combat kills Drifting Sacrifice and the three Zoatroids at once:
  # all four deaths resolve, then C'Thun awakens, then Drifting Sacrifice is Reborn.
  - name: reborns_from_the_same_deaths_wait_for_the_deity
    seed: 7
    combat:
      board_a: [Drifting Sacrifice, Zoatroid, Zoatroid, Zoatroid]
      board_b: [Boom-in-a-Box]
      auras_a: {deity: {kind: cthun, attack: 5, health: 5}}
    expect:
      events:
        sequence:
          - {type: deity_awakened, side: a, deity: cthun}
          - {type: unit_summoned, side: a, reason: Reborn, name: Drifting Sacrifice}
