card: Persistent Poet
scenarios:
  - name: adjacent_dragons_keep_stats_gained_in_combat
    description: >-
      Electric Synthesizer gives the other Dragons +1/+1 at the start of combat; the 2/2 Dragon
      next to Persistent Poet keeps it after the combat.
    seed: 445
    tavern: {board: [Electric Synthesizer, Persistent Poet, "2/2 dragon"]}
    steps:
      - fight: {board: ["1/1"]}
    expect: {board: [Electric Synthesizer, Persistent Poet, "3/3"]}

  - name: tarecgosa_adjacent_to_persistent_poet_does_not_double_count_combat_gains
    seed: 445
    tavern: {board: [Electric Synthesizer, Persistent Poet, Tarecgosa]}
    steps:
      - fight: {board: ["1/1"]}
    expect: {board: [Electric Synthesizer, Persistent Poet, "Tarecgosa 5/5"]}
