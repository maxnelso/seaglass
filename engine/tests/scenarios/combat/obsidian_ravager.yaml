card: Obsidian Ravager
scenarios:
  - name: rally_damages_the_target_and_a_neighbour_before_combat_damage
    description: >-
      Side A (3 minions) attacks first: the 7/7 Ravager attacks the 10/7 Taunt, and its Rally deals
      7 damage to it and to the adjacent 0/7, killing both before combat damage.
    seed: 706
    combat:
      board_a: [Obsidian Ravager, Patient Scout, Patient Scout]
      board_b: [Hot-Air Surveyor, Insatiable Ur'zul]
    expect:
      outcome: a_win
      survivors_a: ["Obsidian Ravager 7/7", Patient Scout, Patient Scout]

  # Unit ids: A's Obsidian Ravager 0, Patient Scout 1; B's Annoy-o-Module 2 (2/4 Taunt, Divine
  # Shield).
  - name: rally_damage_pops_divine_shield_so_the_attack_lands
    description: >-
      Side A (2 minions) attacks first. The Rally's 7 damage pops the target's Divine Shield,
      then the attack itself deals 7 and kills it; the Ravager takes 2 (7/5).
    seed: 706
    combat:
      board_a: [Obsidian Ravager, Patient Scout]
      board_b: [Annoy-o-Module]
    expect:
      outcome: a_win
      survivors_a: ["Obsidian Ravager 7/5", Patient Scout]
      events:
        sequence:
          - {type: attack_declared, side: a, attacker: 0, target: 2}
          - {type: divine_shield_popped, unit: 2}
          - {type: damage_dealt, unit: 2, amount: 7, from: 0}
          - {type: death, unit: 2}

  - name: rally_damage_triggers_whenever_this_takes_damage
    description: >-
      Side A (2 minions) attacks first. The Rally deals 7 to the 2/14 Very Hungry Winterfinner,
      then the attack deals 7 more: it takes damage twice, so Tad in B's hand gets +2/+1 twice.
    seed: 706
    combat:
      board_a: [Obsidian Ravager, Patient Scout]
      board_b: ["Very Hungry Winterfinner 2/14"]
      hand_b: [Tad]
    expect:
      outcome: a_win
      hand_b: ["Tad 6/4"]   # 2/2 + 2 x (+2/+1)

  # Unit ids: A's Obsidian Ravager 0, Patient Scouts 1-3; B's Wandering Willbreaker 4,
  # Insatiable Ur'zul 5 (4/6 Taunt), Wandering Willbreaker 6. Side A (4 minions) attacks first
  # and the Ravager must attack the Taunt Ur'zul; its Rally's second hit goes to one of Ur'zul's
  # two neighbours, picked at random.
  - name: rally_hits_a_random_neighbour_here_the_right_one
    seed: 1
    combat:
      board_a: [Obsidian Ravager, Patient Scout, Patient Scout, Patient Scout]
      board_b: [Wandering Willbreaker, Insatiable Ur'zul, Wandering Willbreaker]
    expect:
      events:
        where: {type: damage_dealt, from: 0}
        0: {unit: 5, amount: 7}
        1: {unit: 6, amount: 7}

  - name: rally_hits_a_random_neighbour_here_the_left_one
    seed: 2
    combat:
      board_a: [Obsidian Ravager, Patient Scout, Patient Scout, Patient Scout]
      board_b: [Wandering Willbreaker, Insatiable Ur'zul, Wandering Willbreaker]
    expect:
      events:
        where: {type: damage_dealt, from: 0}
        0: {unit: 5, amount: 7}
        1: {unit: 4, amount: 7}
