card: Expert Aviator
scenarios:
  - name: rally_summons_the_highest_attack_murloc_from_hand
    seed: 210
    combat:
      board_a: [Expert Aviator]   # 3/5
      board_b: [Parasitic Fleshling]
      hand_a: [Tad, Shoalfin Mystic]   # 2/2 and 5/5 Murlocs
    expect:
      outcome: a_win
      survivors_a: [Shoalfin Mystic]

  # Tad (2/2) and Bubble Gunner (2/3) tie for the highest Attack: the Rally picks one at random.
  - name: picks_randomly_among_murlocs_tied_for_highest_attack
    description: This seed summons Bubble Gunner, the right-most of the two.
    seed: 1
    combat:
      board_a: [Expert Aviator]
      board_b: [Parasitic Fleshling]
      hand_a: [Tad, Bubble Gunner]
    expect:
      events: {where: {type: unit_summoned, side: a}, 0: {name: Bubble Gunner}}

  - name: a_tie_can_also_go_to_the_left_most_murloc
    seed: 2
    combat:
      board_a: [Expert Aviator]
      board_b: [Parasitic Fleshling]
      hand_a: [Tad, Bubble Gunner]
    expect:
      events: {where: {type: unit_summoned, side: a}, 0: {name: Tad}}

  # Unit ids: A's Expert Aviator 0, Diremuck Forager 1; B's Tyrael 2; then Shoalfin Mystic 3,
  # Tad 4.
  - name: takes_the_next_highest_murloc_after_diremuck_summoned_one
    description: >-
      Diremuck Forager summons Shoalfin Mystic (4 Attack) at Start of Combat, which locks that
      hand card for this combat, so the Aviator's Rally summons the next-highest Murloc, Tad.
    seed: 210
    combat:
      board_a: [Expert Aviator, Diremuck Forager]
      board_b: [Tyrael]
      hand_a: [Shoalfin Mystic, Tad]
    expect:
      events:
        where: {type: unit_summoned, side: a}
        count: 2
        0: {name: Shoalfin Mystic, reason: Diremuck Forager}
        1: {name: Tad, reason: Rally}
      hand_a: [Shoalfin Mystic, Tad]

  # Unit ids: A's Expert Aviator 0, Diremuck Forager 1; B's Tyrael 2; the Flighty Scouts 3 (its
  # own copy) and 4 (Diremuck's).
  - name: flighty_scouts_own_copy_does_not_lock_it_but_diremucks_summon_does
    description: >-
      Flighty Scout's own Start of Combat copy doesn't lock the card, so Diremuck Forager
      summons it too; that does lock it, and with no other Murloc in hand the Aviator's Rally
      summons nothing.
    seed: 210
    combat:
      board_a: [Expert Aviator, Diremuck Forager]
      board_b: [Tyrael]
      hand_a: [Flighty Scout]
    expect:
      events:
        all_of:
          - sequence:
              - {type: unit_summoned, side: a, unit: 3, name: Flighty Scout, reason: Flighty Scout}
              - {type: unit_summoned, side: a, unit: 4, name: Flighty Scout, reason: Diremuck Forager}
              - {type: attack_declared, side: a, attacker: 0}
          - {where: {type: unit_summoned, side: a}, count: 2}

  # Unit ids: A's Expert Aviator 0, Diremuck Forager 1, Southsea Buskers 2-6; B's Tyrael 7.
  - name: a_rally_summon_with_no_room_does_not_lock_the_murloc
    description: >-
      The board is full: Diremuck Forager's summon waits for a slot, and the Aviator's Rally has
      no room, so nothing is summoned and Shoalfin Mystic stays unlocked. The Aviator dies
      attacking Tyrael, and Diremuck Forager's waiting summon takes Shoalfin Mystic.
    seed: 210
    combat:
      board_a:
        [Expert Aviator, Diremuck Forager, Southsea Busker, Southsea Busker, Southsea Busker,
         Southsea Busker, Southsea Busker]
      board_b: [Tyrael]
      hand_a: [Shoalfin Mystic]
    expect:
      events:
        all_of:
          - sequence:
              - {type: death, unit: 0}
              - {type: unit_summoned, side: a, name: Shoalfin Mystic, reason: Diremuck Forager}
          - {where: {type: unit_summoned, side: a}, count: 1}

  - name: its_rally_does_nothing_outside_combat
    description: >-
      Sky-hatch Runaway triggers its Rally during the Tavern turn: nothing is summoned and the hand
      is unchanged.
    tavern:
      gold: 10   # Sky-hatch Runaway's Activate costs 1
      board: [Sky-hatch Runaway, Expert Aviator]
      hand: [Shoalfin Mystic]   # a Murloc
    steps:
      - activate: {pos: Sky-hatch Runaway, target: 1}
    expect:
      gold: 9
      board: [Sky-hatch Runaway, Expert Aviator]
      hand: [Shoalfin Mystic]
