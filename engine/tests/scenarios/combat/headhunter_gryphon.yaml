card: Headhunter Gryphon
scenarios:
  - name: rally_gets_a_random_beast
    seed: 427
    combat:
      board_a: [Headhunter Gryphon]
      board_b: [Patient Scout]
    expect:
      outcome: a_win
      hand_a: ["beast"]

  - name: never_gets_a_headhunter_gryphon
    seeds: "1..101"
    combat:
      board_a: [golden Headhunter Gryphon]   # 3/5, Rally: get 2 random Beasts
      board_b: ["Kalecgos, Arcane Aspect"]   # 4/12: the Gryphon attacks at least once
    expect: {hand_a: {count: ">= 2", none: {card: Headhunter Gryphon}}}
