card: Stitched Salvager
scenarios:
  - name: destroys_its_left_neighbour_and_resummons_an_exact_copy
    description: >-
      Start of Combat: the Salvager destroys golden Annoy-o-Module (2/4 Divine Shield, Taunt) and
      stores it. The 16/4 Salvager trades with Tyrael (10/10) and dies; its Deathrattle resummons
      the exact golden 2/4 Divine Shield, Taunt Annoy-o-Module.
    seed: 710
    combat:
      board_a: ["golden Annoy-o-Module", Stitched Salvager]
      board_b: [Tyrael]
    expect:
      outcome: a_win
      survivors_a: ["golden Annoy-o-Module 2/4 divine_shield taunt"]

  # Titus Rivendare is right of the Salvager, so it is not destroyed. The stored Annoy-o-Module
  # is 2/4 + 3/3 = 5/7; the Deathrattle triggers 1 + 1 (Titus) = 2 times: two copies.
  - name: with_titus_rivendare_summons_two_exact_copies
    description: >-
      The Salvager destroys a buffed Annoy-o-Module (5/7 Divine Shield, Taunt) and trades with
      Tyrael; with Titus Rivendare its Deathrattle triggers twice: two exact copies.
    seed: 710
    combat:
      board_a: ["Annoy-o-Module +3/+3", Stitched Salvager, Titus Rivendare]
      board_b: [Tyrael]
    expect:
      outcome: a_win
      survivors_a:
        - "Annoy-o-Module 5/7 divine_shield taunt"
        - "Annoy-o-Module 5/7 divine_shield taunt"
        - Titus Rivendare
