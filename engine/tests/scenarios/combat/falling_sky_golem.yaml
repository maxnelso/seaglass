card: Falling Sky Golem
scenarios:
  - name: has_4_2_for_each_deathrattle_triggered_this_game
    seed: 610
    combat:
      board_a: ["Cord Puller taunt", Falling Sky Golem]   # Cord Puller Deathrattle -> Golem 4/2 + 4/2 = 8/4
      board_b: ["2/2"]
    expect:
      survivors_a: {any: "Falling Sky Golem 8/4"}

  - name: emits_death_aura_stat_buff_and_attack_declared_precedes_rally_in_combat
    seed: 7
    combat:
      board_a: [Glim Guardian, Cord Puller, "Falling Sky Golem 8/8"]
      board_b: ["5/20 taunt"]
    expect:
      events:
        all_of:
          - where:
              any_of:
                - {type: attack_declared}
                - {type: stat_buff, reason: Rally}
            0: {type: attack_declared}
            any: {type: stat_buff, reason: Rally}
          - any: {type: stat_buff, reason: Death Aura}
