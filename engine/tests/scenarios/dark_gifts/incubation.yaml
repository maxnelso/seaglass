dark_gift: Incubation
scenarios:
  - name: gives_4_4_and_doubles_in_2_turns
    tavern: {hand: ["1/1 beast gift:incubation"]}
    steps:
      - expect: {hand: ["5/5"]}
      - start_turn
      - expect: {hand: ["5/5"]}
      - start_turn
      - expect: {hand: ["10/10"]}
      - start_turn
    expect: {hand: ["10/10"]}

  - name: on_the_board_too
    tavern: {board: ["2/2 beast gift:incubation"]}
    steps:
      - start_turn
      - start_turn
    expect: {board: ["12/12"]}
