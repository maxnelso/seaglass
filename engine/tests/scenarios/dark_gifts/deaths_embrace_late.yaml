dark_gift: Death's Embrace (late)
scenarios:
  - name: has_stats_for_each_one_this_game
    combat:
      board_a: ["1/1 gift:deaths_embrace_late"]
      board_b: []
      auras_a: {deathrattles_triggered: 2}
    expect: {survivors_a: ["5/5"]}

  - name: grows_with_each_deathrattle_in_combat
    combat:
      board_a: [Harmless Bonehead, "1/1 gift:deaths_embrace_late"]
      board_b: ["1/1"]
    expect: {survivors_a: {any: "3/3 gift:deaths_embrace_late"}}
