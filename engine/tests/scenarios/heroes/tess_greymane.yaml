hero: Tess Greymane
scenarios:
  - name: bobs_burgles_refreshes_shop_with_plain_copies_of_last_opponent_warband
    steps:
      - set_hero: Tess Greymane
      - set:
          gold: 5
          tavern_tier: 2
          include_shop_spells: true
          shop: [Lullabot, Cord Puller]
          lobby:
            opponents:
              - last_warband: ["golden Joyous 10/10", "Zoatroid 9/9", "Wrath Weaver 7/7"]
            last_opponent: 0
      - expect: {health: 30, armor: 17}
      - hero_power
      - expect:
          gold: 4
          shop:
            count: 4
            0: "Joyous 2/3 -golden"
            1: "Zoatroid 3/2"
            2: "Wrath Weaver 1/3"
            3: {is_spell: true}

  - name: bobs_burgles_caps_at_shop_minion_slots
    steps:
      - set_hero: Tess Greymane
      - set:
          gold: 5
          tavern_tier: 1
          include_shop_spells: true
          lobby:
            opponents:
              - last_warband: [Joyous, Zoatroid, Wrath Weaver, Lullabot, Cord Puller]
            last_opponent: 0
      - hero_power
      - expect:
          shop:
            count: 4
            3: {is_spell: true}

  - name: bobs_burgles_needs_a_last_opponent_warband
    steps:
      - set_hero: Tess Greymane
      - set:
          gold: 5
          shop: [Lullabot, Cord Puller]
      - expect_illegal: hero_power
      - set:
          lobby:
            opponents:
              - last_warband: []
            last_opponent: 0
      - expect_illegal: hero_power
      - expect: {gold: 5, shop: [Lullabot, Cord Puller]}
      - set:
          lobby:
            opponents:
              - last_warband: [Joyous]
            last_opponent: 0
      - expect_legal: hero_power

  - name: the_copies_are_plain_even_of_tokens_and_custom_minions
    description: >
      `cards::instantiate_plain_copy`: a token is copied as a fresh token, and a minion of neither
      the catalog nor the tokens loses what was added to it (hats, marks, Freeze, temporary
      keywords and Attack, extra Deathrattles).
    steps:
      - set_hero: Tess Greymane
      - set:
          gold: 5
          lobby:
            opponents:
              - last_warband:
                  - {card: "Fish of N'Zoth 9/9", hats: 2, marked: true, frozen: true}
                  - {card: "7/7", hats: 1, marked: true, frozen: true, until_next_turn_atk: 3, temp_reborn: true}
            last_opponent: 0
      - hero_power
      - expect:
          shop:
            0: {card: Fish of N'Zoth, stats: "2/2", hats: 0, marked: false, frozen: false, extra_deathrattles: []}
            1: {stats: "7/7", hats: 0, marked: false, frozen: false, until_next_turn_atk: 0, keywords: []}
