hero: Gall
scenarios:
  - name: a_golden_played_gives_both_teammates_a_triple_reward
    seeds: "1..=2"
    duos_tavern:
      players:
        - {auras: {hero: Gall}, hand: ["golden Zoatroid"], tavern_tier: 3}
        - {tavern_tier: 5}
    steps:
      - {player: 0, play: 0}
    expect:
      players:
        - hand: [{card: Triple Reward, counter: 4}, {card: Triple Reward, counter: 4}]   # its own, then the Hero Power's
          auras: {hero: {power: {stacks: 1}}}
        - {hand: [{card: Triple Reward, counter: 6}]}   # (confirmed) the receiver's Tier, locked in as it arrives

  - name: three_times_per_game
    seeds: "1..=2"
    duos_tavern:
      players:
        - auras: {hero: {hero: Gall, power: {stacks: 3}}}
          hand: ["golden Zoatroid"]
        - {}
    steps:
      - {player: 0, play: 0}
    expect:
      players:
        - {hand: [{card: Triple Reward, counter: 2}]}   # only the Golden's own
        - {hand: []}

  - name: a_plain_minion_gives_nothing
    duos_tavern:
      players:
        - {auras: {hero: Gall}, hand: [Zoatroid]}
        - {}
    steps:
      - {player: 0, play: 0}
    expect:
      players:
        - {hand: [], auras: {hero: {power: {stacks: 0}}}}
        - {hand: []}
