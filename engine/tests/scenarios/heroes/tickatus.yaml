hero: Tickatus
scenarios:
  - name: every_4_turns_a_prize_discover_whose_tier_goes_up
    steps:
      - set_hero: Tickatus
      - expect: {health: 30, armor: 17}
      - repeat: 3
        steps: [start_turn, end_turn]
      - expect: {turn: 3, discover_pending: null, auras: {hero: {power: {counter: 3}}}}
      - start_turn
      - expect: {turn: 4, discover_pending: {count: 3, all: {tavern_tier: 1, is_spell: true}}}
      - choose_discover: 0
      - expect: {hand: [{tavern_tier: 1}], auras: {hero: {power: {counter: 0, stacks: 1}}}}
      - end_turn
      - repeat: 3
        steps: [start_turn, end_turn]
      - expect: {turn: 7, discover_pending: null}
      - start_turn
      - expect: {turn: 8, discover_pending: {count: 3, all: {tavern_tier: 2}}}
      - choose_discover: 0
      - end_turn
      - repeat: 3
        steps: [start_turn, end_turn]
      - start_turn
      - expect: {turn: 12, discover_pending: {count: 3, all: {tavern_tier: 3}}}
      - choose_discover: 0
      - end_turn
      - repeat: 3
        steps: [start_turn, end_turn]
      - start_turn
      - expect: {turn: 16, discover_pending: {count: 3, all: {tavern_tier: 4}}}
      - choose_discover: 0
      - end_turn
      - repeat: 3
        steps: [start_turn, end_turn]
      - start_turn
    expect: {turn: 20, discover_pending: {count: 3, all: {tavern_tier: 4}}}

  - name: gained_later_it_counts_from_then_with_the_games_tier
    description: >-
      Training Session on turn 9 gives Prize Wall: its 4 turns count from turn 9 (installed
      mid-turn, its turn start counts that turn), so the prize comes on turn 12, of the game
      turn's Tier 3.
    seeds: "1..200"
    tavern: {turn: 8}
    steps:
      - set_hero: Patchwerk
      - start_turn
      - add_to_hand: Training Session
      - play: Training Session
      - if: {discover_pending: {any: {name: Prize Wall}}}
        then:
          - choose_discover: {name: Prize Wall}
          - expect: {turn: 9, auras: {hero: {power: {counter: 1}}}, discover_pending: null}
          - end_turn
          - repeat: 2
            steps: [start_turn, end_turn]
          - expect: {turn: 11, discover_pending: null}
          - start_turn
          - expect: {turn: 12, discover_pending: {count: 3, all: {tavern_tier: 3}}}
