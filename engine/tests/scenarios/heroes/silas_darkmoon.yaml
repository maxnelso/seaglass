hero: Silas Darkmoon
defaults:
  tavern: {auras: {hero: Silas Darkmoon}}
scenarios:
  - name: each_rolled_minion_may_get_a_ticket
    description: >-
      (engine decision) Chance 1/3 per minion each time the Tavern is rolled: over many seeds, both
      a shop without a ticket and one with several happen.
    seeds: "1..=40"
    steps:
      - start_turn
    expect: {shop: {where: {marked: true}, count: "<= 3"}}

  - name: some_shops_have_two_tickets
    seed: 2
    tavern: {gold: 30}
    steps:
      - start_turn
      - repeat: 12
        steps:
          - if: {shop: {where: {marked: true}, count: "< 2"}}
            then: [refresh]
    expect: {shop: {where: {marked: true}, count: ">= 2"}}

  - name: a_frozen_shop_keeps_its_tickets
    tavern: {is_frozen: true, shop: [{card: "1/1 t1", marked: true}, "2/2 t1", "3/3 t1"]}
    steps:
      - start_turn
    expect: {shop: [{marked: true}, {marked: false}, {marked: false}]}

  - name: buying_a_ticket_counts
    tavern: {gold: 3, shop: [{card: "1/1 t1", marked: true}, "2/2 t1"]}
    steps:
      - buy: 0
    expect: {auras: {hero: {power: {counter: 1}}}, hand: [{marked: false}]}

  - name: three_tickets_discover_a_minion_of_your_tier
    seeds: "1..=3"
    tavern:
      gold: 3
      tavern_tier: 3
      shop: [{card: "1/1 t1", marked: true}]
      auras: {hero: {hero: Silas Darkmoon, power: {counter: 2}}}
    steps:
      - buy: 0
    expect:
      discover_pending: {count: 3, all: {tavern_tier: 3}}
      auras: {hero: {power: {counter: 0}}}

  - name: a_minion_without_a_ticket_doesnt_count
    tavern: {gold: 3, shop: ["1/1 t1"]}
    steps:
      - buy: 0
    expect: {auras: {hero: {power: {counter: 0}}}}
