hero: Madam Goya
scenarios:
  - name: it_passes_a_non_golden_minion
    duos_tavern:
      players:
        - {auras: {hero: Madam Goya}, gold: 10, board: ["Zoatroid +2/+2", "1/1"]}
        - {}
    steps:
      - {player: 0, hero_power: 0}
    expect:
      players:
        - {gold: 8, board: ["1/1"]}
        - {hand: ["Zoatroid 5/4"]}

  - name: a_golden_minion_is_not_a_target
    duos_tavern:
      players:
        - {auras: {hero: Madam Goya}, gold: 10, board: ["golden Zoatroid"]}
        - {}
    steps:
      - {player: 0, expect_illegal: {hero_power: 0}}
