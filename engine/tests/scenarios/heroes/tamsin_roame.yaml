hero: Tamsin Roame
scenarios:
  - name: the_lowest_attack_minion_gives_its_stats_to_the_others_when_it_dies
    description: >-
      A has more minions, so its left-most (the 1/1, which has the Deathrattle) attacks first and
      dies: the 3/3 gains +1/+1.
    combat:
      board_a: ["1/1", "3/3"]
      board_b: ["1/10"]
      auras_a: {hero: Tamsin Roame}
    expect:
      events:
        sequence:
          - {type: death, unit: 0}
          - {type: stat_buff, side: a, unit: 1, atk_delta: 1, hp_delta: 1, reason: Fragrant Phylactery}

  - name: a_tie_is_broken_at_random_left
    description: >-
      (confirmed) The 2/4 and the 2/2 tie; with this seed the 2/4 has it: it dies first and gives
      the others +2/+4.
    seed: 2
    combat:
      board_a: ["2/4", "2/2", "5/50"]
      board_b: ["9/30"]
      auras_a: {hero: Tamsin Roame}
    expect:
      events:
        sequence:
          - {type: death, unit: 0}
          - {type: stat_buff, unit: 1, atk_delta: 2, hp_delta: 4, reason: Fragrant Phylactery}

  - name: a_tie_is_broken_at_random_right
    description: >-
      (confirmed) The same board; with this seed the 2/2 has it: the 2/4 dies giving nothing, then
      the 2/2 gives the 5/50 +2/+2.
    seed: 1
    combat:
      board_a: ["2/4", "2/2", "5/50"]
      board_b: ["9/30"]
      auras_a: {hero: Tamsin Roame}
    expect:
      events:
        all_of:
          - {where: {type: stat_buff, reason: Fragrant Phylactery}, count: 1}
          - {any: {type: stat_buff, unit: 2, atk_delta: 2, hp_delta: 2, reason: Fragrant Phylactery}}

  - name: it_gives_the_health_it_had_before_damage
    combat:
      board_a: ["2/6", "8/30"]
      board_b: ["3/60"]
      auras_a: {hero: Tamsin Roame}
    expect:
      events: {any: {type: stat_buff, unit: 1, atk_delta: 2, hp_delta: 6, reason: Fragrant Phylactery}}

  - name: titus_rivendare_triggers_it_again
    combat:
      board_a: ["1/1", {card: Titus Rivendare, attack: 2}]
      board_b: ["1/50"]
      auras_a: {hero: Tamsin Roame}
    expect:
      events: {where: {type: stat_buff, reason: Fragrant Phylactery}, count: 2}

  - name: the_tavern_minion_keeps_nothing
    tavern: {auras: {hero: Tamsin Roame}, board: ["1/1", "3/3"]}
    steps:
      - fight: {board: ["1/10"]}
    expect: {board: ["1/1", "3/3"]}
