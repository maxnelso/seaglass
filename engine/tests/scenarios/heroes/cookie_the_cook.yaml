hero: Cookie the Cook
defaults:
  tavern: {auras: {hero: Cookie the Cook}, gold: 10}
scenarios:
  - name: stir_the_pot_gathers_three_minion_types_without_removing_them_and_discovers
    tavern:
      board: ["2/2 Beast"]
      shop: ["3/3 Murloc", "4/4"]
    steps:
      - expect_illegal: {hero_power: 8}
      - hero_power: 0
      - expect:
          board: ["2/2 Beast"]
          auras: {hero: {power: {uses_left: 0, counter: 1}}}
      - start_turn
      - push_shop: ["3/3 Murloc"]
      - hero_power: 7
      - expect:
          auras: {hero: {power: {uses_left: 0, counter: 2}}}
      - start_turn
      - push_board: ["5/5 Dragon"]
      - hero_power: 1
      - expect:
          board: ["2/2 Beast", "5/5 Dragon"]
          auras: {hero: {power: {uses_left: 0, counter: 0, stacks: 0}}}
          discover_pending: ["beast", "murloc", "dragon"]
      - choose_discover: 0
    expect:
      discover_pending: null
      hand: ["beast"]
