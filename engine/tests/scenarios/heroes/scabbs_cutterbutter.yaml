hero: Scabbs Cutterbutter
scenarios:
  - name: i_spy_discovers_plain_copy_from_next_opponent_warband
    steps:
      - set_hero: Scabbs Cutterbutter
      - set:
          gold: 5
          lobby:
            opponents:
              - last_warband: ["golden Joyous 10/10 divine_shield", "Zoatroid 8/9", "Wrath Weaver 5/5"]
            next_opponent: 0
      - expect: {health: 30, armor: 18}
      - expect_legal: hero_power
      - hero_power
      - expect:
          gold: 3
          discover_pending:
            count: 3
            contains:
              - "Joyous 2/3 -golden -divine_shield"
              - "Zoatroid 3/2"
              - "Wrath Weaver 1/3"
      - choose_discover: Joyous
      - expect:
          discover_pending: null
          hand: ["Joyous 2/3 -golden -divine_shield"]
      - start_turn
      - set:
          lobby:
            opponents:
              - last_warband: []
            next_opponent: 0
      - expect_illegal: hero_power

  - name: i_spy_samples_up_to_3_and_does_not_leak_to_pool
    steps:
      - set_hero: Scabbs Cutterbutter
      - set:
          gold: 5
          lobby:
            opponents:
              - last_warband: [Joyous, Zoatroid, Wrath Weaver, Lullabot, Cord Puller]
            next_opponent: 0
      - expect: {pool_size: {capture: before}}
      - hero_power
      - expect: {discover_pending: {count: 3}}
      - choose_discover: 0
      - expect:
          pool_size: {same_as: before}
          hand: {count: 1}
