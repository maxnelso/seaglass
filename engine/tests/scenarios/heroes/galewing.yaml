hero: Galewing
defaults:
  tavern: {auras: {hero: Galewing}}
scenarios:
  - name: it_offers_three_flightpaths
    steps:
      - hero_power
    expect: {discover_pending: [{name: Westfall}, {name: Ironforge}, {name: Eastern Plaguelands}]}

  - name: westfall_gives_a_1_cost_tavern_spell_next_turn
    seeds: "1..=3"
    steps:
      - hero_power
      - choose_discover: {name: Westfall}
      - expect: {auras: {hero: {power: {counter: 1}}}}
      - expect_illegal: hero_power
      - end_turn
      - start_turn
    expect:
      hand: [{is_spell: true, spell_cost: 1}]
      auras: {hero: {power: {card_id: 75703}}}

  - name: ironforge_gives_2_gold_in_2_turns
    steps:
      - hero_power
      - choose_discover: {name: Ironforge}
      - end_turn
      - start_turn
      - expect: {gold: 3, auras: {hero: {power: {counter: 1}}}}
      - end_turn
      - start_turn
    expect: {gold: 6}   # 4 + 2

  - name: eastern_plaguelands_discovers_a_minion_of_your_tier_in_3_turns
    seeds: "1..=3"
    tavern: {tavern_tier: 3}
    steps:
      - hero_power
      - choose_discover: {name: Eastern Plaguelands}
      - end_turn
      - start_turn
      - end_turn
      - start_turn
      - expect: {discover_pending: null}
      - end_turn
      - start_turn
    expect: {discover_pending: {count: 3, all: {tavern_tier: 3}}}
