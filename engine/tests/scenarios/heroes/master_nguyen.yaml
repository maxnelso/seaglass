hero: Master Nguyen
scenarios:
  - name: chooses_from_two_new_hero_powers_at_the_start_of_every_turn
    seed: 17
    steps:
      - set_hero: Master Nguyen
      - expect:
          health: 30
          armor: 10
          auras: {hero: {power: {card_id: 71909, uses_left: 0}}}
      - start_turn
      - expect:
          discover_pending:
            count: 2
            none: {card_id: 71909}
            0: {card_id: {capture: turn1_power}}
      - choose_discover: 0
      - expect:
          discover_pending: null
          auras: {hero: {power: {card_id: {same_as: turn1_power}}}}
      - end_turn
      - start_turn
      - expect:
          discover_pending:
            count: 2
            none: {card_id: 71909}
            1: {card_id: {capture: turn2_power}}
      - choose_discover: 1
      - expect:
          discover_pending: null
          auras: {hero: {power: {card_id: {same_as: turn2_power}}}}

  - name: the_outgoing_hero_power_cleans_up_what_it_keeps
    description: Tavish's loaded minion goes back to the pool when Nguyen takes his Hero Power back (`hero_power_removed`).
    tavern: {shop: [Lurking Leviathan]}
    steps:
      - set_hero: Master Nguyen
      - set: {auras: {hero: {power: {card_id: 123150, cost: 0, uses_left: 1}}}}
      - take_from_pool: [Lurking Leviathan]
      - expect: {pool: {Lurking Leviathan: {capture: before}}}
      - hero_power: 0
      - expect: {pool: {Lurking Leviathan: "$before"}, auras: {hero: {power: {stored: [Lurking Leviathan]}}}}
      - start_turn
      - expect:
          pool: {Lurking Leviathan: "$before + 1"}
          auras: {hero: {power: {card_id: 71909, stored: []}}}

  - name: millhouses_upgrade_cost_comes_off_with_his_hero_power
    steps:
      - set_hero: Master Nguyen
      - start_turn
      - expect: {upgrade_cost: {capture: cost}}
      - set: {discover_pending: [{card: "0/1", card_id: 60405, is_spell: true, to_hero_power: true}]}
      - choose_discover: 0
      - expect: {upgrade_cost: "$cost + 1"}
      - end_turn
      - start_turn
      - expect: {upgrade_cost: "$cost - 1", auras: {hero: {power: {card_id: 71909}}}}

  - name: saurfangs_and_rakanishus_bonuses_come_off_with_their_hero_powers
    steps:
      - set_hero: Master Nguyen
      - start_turn
      - set: {discover_pending: [{card: "0/1", card_id: 71455, is_spell: true, to_hero_power: true}]}
      - choose_discover: 0
      - expect: {auras: {tavern_all_atk: 1, tavern_all_hp: 1}}
      - end_turn
      - start_turn
      - expect: {auras: {tavern_all_atk: 0, tavern_all_hp: 0}}
      - set: {discover_pending: [{card: "0/1", card_id: 122960, is_spell: true, to_hero_power: true}]}
      - choose_discover: 0
      - expect: {auras: {spell_bonus_atk: 1, spell_bonus_hp: 1}}
      - end_turn
      - start_turn
      - expect: {auras: {spell_bonus_atk: 0, spell_bonus_hp: 0}}

  - name: barovs_wager_is_settled_when_his_hero_power_goes
    steps:
      - set_hero: Master Nguyen
      - set: {lobby: {opponents: [{}, {}], featured_pair: [0, 1]}}
      - start_turn
      - set: {discover_pending: [{card: "0/1", card_id: 63600, is_spell: true, to_hero_power: true}]}
      - choose_discover: 0
      - hero_power: 0
      - end_turn
      - set: {lobby: {last_pair_outcome: a_win}}
      - start_turn
      - expect: {hand: {count: 3, all: Tavern Coin}, auras: {hero: {power: {card_id: 71909}}}}
