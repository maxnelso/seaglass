hero: Sir Finley Mrrgglton
scenarios:
  - name: discovers_a_hero_power_at_start_of_game_and_replaces_adventure
    seed: 42
    steps:
      - set_hero: Sir Finley Mrrgglton
      - expect:
          health: 30
          armor: 14
          auras: {hero: {power: {card_id: 60450, uses_left: 0}}}
      - start_turn
      - expect:
          discover_pending:
            count: 3
            none: {card_id: 60450}
            0: {card_id: {capture: chosen_power}}
      - choose_discover: 0
      - expect:
          discover_pending: null
          auras: {hero: {power: {card_id: {same_as: chosen_power}}}}
      - end_turn
      - start_turn
      - expect:
          discover_pending: null
          auras: {hero: {power: {card_id: {same_as: chosen_power}}}}

  - name: a_start_of_game_hero_power_brings_its_gift
    description: >
      (confirmed) Finley may be offered Patchwerk's Hero Power; another hero who gets it gains its
      30 extra Health then (engine decision).
    steps:
      - set_hero: Sir Finley Mrrgglton
      - set: {discover_pending: [{card: "0/1", card_id: 59399, is_spell: true, to_hero_power: true}]}
      - choose_discover: 0
      - expect: {health: 60, auras: {hero: {power: {card_id: 59399}}}}
