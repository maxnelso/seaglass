hero: Sir Finley Mrrgglton
scenarios:
  - name: discovers_a_hero_power_at_start_of_game_and_replaces_adventure
    seed: 42
    steps:
      - set_hero: Sir Finley Mrrgglton
      - expect:
          health: 30
          armor: 14
          auras: {hero: {power: {card_id: 60450, uses_left: 0}}}
      - start_turn
      - expect:
          discover_pending:
            count: 3
            none: {card_id: 60450}
            0: {card_id: {capture: chosen_power}}
      - choose_discover: 0
      - expect:
          discover_pending: null
          auras: {hero: {power: {card_id: {same_as: chosen_power}}}}
      - end_turn
      - start_turn
      - expect:
          discover_pending: null
          auras: {hero: {power: {card_id: {same_as: chosen_power}}}}
