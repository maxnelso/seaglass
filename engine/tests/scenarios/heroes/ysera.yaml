hero: Ysera
defaults:
  tavern: {auras: {hero: Ysera}, gold: 10}
scenarios:
  - name: a_refresh_offers_an_extra_dragon
    seeds: "1..=4"
    steps:
      - refresh
    expect: {shop: {all_of: [{count: 4}, {-1: "dragon"}]}}

  - name: the_turns_new_shop_has_it_too
    seeds: "1..=4"
    tavern: {gold: 0}
    steps:
      - start_turn
    expect: {shop: {all_of: [{count: 4}, {-1: "dragon"}]}}

  - name: a_frozen_shop_gets_none
    tavern: {gold: 0, shop: ["1/1", "1/1", "1/1"], is_frozen: true}
    steps:
      - start_turn
    expect: {shop: ["1/1", "1/1", "1/1"]}

  - name: the_dragon_is_of_your_tier_or_lower
    seeds: "1..=4"
    tavern: {tavern_tier: 2}
    steps:
      - refresh
    expect: {shop: {all_of: [{count: 5}, {-1: {tavern_tier: "<= 2"}}]}}

  - name: it_is_never_an_action
    steps:
      - expect_illegal: hero_power

  - name: a_full_tavern_has_no_room_for_it
    description: The Tavern holds 7 cards (docs/tavern.md §3.2) - at Tier 6, 6 minions and a spell.
    tavern: {tavern_tier: 6, include_shop_spells: true}
    steps:
      - refresh
    expect: {shop: {count: 7}}
