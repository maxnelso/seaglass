hero: C'Thun
defaults:
  tavern: {auras: {hero: C'Thun}, gold: 10}
scenarios:
  - name: using_it_buffs_a_friendly_minion_at_end_of_turn
    tavern: {turn: 1, board: ["1/1"]}
    steps:
      - hero_power
      - expect: {gold: 9, board: ["1/1"]}
      - end_turn
    expect: {board: ["2/2"]}

  - name: it_repeats_once_more_each_turn
    description: (engine decision) On turn 3, three times.
    tavern: {turn: 3, board: ["1/1"]}
    steps:
      - hero_power
      - end_turn
    expect: {board: ["4/4"]}

  - name: without_using_it_nothing_happens
    tavern: {turn: 3, board: ["1/1"]}
    steps:
      - end_turn
    expect: {board: ["1/1"]}

  - name: the_minions_are_random
    seeds: "1..=4"
    tavern: {turn: 4, board: ["1/1", "1/1"]}
    steps:
      - hero_power
      - end_turn
    expect: {board: {sum: {attack: 6}}}

  - name: twice_with_ghastly_sticker
    description: Every end-of-turn effect triggers an extra time (confirmed); the arming is used once.
    tavern: {turn: 1, board: ["1/1"], auras: {hero: C'Thun, trinkets: [Ghastly Sticker]}}
    steps:
      - hero_power
      - end_turn
    expect: {board: ["3/3"], auras: {hero: {power: {armed: 0}}}}

  - name: twice_with_drakkari_enchanter
    description: (confirmed) 2 buffs, on the 1/1 or the Enchanter.
    tavern: {turn: 1, board: ["1/1", Drakkari Enchanter]}
    steps:
      - hero_power
      - end_turn
    expect: {board: {sum: {attack: 4, health: 8}}}

  - name: three_times_with_both
    description: (confirmed) The extras add up.
    tavern: {turn: 1, board: ["1/1", Drakkari Enchanter], auras: {hero: C'Thun, trinkets: [Ghastly Sticker]}}
    steps:
      - hero_power
      - end_turn
    expect: {board: {sum: {attack: 5, health: 9}}}
