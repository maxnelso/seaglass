hero: Tras'tath, Soul Parasite
defaults:
  tavern: {auras: {hero: "Tras'tath, Soul Parasite"}}
scenarios:
  - name: the_first_turn_discovers_a_locked_tier_5_minion_with_a_dark_gift
    seeds: "1..=10"
    steps:
      - start_turn
    expect:
      turn: 1
      discover_pending: {count: 3, all: {tavern_tier: 5, locked_turns: 6, dark_gifts: {count: 1}}}

  - name: it_unlocks_on_turn_7
    description: (engine decision)
    seeds: "1..=3"
    steps:
      - start_turn
      - choose_discover: 0
      - expect: {hand: [{tavern_tier: 5, locked_turns: 6, dark_gifts: {count: 1}}]}
      - expect_illegal: {play: 0}
      - end_turn
      - start_turn
      - end_turn
      - start_turn
      - end_turn
      - start_turn
      - end_turn
      - start_turn
      - end_turn
      - start_turn
      - expect: {turn: 6, hand: [{locked_turns: 1}]}
      - expect_illegal: {play: 0}
      - end_turn
      - start_turn
      - expect: {turn: 7, hand: [{locked_turns: 0}]}
      - play: 0
    expect: {board: [{tavern_tier: 5, dark_gifts: {count: 1}}]}

