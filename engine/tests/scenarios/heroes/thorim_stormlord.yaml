hero: Thorim, Stormlord
defaults:
  tavern: {auras: {hero: "Thorim, Stormlord"}}
scenarios:
  - name: the_first_turn_starts_with_a_discover_of_locked_tier_7_minions
    seeds: "1..=4"
    steps:
      - start_turn
      - expect: {discover_pending: {count: 3, all: {tavern_tier: 7, locked: true}}}
      - choose_discover: 0
      - expect_illegal: {play: 0}
    expect: {hand: [{tavern_tier: 7, locked: true}], discover_pending: null}

  - name: after_60_gold_spent_the_minion_unlocks_and_can_be_played
    seed: 1
    tavern: {gold: 100}
    steps:
      - start_turn
      - choose_discover: 0
      - expect: {hand: [{tavern_tier: 7, locked: true}]}
      - expect_illegal: {play: 0}
      - set: {gold: 100, shop: ["1/1"]}
      - set: {auras: {hero: {power: {counter: 57}}}}
      - buy: 0
      - expect: {hand: [{tavern_tier: 7, locked: false}, "1/1"]}
      - play: 0
    expect: {board: [{tavern_tier: 7}], hand: ["1/1"]}

  - name: before_60_still_locked
    seed: 1
    steps:
      - start_turn
      - choose_discover: 0
      - set: {gold: 100, shop: ["1/1"]}
      - buy: 0
      - expect_illegal: {play: 0}
    expect: {hand: [{tavern_tier: 7, locked: true}, "1/1"], auras: {hero: {power: {counter: 3}}}}

  - name: it_is_never_an_action
    steps:
      - start_turn
      - choose_discover: 0
      - expect_illegal: hero_power
