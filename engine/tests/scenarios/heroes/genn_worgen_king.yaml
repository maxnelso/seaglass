hero: Genn, Worgen King
scenarios:
  - name: counts_down_and_discovers_two_hero_powers_on_turn_4
    seed: 23
    steps:
      - set_hero: "Genn, Worgen King"
      - expect:
          health: 30
          armor: 7
          auras: {hero: {power: {card_id: 129685, counter: 3}, second_power: null}}
      - start_turn
      - expect:
          turn: 1
          discover_pending: null
          auras: {hero: {power: {counter: 3}, second_power: null}}
      - end_turn
      - start_turn
      - expect:
          turn: 2
          discover_pending: null
          auras: {hero: {power: {counter: 2}, second_power: null}}
      - end_turn
      - start_turn
      - expect:
          turn: 3
          discover_pending: null
          auras: {hero: {power: {counter: 1}, second_power: null}}
      - end_turn
      - start_turn
      - expect:
          turn: 4
          discover_pending:
            count: 3
            0: {card_id: {capture: first_power}}
      - choose_discover: 0
      - expect:
          auras: {hero: {power: {card_id: {same_as: first_power}}, second_power: null}}
          discover_pending:
            count: 3
            none: {card_id: {same_as: first_power}}
            0: {card_id: {capture: second_power}}
      - choose_discover: 0
      - expect:
          discover_pending: null
          auras:
            hero:
              power: {card_id: {same_as: first_power}}
              second_power: {card_id: {same_as: second_power}}

  - name: both_hero_powers_can_be_used_in_the_same_turn
    seed: 23
    steps:
      - set_hero: "Genn, Worgen King"
      - repeat: 3
        steps: [start_turn, end_turn]
      - start_turn
      - choose_discover: 0
      - choose_discover: 0
      - set:
          gold: 10
          board: ["2/2"]
          auras:
            hero:
              power: {card_id: 57562, cost: 1, uses_left: 1}
              second_power: {card_id: 71459, cost: 1, uses_left: 1, counter: 0}
      - hero_power: 0
      - hero_power_2
      - expect:
          gold: 8
          board:
            0: "2/2 divine_shield"
          hand:
            count: 2
            all: Blood Gem
          auras:
            hero:
              power: {uses_left: 0}
              second_power: {uses_left: 1, counter: 1}
