prize: On the House
scenarios:
  - name: it_discovers_a_minion_of_your_tier
    seeds: "1..20"
    tavern: {tavern_tier: 5}
    steps:
      - add_to_hand: On the House
      - play: On the House
    expect: {discover_pending: {count: 3, all: {tavern_tier: 5, is_spell: false}}}

  - name: the_options_come_from_the_pool
    tavern: {tavern_tier: 2, catalog: tier1_2}
    steps:
      - expect: {pool_size: {capture: before}}
      - add_to_hand: On the House
      - play: On the House
      - expect: {pool_size: "$before - 3"}
      - choose_discover: 0
    expect: {pool_size: "$before - 1", hand: [{tavern_tier: 2}]}
