prize: Banana Bunch
scenarios:
  - name: it_gives_2_tavern_dish_bananas
    steps:
      - add_to_hand: Banana Bunch
      - play: Banana Bunch
    expect: {hand: [Tavern Dish Banana, Tavern Dish Banana]}

  - name: a_banana_waits_for_room_in_a_full_hand
    tavern: {hand: [Banana Bunch, Joyous, Joyous, Zoatroid, Zoatroid, Wrath Weaver, Wrath Weaver, Glim Guardian, Glim Guardian, Dune Dweller]}
    steps:
      - play: Banana Bunch
    expect:
      hand: {count: 10, -1: Tavern Dish Banana}
      waiting_for_hand: [Tavern Dish Banana]

  - name: the_bananas_are_tavern_spells
    tavern: {board: [Iron Groundskeeper]}
    steps:
      - add_to_hand: Banana Bunch
      - play: {hand: 0, pos: 0}
      - play: {hand: 0, pos: 0}
    expect: {board: ["Iron Groundskeeper 4/4"], auras: {tavern_spells_cast: 1}}
