prize: Time Thief
scenarios:
  - name: it_discovers_a_plain_copy_from_the_last_opponents_warband
    tavern:
      hand: [Time Thief]
      lobby:
        opponents:
          - last_warband: ["golden Joyous 10/10 divine_shield", "Zoatroid 8/9", "Wrath Weaver 5/5", "Zoatroid 3/2"]
          - last_warband: [Dune Dweller]
        last_opponent: 0
    steps:
      - play: Time Thief
      - expect:
          discover_pending:
            count: 3
            contains: ["Joyous 2/3 -golden -divine_shield", "Zoatroid 3/2", "Wrath Weaver 1/3"]
      - choose_discover: Zoatroid
    expect: {hand: ["Zoatroid 3/2"], discover_pending: null}

  - name: the_copies_arent_from_the_pool
    tavern:
      catalog: tier1
      hand: [Time Thief]
      lobby: {opponents: [{last_warband: [Joyous, Zoatroid, Wrath Weaver]}], last_opponent: 0}
    steps:
      - expect: {pool_size: {capture: before}}
      - play: Time Thief
      - choose_discover: 0
    expect: {pool_size: "$before"}

  - name: nothing_without_a_last_opponent
    tavern: {hand: [Time Thief], lobby: {opponents: [{last_warband: [Joyous]}]}}
    steps:
      - play: Time Thief
      - expect: {discover_pending: null, hand: []}
      - set: {lobby: {opponents: [{last_warband: [Joyous]}], last_opponent: 0}}
      - add_to_hand: Time Thief
      - play: Time Thief
    expect: {discover_pending: [Joyous]}
