trinket: All-Purpose Kibble
scenarios:
  - name: each_attack_gains_more_attack
    description: >-
      The Beast's first attack gains +3 Attack, the next +4 (each improvement is +1, an engine
      decision): 4 then 8 damage kill the 0/9, and the improvements stay.
    seeds: "1..=3"
    tavern: {board: ["1/10 beast"], auras: {trinkets: [All-Purpose Kibble]}}
    steps:
      - fight: {board: ["0/9"]}
    expect:
      combat:
        events:
          where: {type: stat_buff, reason: All-Purpose Kibble}
          sequence: [{atk_delta: 3}, {atk_delta: 4}]
          count: 2
      auras: {trinkets: [{stacks: 2}]}
