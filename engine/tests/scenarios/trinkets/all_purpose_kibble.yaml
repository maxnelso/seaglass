trinket: All-Purpose Kibble
scenarios:
  - name: each_attack_gains_more_attack
    description: >-
      The Beast's first attack gains +4 Attack, the next +5 (each improvement is +1, an engine
      decision): 5 then 10 damage kill the 0/10, and the improvements stay.
    seeds: "1..=3"
    tavern: {board: ["1/10 beast"], auras: {trinkets: [All-Purpose Kibble]}}
    steps:
      - fight: {board: ["0/10"]}
    expect:
      combat:
        events:
          where: {type: stat_buff, reason: All-Purpose Kibble}
          sequence: [{atk_delta: 4}, {atk_delta: 5}]
          count: 2
      auras: {trinkets: [{stacks: 2}]}
