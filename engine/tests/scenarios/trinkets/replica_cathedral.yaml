trinket: Replica Cathedral
scenarios:
  - name: the_first_spell_each_turn_casts_twice
    tavern: {turn: 5, gold: 10, board: ["1/1"], hand: [Repair Job, Repair Job], auras: {trinkets: [Replica Cathedral]}}
    steps:
      - play: {hand: 0, pos: 0}
      - expect: {board: ["9/17"], auras: {tavern_spells_cast: 2}}
      - play: {hand: 0, pos: 0}
      - expect: {board: ["13/25"], auras: {tavern_spells_cast: 3}}
      - end_turn
      - start_turn
    expect: {auras: {trinkets: [{armed: 0}]}}
