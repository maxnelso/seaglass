trinket: Glass of Perspective
scenarios:
  - name: a_choose_one_minion_now_and_each_turn
    seeds: "1..=4"
    tavern: {turn: 5, tavern_tier: 6}
    steps:
      - give_trinket: Glass of Perspective
      - expect: {hand: {count: 1, all: {is_spell: false}}}
      - end_turn
      - start_turn
    expect: {hand: {count: 2, all: {is_spell: false}}}
