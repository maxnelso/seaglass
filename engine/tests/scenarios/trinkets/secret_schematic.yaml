trinket: Secret Schematic
scenarios:
  - name: buying_a_mech_gives_a_tavern_spell
    tavern: {gold: 10, shop: ["1/1 mech", "1/1 beast"], auras: {trinkets: [Secret Schematic]}}
    steps:
      - buy: 1
      - expect: {hand: {count: 1}}
      - buy: 0
    expect: {hand: {count: 3, -1: {is_spell: true}}}
