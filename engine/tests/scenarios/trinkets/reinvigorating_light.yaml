trinket: Reinvigorating Light
scenarios:
  - name: picked_it_gives_3_gold_and_discovers_a_second_hero_power
    seeds: "1..=3"
    tavern: {gold: 0, auras: {hero: Edwin VanCleef}}
    steps:
      - give_trinket: Reinvigorating Light
      - expect: {gold: 3, discover_pending: {count: 3}}
      - choose_discover: 0
    expect:
      auras: {hero: {power: {card_id: 57567}, second_power: {card_id: "!= 0", uses_left: "<= 1"}}}
      discover_pending: null

  - name: without_a_hero_only_the_gold
    tavern: {gold: 1}
    steps:
      - give_trinket: Reinvigorating Light
    expect: {gold: 4, discover_pending: null}
