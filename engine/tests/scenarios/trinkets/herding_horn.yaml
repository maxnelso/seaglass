trinket: Herding Horn
scenarios:
  - name: a_rally_minion_attacking_gives_a_free_refresh
    seeds: "1..=3"
    tavern: {board: ["Bigwig Bandit 4/3"], auras: {trinkets: [Herding Horn]}}
    steps:
      - fight: {board: ["1/100"]}
    expect: {auras: {free_refreshes: ">= 1"}}

  - name: not_for_other_minions
    tavern: {board: ["4/3"], auras: {trinkets: [Herding Horn]}}
    steps:
      - fight: {board: ["1/100"]}
    expect: {auras: {free_refreshes: 0}}
