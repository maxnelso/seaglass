trinket: Book of Medivh
scenarios:
  - name: a_discover_of_tavern_spells_as_picked_and_each_turn
    seeds: "1..=3"
    tavern: {turn: 6, tavern_tier: 3}
    steps:
      - give_trinket: Book of Medivh
      - expect: {discover_pending: {count: 3, all: {is_spell: true, tavern_tier: "<= 3"}}, discover_queue: []}
      - choose_discover: 0
      - expect: {hand: {count: 1, all: {is_spell: true}}, discover_pending: null}
      - end_turn
      - start_turn
    expect: {discover_pending: {count: 3, all: {is_spell: true}}}
