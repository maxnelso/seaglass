trinket: Training Certificate
scenarios:
  - name: the_two_lowest_attack_minions_double_their_stats
    combat:
      board_a: ["3/3", "1/2", "2/1", "5/5"]
      board_b: []
      auras_a: {trinkets: [Training Certificate]}
    expect: {survivors_a: ["3/3", "2/4", "4/2", "5/5"]}

  - name: ties_are_broken_at_random
    description: Two of the three tied 1-Attack minions double their stats (confirmed).
    seeds: "1..=8"
    combat:
      board_a: ["1/1", "1/2", "1/3"]
      board_b: []
      auras_a: {trinkets: [Training Certificate]}
    expect: {survivors_a: {where: {attack: 2}, count: 2}}

  - name: a_tie_may_skip_the_left_most
    seed: 1
    combat:
      board_a: ["1/1", "1/2", "1/3"]
      board_b: []
      auras_a: {trinkets: [Training Certificate]}
    expect: {survivors_a: {2: "2/6"}}

  - name: or_take_the_left_most
    seed: 2
    combat:
      board_a: ["1/1", "1/2", "1/3"]
      board_b: []
      auras_a: {trinkets: [Training Certificate]}
    expect: {survivors_a: ["2/2", "2/4", "1/3"]}

  - name: it_comes_after_the_hero_power
    description: >-
      Step 1c follows the Hero Powers (docs/trinkets.md §7.2): Deathwing's +2 Attack comes
      first, so the two lowest are the 3/1 and the 5/3, doubled to 6/2 and 10/6.
    combat:
      board_a: ["1/1", "5/5", "3/3"]
      board_b: []
      auras_a: {hero: Deathwing, trinkets: [Training Certificate]}
    expect: {survivors_a: ["6/2", "7/5", "10/6"]}
