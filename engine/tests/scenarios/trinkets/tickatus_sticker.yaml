trinket: Tickatus Sticker
scenarios:
  - name: picked_it_discovers_a_tier_3_prize
    tavern: {turn: 6}
    steps:
      - give_trinket: Tickatus Sticker
      - expect: {discover_pending: {count: 3, all: {tavern_tier: 3, is_spell: true}}}
      - choose_discover: 0
    expect: {hand: [{tavern_tier: 3}]}

  - name: every_three_turns_another
    tavern: {turn: 6, auras: {trinkets: [Tickatus Sticker]}}
    steps:
      - start_turn
      - start_turn
      - expect: {turn: 8, discover_pending: null}
      - start_turn
    expect: {turn: 9, discover_pending: {count: 3, all: {tavern_tier: 3}}}

  - name: its_tier_3_whatever_the_tavern_tier
    tavern: {tavern_tier: 6}
    steps:
      - give_trinket: Tickatus Sticker
    expect: {discover_pending: {count: 3, all: {tavern_tier: 3}}}
