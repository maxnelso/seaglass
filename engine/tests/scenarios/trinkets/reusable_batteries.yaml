trinket: Reusable Batteries
scenarios:
  - name: the_first_two_minions_bought_each_turn_give_satellites_with_their_stats
    tavern: {gold: 10, shop: ["3/5", "2/2", "1/1"], auras: {trinkets: [Reusable Batteries]}}
    steps:
      - buy: 0
      - buy: 0
      - buy: 0
    expect:
      hand:
        - "3/5"
        - {name: Satellite, attack: 3, health: 5, magnetic: true}
        - "2/2"
        - {name: Satellite, attack: 2, health: 2, magnetic: true}
        - "1/1"

  - name: again_the_next_turn
    tavern: {turn: 5, gold: 10, shop: ["3/5"], auras: {trinkets: [{trinket: Reusable Batteries, armed: 2}]}}
    steps:
      - end_turn
      - start_turn
      - buy: 0
    expect: {hand: {where: {name: Satellite}, count: 1}}
