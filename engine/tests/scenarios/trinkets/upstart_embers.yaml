trinket: Upstart Embers
scenarios:
  - name: a_refresh_doubles_the_highest_health_tavern_minion
    seeds: "1..=3"
    tavern: {gold: 10, auras: {trinkets: [Upstart Embers]}}
    steps:
      - refresh
    expect:
      shop: {any: {attack: "@base_attack + @base_attack", health: "@base_health + @base_health"}}

  - name: not_the_new_shop_of_a_turn_start
    seeds: "1..=3"
    tavern: {turn: 5, auras: {trinkets: [Upstart Embers]}}
    steps:
      - end_turn
      - start_turn
    expect:
      shop: {none: {attack: "@base_attack + @base_attack", health: "@base_health + @base_health"}}

