trinket: Eternal Portrait (Greater)
scenarios:
  - name: picked_it_gives_a_golden_eternal_knight
    tavern: {gold: 10}
    steps:
      - give_trinket: Eternal Portrait (Greater)
    expect: {hand: ["golden Eternal Knight"]}

  - name: each_friendly_undead_death_counts_for_the_knights
    description: A Knight's death counts as a Knight's and as an Undead's (engine decision).
    tavern: {board: [Eternal Knight, "1/1 undead", "1/1 beast"], auras: {trinkets: [Eternal Portrait (Greater)]}}
    steps:
      - fight: {board: ["50/50"]}
    expect: {auras: {counters: {Eternal Knight: [3, 0]}}}
