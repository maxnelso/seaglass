trinket: Deathly Phylactery
scenarios:
  - name: a_discover_of_deathrattle_minions
    seeds: "1..=3"
    tavern: {turn: 6, tavern_tier: 3}
    steps:
      - give_trinket: Deathly Phylactery
    expect: {discover_pending: {count: 3, all: {tavern_tier: "<= 3", is_spell: false}}}

  - name: the_first_deathrattle_each_combat_triggers_an_extra_time
    description: The first Harmless Bonehead summons 4 Skeletons, the second 2.
    combat:
      board_a: [Harmless Bonehead, Harmless Bonehead]
      board_b: ["1/100"]
      auras_a: {trinkets: [Deathly Phylactery]}
    expect: {events: {where: {type: unit_summoned, side: a, name: Skeleton}, count: 6}}
