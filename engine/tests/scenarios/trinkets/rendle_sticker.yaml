trinket: Rendle Sticker
scenarios:
  - name: it_steals_the_highest_tier_card_now_and_at_each_turn_end
    description: Nothing is paid. With this seed the tie of Tier 3 cards goes to the 4/4 first.
    seed: 2
    tavern: {gold: 3, shop: ["1/1 t1", "4/4 t3", "5/5 t3", "2/2 t2"]}
    steps:
      - give_trinket: Rendle Sticker
      - expect: {gold: 3, hand: ["4/4"], shop: ["1/1", "5/5", "2/2"]}
      - end_turn
    expect: {hand: ["4/4", "5/5"], shop: ["1/1", "2/2"]}

  - name: ties_are_broken_at_random
    description: With this seed the tie goes to the 5/5 (confirmed).
    seed: 1
    tavern: {gold: 3, shop: ["1/1 t1", "4/4 t3", "5/5 t3", "2/2 t2"]}
    steps:
      - give_trinket: Rendle Sticker
    expect: {hand: ["5/5"], shop: ["1/1", "4/4", "2/2"]}
