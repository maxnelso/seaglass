trinket: Insurrectionist's Blade
scenarios:
  - name: every_rally_triggers_at_the_end_of_turn
    seeds: "1..=3"
    tavern: {board: [Bigwig Bandit, "1/1"], auras: {trinkets: [Insurrectionist's Blade]}}
    steps:
      - end_turn
    expect: {hand: {count: 1, all: {is_spell: true}}}

  - name: nothing_without_a_rally_minion
    tavern: {board: ["1/1"], auras: {trinkets: [Insurrectionist's Blade]}}
    steps:
      - end_turn
    expect: {hand: []}
