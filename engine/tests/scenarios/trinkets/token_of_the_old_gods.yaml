trinket: Token of the Old Gods
scenarios:
  - name: the_chosen_minion_transforms_into_one_a_tier_higher
    seeds: "1..=3"
    tavern: {board: ["1/1", Joyous], auras: {trinkets: [Token of the Old Gods]}}
    steps:
      - start_turn
      - expect: {hand: [{name: Token of the Old Gods, is_spell: true}]}
      - play: {hand: 0, pos: 1}
      - expect: {discover_pending: {count: 3, all: {tavern_tier: 2}}}
      - choose_discover: 0
    expect: {board: {count: 2, 0: "1/1", 1: {tavern_tier: 2, trinket_marks: []}}, hand: [], discover_pending: null}
