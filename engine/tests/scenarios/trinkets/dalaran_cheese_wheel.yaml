trinket: Dalaran Cheese Wheel
scenarios:
  - name: tavern_minions_have_two_two
    tavern: {turn: 9, shop: ["1/1"]}
    steps:
      - give_trinket: Dalaran Cheese Wheel
    expect: {shop: ["3/3"], auras: {tavern_all_atk: 2, tavern_all_hp: 2}}

  - name: the_fourth_refresh_improves_it
    tavern: {gold: 10, auras: {tavern_all_atk: 2, tavern_all_hp: 2, trinkets: [{trinket: Dalaran Cheese Wheel, counter: 3}]}}
    steps:
      - refresh
    expect: {auras: {tavern_all_atk: 4, tavern_all_hp: 4, trinkets: [{counter: 0}]}}

  - name: the_turn_start_shop_does_not_count
    tavern: {turn: 5, auras: {tavern_all_atk: 2, tavern_all_hp: 2, trinkets: [{trinket: Dalaran Cheese Wheel, counter: 3}]}}
    steps:
      - end_turn
      - start_turn
    expect: {auras: {tavern_all_atk: 2, trinkets: [{counter: 3}]}}
