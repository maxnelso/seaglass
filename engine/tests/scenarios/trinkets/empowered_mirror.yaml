trinket: Empowered Mirror
scenarios:
  - name: picked_it_becomes_a_copy_of_the_teammates_lesser_trinket
    duos_tavern:
      players:
        - {gold: 10, trinket_options: [{card_id: 117941, cost: 3}]}
        - {auras: {trinkets: [Lucky Tabby, Bob's Tip Jar]}}
    steps:
      - {player: 0, choose_trinket: 0}
    expect: {players: {0: {gold: 7, auras: {trinkets: [{name: Lucky Tabby}]}}}}

  - name: a_teammate_who_picks_later_is_copied_then
    description: Engine decision.
    duos_tavern:
      players:
        - {auras: {trinkets: [Empowered Mirror]}}
        - {gold: 10, trinket_options: [{card_id: 111408, cost: 0}]}
    steps:
      - {player: 1, choose_trinket: 0}
    expect: {players: {0: {auras: {trinkets: [{name: Lucky Tabby, counter: 0}]}}}}
