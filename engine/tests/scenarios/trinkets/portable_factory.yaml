trinket: Portable Factory
scenarios:
  - name: a_discover_of_tier_4_minions_with_a_type_then_a_copy_each_turn
    seeds: "1..=3"
    tavern: {turn: 6, tavern_tier: 2}
    steps:
      - give_trinket: Portable Factory
      - expect: {discover_pending: {count: 3, all: {tavern_tier: 4, is_spell: false}}}
      - choose_discover: 0
      - expect: {hand: {count: 1, all: {tavern_tier: 4}}}
      - end_turn
      - start_turn
    expect: {hand: {count: 2, all: {tavern_tier: 4}}}

  - name: another_discover_doesnt_count
    description: Only the trinket's own Discover (here after a Book of Medivh's) is the one it copies.
    seeds: "1..=3"
    tavern: {turn: 6}
    steps:
      - give_trinket: Book of Medivh
      - give_trinket: Portable Factory
      - choose_discover: 0
      - expect: {auras: {trinkets: [{}, {armed: 1}]}}
      - choose_discover: 0
      - expect: {auras: {trinkets: [{}, {armed: 0, stored: {count: 1}}]}}
      - end_turn
      - start_turn
    expect: {hand: {where: {tavern_tier: 4, is_spell: false}, count: 2}}
