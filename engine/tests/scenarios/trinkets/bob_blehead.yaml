trinket: Bob-blehead
scenarios:
  - name: it_gives_two_gold
    tavern: {gold: 3, turn: 6}
    steps:
      - give_trinket: Bob-blehead
    expect: {gold: 5}

  - name: the_tavern_offers_no_tier_1_or_2_cards
    seeds: "1..=5"
    tavern: {gold: 1, tavern_tier: 4, include_shop_spells: true, auras: {trinkets: [Bob-blehead]}}
    steps:
      - refresh
    expect: {shop: {count: 6, all: {tavern_tier: ">= 3"}}}

  - name: the_turn_start_shop_too
    seeds: "1..=3"
    tavern: {tavern_tier: 3, auras: {trinkets: [Bob-blehead]}}
    steps:
      - end_turn
      - start_turn
    expect: {shop: {count: 4, all: {tavern_tier: 3}}}

  - name: below_tier_3_the_tavern_offers_tier_3_cards
    description: Engine decision - the Tiers offered are 3 to max(Tier, 3).
    seeds: "1..=3"
    tavern: {gold: 1, tavern_tier: 2, auras: {trinkets: [Bob-blehead]}}
    steps:
      - refresh
    expect: {shop: {count: 4, all: {tavern_tier: 3}}}
