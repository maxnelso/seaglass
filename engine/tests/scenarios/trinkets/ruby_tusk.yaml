trinket: Ruby Tusk
scenarios:
  - name: the_10th_blood_gem_played_from_hand_replaces_it
    seeds: "1..=3"
    tavern:
      board: ["1/1 quilboar"]
      hand: [Blood Gem, Blood Gem]
      auras: {trinkets: [{trinket: Ruby Tusk, counter: 8}]}
    steps:
      - play: {hand: 0, pos: 0}
      - expect: {auras: {trinkets: [{name: Ruby Tusk, counter: 9}]}}
      - play: {hand: 0, pos: 0}
    expect: {auras: {trinkets: {count: 1, 0: {name: {not: Ruby Tusk}, greater: true}}}}
