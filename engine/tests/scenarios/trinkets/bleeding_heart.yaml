trinket: Bleeding Heart
scenarios:
  - name: the_8th_friendly_death_gives_a_card_of_the_type
    description: >-
      The count goes across combats (5 so far): the third 1/1 to die gives a random minion of
      the type, of the player's Tier or lower, in the combat hand, which comes back with it.
    seeds: "1..=3"
    tavern:
      tavern_tier: 6
      board: ["1/1", "1/1", "1/1"]
      auras: {trinkets: [{trinket: Bleeding Heart, counter: 5}]}
    steps:
      - fight: {board: ["1/100"]}
    expect:
      hand: {count: 1, all: {tribe: {any_of: [undead, undead_mech, all]}}}
      auras: {trinkets: [{counter: 0}]}

  - name: fewer_deaths_give_nothing
    tavern: {board: ["1/1", "1/1"], auras: {trinkets: [Bleeding Heart]}}
    steps:
      - fight: {board: ["1/100"]}
    expect: {hand: [], auras: {trinkets: [{counter: 2}]}}
