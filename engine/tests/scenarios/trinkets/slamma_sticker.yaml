trinket: Slamma Sticker
scenarios:
  - name: a_beast_summoned_in_combat_doubles_its_attack
    description: The Reborn 2/1 Beast comes back as a 4/1.
    combat:
      board_a: ["2/1 beast reborn"]
      board_b: ["0/30 taunt", "5/5"]
      auras_a: {trinkets: [Slamma Sticker]}
    seeds: "1..=3"
    expect:
      events: {any: {type: unit_summoned, side: a, reason: Reborn, attack: 4, health: 1}}

  - name: other_types_keep_their_attack
    combat:
      board_a: ["2/1 murloc reborn"]
      board_b: ["5/5"]
      auras_a: {trinkets: [Slamma Sticker]}
    seeds: "1..=3"
    expect:
      events: {any: {type: unit_summoned, side: a, reason: Reborn, attack: 2}}
