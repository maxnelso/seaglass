trinket: Portable Factory (Greater)
scenarios:
  - name: a_discover_of_tier_5_minions_with_a_type_then_a_copy_each_turn
    seeds: "1..=3"
    tavern: {turn: 9}
    steps:
      - give_trinket: Portable Factory (Greater)
      - expect: {discover_pending: {count: 3, all: {tavern_tier: 5, is_spell: false}}}
      - choose_discover: 0
      - end_turn
      - start_turn
    expect: {hand: {count: 2, all: {tavern_tier: 5}}}
