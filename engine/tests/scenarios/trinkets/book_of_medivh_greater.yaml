trinket: Book of Medivh (Greater)
scenarios:
  - name: two_discovers_of_tavern_spells_as_picked_and_each_turn
    seeds: "1..=3"
    tavern: {turn: 9}
    steps:
      - give_trinket: Book of Medivh (Greater)
      - expect: {discover_pending: {count: 3, all: {is_spell: true}}, discover_queue: {count: 1}}
      - choose_discover: 0
      - choose_discover: 0
      - expect: {hand: {count: 2, all: {is_spell: true}}}
      - end_turn
      - start_turn
    expect: {discover_pending: {count: 3}, discover_queue: {count: 1}}
