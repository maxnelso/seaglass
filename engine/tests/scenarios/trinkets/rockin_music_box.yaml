trinket: Rockin' Music Box
scenarios:
  - name: a_battlecry_minion_now_and_each_turn
    seeds: "1..=4"
    tavern: {turn: 5, tavern_tier: 3}
    steps:
      - give_trinket: Rockin' Music Box
      - expect: {hand: {count: 1, all: {is_spell: false}}}
      - end_turn
      - start_turn
    expect: {hand: {count: 2, all: {is_spell: false}}}
