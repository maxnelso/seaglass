trinket: Soul Battery
scenarios:
  - name: the_25th_minion_summoned_replaces_it
    seeds: "1..=3"
    tavern: {hand: ["1/1", "1/1"], auras: {trinkets: [{trinket: Soul Battery, counter: 23}]}}
    steps:
      - play: 0
      - expect: {auras: {trinkets: [{name: Soul Battery, counter: 24}]}}
      - play: 0
    expect: {auras: {trinkets: {count: 1, 0: {name: {not: Soul Battery}, greater: true}}}}

  - name: combat_summons_count_and_replace_it_at_the_next_turn_start
    seeds: "1..=3"
    tavern: {board: [Harmless Bonehead], auras: {trinkets: [{trinket: Soul Battery, counter: 23}]}}
    steps:
      - fight: {board: ["10/100"]}
      - expect: {auras: {trinkets: [{name: Soul Battery, counter: 25}]}}
      - start_turn
    expect: {auras: {trinkets: {count: 1, 0: {name: {not: Soul Battery}, greater: true}}}}
