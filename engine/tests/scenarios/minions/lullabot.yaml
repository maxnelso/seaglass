card: Lullabot
scenarios:
  - name: magnetized_mech_gains_1_health_at_end_of_turn
    tavern: {board: [Cord Puller]}   # a 1/1 Mech
    steps:
      - add_to_hand: Lullabot   # 2/2 Magnetic
      - play: {hand: Lullabot, pos: 0}   # onto Cord Puller
      - expect: {board: ["Cord Puller 3/3"]}
      - end_turn
    expect: {board: ["Cord Puller 3/4"]}
