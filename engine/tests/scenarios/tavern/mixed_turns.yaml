topic: Mixed Tavern turns with minions, spells and Discover (smoke tests)
scenarios:
  - name: tier2_minions_and_tavern_spells
    seed: 202
    steps:
      - start_turn
      - set: {tavern_tier: 2, gold: 10}
      - push_board: Soul Rewinder
      - apply_global_unit_auras: {board: -1}
      - push_shop: Hasty Excavation
      - buy: 3
      - play: {hand: 0, pos: 0}
      - add_to_hand: Crater Miner
      - play: {hand: 0, pos: 1}
      - choose_discover: 1
      - play: {hand: 0, pos: 0}
      - choose_discover: 0
      - add_to_hand: Blood Gem
      - play: {hand: 0, pos: 0}
      - add_to_hand: Strike Oil
      - play: {hand: 0, pos: 0}
    expect:
      tavern_tier: 2
      health: 30
      board: {count: 2, 0: "6/5"}
      hand: {count: 0}

  - name: tier3_trailblazer_foodie_and_spells
    seed: 303
    steps:
      - start_turn
      - set: {tavern_tier: 3, gold: 10}
      - push_board: Risen Rider
      - apply_global_unit_auras: {board: -1}
      - add_to_hand: Prosthetic Hand
      - play: {hand: 0, pos: 0}
      - push_board: Thorned Trailblazer
      - apply_global_unit_auras: {board: -1}
      - add_to_hand: Fearless Foodie
      - play: {hand: 0, pos: 2}
      - play: {hand: 0, pos: 0}
      - play: {hand: 0, pos: 0}
      - add_to_hand: Gem Confiscation
      - play: {hand: 2, pos: 1}
    expect:
      tavern_tier: 3
      board: {count: 3, 0: "5/2"}
      hand: {count: 2}
