card: Felboar
scenarios:
  - name: after_3_spells_consumes_a_tavern_minion
    tavern:
      board: [Felboar]   # 2/6
      shop: [Firelands Fugitive]   # 5/7
      hand: [Blood Gem, Blood Gem, Blood Gem]
    steps:
      - repeat: 3
        steps: [{play: {hand: Blood Gem, pos: 0}}]
    expect:
      shop: []
      board: ["Felboar 10/16"]   # 2/6 + 3 Blood Gems (+3/+3) + the consumed 5/7

  # A spell one of your minions casts counts as a spell you cast (docs/tavern.md §7.4).

  - name: counts_the_misplaced_tea_set_gatekeeper_amalgam_casts
    description: >-
      Fortify on the Amalgam is 1 spell, and the Misplaced Tea Set the Amalgam casts is another:
      Felboar's 2nd and 3rd, so it consumes the Tavern minion.
    tavern:
      board: [{card: Felboar, counter: 1}, Gatekeeper Amalgam]   # a 2/6 Demon/Quilboar; a 6/6 All
      shop: [Firelands Fugitive]   # 5/7
      hand: [Fortify]   # +0/+3 and Taunt
    steps:
      - play: {hand: Fortify, pos: 1}   # on the Amalgam
    expect:
      shop: []
      board:
        - {card: Felboar, stats: 11/17, counter: 0}   # 2/6 +4/+4 (the Tea Set) +5/+7
        - "Gatekeeper Amalgam 10/13 taunt"   # 6/6 +0/+3 +4/+4

  # A Blood Gem that a card plays isn't a spell you cast, so Felboar doesn't count it
  # (docs/tavern.md §7.4).

  - name: blood_gems_geomagus_roogug_plays_dont_count
    description: >-
      Each Blood Gem cast on Roogug makes it play one on Felboar, its only other minion: Felboar
      counts the 2 casts, not the 2 Blood Gems Roogug plays, so it consumes nothing.
    tavern:
      board: [Felboar, Geomagus Roogug]   # 2/6; 4/6
      shop: [Firelands Fugitive]   # 5/7
      hand: [Blood Gem, Blood Gem]
    steps:
      - repeat: 2
        steps: [{play: {hand: Blood Gem, pos: 1}}]   # on Roogug
    expect:
      shop: [Firelands Fugitive]
      board:
        - {card: Felboar, stats: 4/8, counter: 2}   # 2/6 +2/+2
        - "Geomagus Roogug 6/8"

  - name: blood_gems_turbo_hogrider_plays_dont_count
    description: >-
      Alliance Flag is 1 spell; the 2 Blood Gems the Hogrider then plays on each of your 2 Quilboar
      leave Felboar's counter at 1.
    tavern:
      board: [Felboar, Turbo Hogrider]   # a 2/6 Demon/Quilboar; a 6/8 Quilboar
      shop: [Firelands Fugitive]   # 5/7
      hand: [Alliance Flag]
    steps:
      - play: {hand: Alliance Flag, pos: 1}   # on the Hogrider
      - expect: {board: {0: {card: Felboar, counter: 1}}}
      - choose_discover: 0   # +3/+1
    expect:
      shop: [Firelands Fugitive]
      board:
        - {card: Felboar, stats: 4/8, counter: 1}   # 2/6 +2/+2
        - "Turbo Hogrider 11/11"   # 6/8 +3/+1 +2/+2

  - name: blood_gems_veteran_brigand_plays_dont_count_and_arent_repeated
    description: >-
      Brigand's Share plays 3 Blood Gems on each of your 3 minions: no spell cast, so Felboar
      consumes nothing. They aren't played from your hand: Hot-Air Surveyor doesn't repeat them.
    tavern:
      board: [Felboar, Hot-Air Surveyor]   # 2/6; 3/7
      shop: [Firelands Fugitive, Firelands Fugitive, Firelands Fugitive]   # 5/7 each
    steps:
      - add_to_hand: Veteran Brigand   # 8/8
      - play: Veteran Brigand
      - choose_discover: 0   # Brigand's Share
    expect:
      shop: [Firelands Fugitive, Firelands Fugitive, Firelands Fugitive]
      board:
        - {card: Felboar, stats: 5/9, counter: 0}   # 2/6 +3/+3
        - {card: Hot-Air Surveyor, stats: 6/10, blood_gems_played: 3}
        - "Veteran Brigand 11/11"

  - name: blood_gems_a_tavern_rally_of_bonker_plays_dont_count
    tavern:
      gold: 1
      board: [Sky-hatch Runaway, Bonker, {card: Felboar, counter: 2}, Iron Groundskeeper]   # 4/7; 2/7; 2/6; 2/2
      shop: [Firelands Fugitive]   # 5/7
    steps:
      - activate: {pos: Sky-hatch Runaway, target: 1}   # Bonker: a Blood Gem on each other minion
    expect:
      shop: [Firelands Fugitive]
      board:
        - "Sky-hatch Runaway 5/8"
        - "Bonker 2/7"
        - {card: Felboar, stats: 3/7, counter: 2}   # 2/6 +1/+1
        - "Iron Groundskeeper 3/3"

  - name: blood_gems_tavern_rallies_of_tusked_camper_and_razorfen_vineweaver_play_dont_count
    tavern:
      gold: 2
      board: [Sky-hatch Runaway, Sky-hatch Runaway, Tusked Camper, Razorfen Vineweaver, {card: Felboar, counter: 2}]
      shop: [Firelands Fugitive]   # 5/7
    steps:
      - activate: {pos: 0, target: 2}   # the Camper: a Blood Gem on itself
      - activate: {pos: 1, target: 3}   # the Vineweaver: 4 Blood Gems on itself
    expect:
      shop: [Firelands Fugitive]
      board:
        - Sky-hatch Runaway
        - Sky-hatch Runaway
        - "Tusked Camper 3/4"   # 2/3 +1/+1
        - "Razorfen Vineweaver 8/8"   # 4/4 +4/+4
        - {card: Felboar, stats: 2/6, counter: 2}

  - name: blood_gems_prodigious_tusker_plays_on_a_fishbait_attack_dont_count
    description: >-
      The Lionfish attacks the Fishbait and the Tusker plays a Blood Gem on it: not a spell you
      cast, so Felboar, 1 spell short, consumes nothing.
    tavern:
      gold: 2
      board: [Lurking Lionfish, Prodigious Tusker, {card: Felboar, counter: 2}]   # a 3/4 Beast
      shop: [Iron Groundskeeper, Firelands Fugitive]   # 5/7
    steps:
      - activate: {pos: Lurking Lionfish, target: 0}   # the Groundskeeper becomes a Fishbait
    expect:
      shop: [Firelands Fugitive]   # the dead Fishbait left the Tavern
      board:
        - "Lurking Lionfish 9/10"   # 3/4 +1/+1 +5/+5
        - Prodigious Tusker
        - {card: Felboar, stats: 2/6, counter: 2}

  - name: blood_gems_played_in_combat_count_for_nothing
    description: >-
      Felboar doesn't trigger in combat: the Blood Gem the Tusker plays on it there isn't counted,
      then or at the start of the next turn.
    seed: 815
    tavern:
      board: [Prodigious Tusker, {card: Felboar, counter: 2}, Iron Groundskeeper]
      shop: [Firelands Fugitive]
    steps:
      - fight: {board: [Patient Scout, Patient Scout, Patient Scout, Patient Scout]}
      - expect:
          combat: {survivors_a: {1: "Felboar 3/5"}}   # +1/+1 when it attacked
          shop: [Firelands Fugitive]
          board: {1: {card: Felboar, stats: 2/6, counter: 2}}
      - start_turn
    expect: {board: {1: {card: Felboar, counter: 2}}}
