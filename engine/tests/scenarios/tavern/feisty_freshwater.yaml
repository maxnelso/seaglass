card: Feisty Freshwater
defaults:
  duos_tavern: {catalog: duos}
scenarios:
  - name: deathrattle_gives_both_players_two_free_refreshes
    duos_tavern:
      players: [{board: [Feisty Freshwater]}, {}]
    steps:
      - fight: {team: [["10/10"], []]}
    expect:
      players: [{auras: {free_refreshes: 2}}, {auras: {free_refreshes: 2}}]

  - name: golden_gives_each_player_four
    duos_tavern:
      players: [{board: ["golden Feisty Freshwater 12/8"]}, {}]
    steps:
      - fight: {team: [["20/20"], []]}
    expect:
      players: [{auras: {free_refreshes: 4}}, {auras: {free_refreshes: 4}}]

  - name: the_teammate_refreshes_for_free_next_turn
    duos_tavern:
      players: [{board: [Feisty Freshwater]}, {}]
    steps:
      - fight: {team: [["10/10"], []]}
      - start_turn
      - {player: 1, refresh}
      - {player: 1, refresh}
    expect:
      players: {1: {gold: 3, auras: {free_refreshes: 0}}}

  - name: a_teammate_who_never_fights_brings_them_back
    description: >-
      The Freshwater attacks first (two minions against one) and dies; player 0's 20/20 wins
      alone, so player 1's warband never fights. The free Refreshes reached it at once: they come
      back with its auras, and the Tavern doesn't give them a second time.
    duos_tavern:
      players: [{board: [Feisty Freshwater, "20/20"]}, {}]
    steps:
      - fight: {team: [["10/10"], []]}
    expect:
      combat:
        outcome: a_win
        team_a: [{auras: {free_refreshes: 2}}, {fought: false, auras: {free_refreshes: 2}}]
      players: [{auras: {free_refreshes: 2}}, {auras: {free_refreshes: 2}}]

  - name: a_teammate_who_already_fought_gets_them_too
    description: >-
      Player 0's warband fights first and is out; player 1's Freshwater dies after it, and player
      0's free Refreshes come back with player 0's auras.
    seeds: "1..=4"
    duos_tavern:
      players: [{board: ["1/1"]}, {board: [Feisty Freshwater]}]
    steps:
      - fight: {team: [["10/10"], []]}
    expect:
      combat:
        outcome: b_win
        team_a: [{fought: true, auras: {free_refreshes: 2}}, {auras: {free_refreshes: 2}}]
      players: [{auras: {free_refreshes: 2}}, {auras: {free_refreshes: 2}}]
