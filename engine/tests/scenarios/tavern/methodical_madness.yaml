card: Methodical Madness
scenarios:
  - name: consumes_2_tavern_minions_gaining_their_stats_and_keywords
    seed: 838
    tavern:
      board: [Ominous Seer]   # 2/1 Demon
      shop: [Risen Rider, Aureate Laureate]   # 2/1 Taunt Reborn, 2/2 Divine Shield
      hand: [Methodical Madness]
    steps:
      - play: {hand: Methodical Madness, pos: 0}
    expect:
      shop: []
      board: ["Ominous Seer 6/4 taunt reborn divine_shield"]

  - name: a_minion_in_the_tavern_consumes_2_other_tavern_minions
    tavern:
      board: [Ominous Seer]
      shop: [Lullabot, Risen Rider, Glim Guardian]   # 2/2; 2/1 Taunt Reborn; 1/4
      hand: [Methodical Madness]
    steps:
      - play: {hand: Methodical Madness, shop: Lullabot}
    expect:
      shop: ["Lullabot 5/7 taunt reborn"]   # it doesn't consume itself
      board: ["Ominous Seer 2/1"]
