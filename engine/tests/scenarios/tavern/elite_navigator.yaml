card: Elite Navigator
scenarios:
  - name: battlecry_makes_a_friendly_pirate_golden
    tavern: {board: [Southsea Busker]}   # a Tier 1 Pirate, 3/1
    steps:
      - add_to_hand: Elite Navigator
      - play: Elite Navigator
    expect: {board: ["golden Southsea Busker 6/2", Elite Navigator]}

  - name: battlecry_makes_the_chosen_pirate_golden
    description: >-
      The target is chosen with the play position: the eligible Pirate there (to the right of where
      it is played), else the one to its left.
    seeds: "0..4"
    tavern: {board: [Southsea Busker, Bilgewater Breakout]}   # 3/1 and 3/2 Tier 1-2 Pirates
    steps:
      - add_to_hand: Elite Navigator
      - play: {hand: Elite Navigator, pos: 1}   # targets Bilgewater Breakout
    expect: {board: ["Southsea Busker 3/1 -golden", Elite Navigator, "golden Bilgewater Breakout 6/4"]}

  - name: a_brann_repeat_keeps_the_target_and_does_nothing
    tavern: {board: [Brann Bronzebeard, Southsea Busker, Bilgewater Breakout]}
    steps:
      - add_to_hand: Elite Navigator
      - play: {hand: Elite Navigator, pos: 1}   # targets Southsea Busker; the repeat finds it Golden
    expect:
      board: [Brann Bronzebeard, Elite Navigator, "golden Southsea Busker 6/2", "Bilgewater Breakout 3/2 -golden"]

  - name: golden_makes_one_pirate_golden
    description: A Golden Elite Navigator does the same as the regular one.
    tavern: {board: [Southsea Busker, Bilgewater Breakout]}
    steps:
      - add_to_hand: golden Elite Navigator
      - play: {hand: golden Elite Navigator, pos: 0}   # targets Southsea Busker
    expect:
      board: [golden Elite Navigator, "golden Southsea Busker 6/2", "Bilgewater Breakout 3/2 -golden"]
