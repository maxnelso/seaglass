card: Air Revenant
scenarios:
  - name: spending_7_gold_casts_easterly_winds
    seed: 501
    tavern: {gold: 7, board: [Air Revenant]}
    steps:
      - repeat: 7   # 7 Refreshes: 7 Gold spent
        steps: [refresh]
    expect: {auras: {refresh_random_buffs: [[9, 9]]}}   # Easterly Winds: +9/+9 after each Refresh

  - name: its_cast_counts_as_one_spell_cast
    seed: 501
    tavern: {gold: 7, board: [Air Revenant]}
    steps:
      - repeat: 7   # 7 Refreshes: 7 Gold spent, one Easterly Winds
        steps: [refresh]
    expect: {auras: {tavern_spells_cast: 1}}

  - name: health_costs_spend_no_gold
    description: >-
      Hasty Excavation and Malchezaar's Health Refreshes cost Health, not Gold: only the 7th Gold
      Refresh after them casts Easterly Winds.
    seed: 501
    tavern: {gold: 7, board: [Air Revenant, "Malchezaar, Prince of Dance"], shop: [Hasty Excavation]}
    steps:
      - buy: Hasty Excavation   # 3 Health
      - repeat: 2   # Malchezaar's Health Refreshes
        steps: [refresh]
      - repeat: 6   # 6 Gold
        steps: [refresh]
      - expect: {health: 25, gold: 1, auras: {tavern_spells_cast: 0}}
      - refresh   # the 7th Gold
    expect: {gold: 0, auras: {tavern_spells_cast: 1}}   # one Easterly Winds
