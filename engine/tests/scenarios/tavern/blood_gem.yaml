card: Blood Gem
scenarios:
  - name: gives_1_1_plus_the_blood_gem_bonus
    tavern:
      board: [Lullabot]   # 2/2
      hand: [Sanguine Champion]   # Battlecry: Blood Gems give an extra +2/+1 this game
    steps:
      - play: Sanguine Champion
      - add_to_hand: Blood Gem
      - play: {hand: Blood Gem, pos: 0}
    expect:
      board: {0: {card: Lullabot, stats: "5/4", blood_gems_played: 1}}

  - name: can_be_played_on_a_minion_in_the_tavern
    tavern: {board: [Lullabot], shop: [Flittering Bat], hand: [Blood Gem]}   # Flittering Bat: 1/4
    steps:
      - play: {hand: Blood Gem, shop: 0}
    expect:
      shop: [{card: Flittering Bat, stats: "2/5", blood_gems_played: 1}]
      board: ["Lullabot 2/2"]

  - name: isnt_a_tavern_spell
    tavern:
      board: [Vicious Mindslasher]   # 1/2; whenever you cast a Tavern spell, +1/+2
      hand: [Blood Gem, Tavern Dish Banana]
    steps:
      - play: {hand: Blood Gem, pos: 0}   # only the Blood Gem's +1/+1
      - expect: {board: ["Vicious Mindslasher 2/3"], auras: {tavern_spells_cast: 0}}   # Faceless Converter's count
      - play: {hand: Tavern Dish Banana, pos: 0}   # +2/+2, and +1/+2
    expect: {board: ["Vicious Mindslasher 5/7"], auras: {tavern_spells_cast: 1}}
