topic: Engine bugs found by the Tavern fuzzer (tests/tavern_fuzz.rs), kept as known bugs
scenarios:
  - name: a_discovered_card_is_lost_to_the_cards_its_damage_gives
    known_bug: ChooseDiscover deals the Tier damage before adding the chosen card, which a full hand then drops
    description: >-
      ChooseDiscover deals an Imposing Percussionist option's Tier as damage before the card goes
      to the hand: Eredar Escapist's Corrupted Cupcakes take the last free slot and add_to_hand
      silently drops the chosen card (its pool copy is never returned).
    tavern:
      tavern_tier: 4
      board: [Eredar Escapist]   # after 4 damage: a Corrupted Cupcakes
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem,
             Blood Gem]   # 9 cards
      discover_pending:
        - {card: Imp-lusionist, discover_deals_tier_damage: true}   # a Tier 4 Demon
        - {card: Soul Rewinder, discover_deals_tier_damage: true}
    steps:
      - choose_discover: 0
    expect:
      health: 26
      hand: {count: 10, any: Imp-lusionist}

  - name: relentless_deflector_loses_the_taunt_a_spell_gave_it
    known_bug: Relentless Deflector's sync sets taunt = divine_shield, wiping a Taunt from a spell
    description: >-
      Relentless Deflector re-syncs its Taunt to its Divine Shield (taunt = divine_shield), so a
      Taunt that a spell gives it (Fortify, Tricky Trousers, ...) is gone at the next aura sync, at
      the latest when a combat starts (SideCombatState::new syncs every unit).
    tavern:
      board: [Relentless Deflector]
      hand: [Fortify]
    steps:
      - play: {hand: Fortify, pos: 0}
      - expect: {board: ["Relentless Deflector 5/7 taunt"]}
      - sync_all_auras
    expect: {board: ["Relentless Deflector 5/7 taunt"]}

  - name: robust_evolution_counts_the_undead_bonus_twice
    known_bug: Robust Evolution copies aura-inflated stats but resets aura_applied
    description: >-
      Robust Evolution copies its target's stats, the Undead Attack bonus included, onto a new
      minion whose applied aura is reset to zero: if the new minion is an Undead, the next aura
      sync adds the bonus again (a 4/1 Bonehead with +3 becomes a 7/1 Eternal Knight).
    seeds: "1..=30"
    tavern:
      board: [Harmless Bonehead]
      hand: [Robust Evolution]
      auras: {undead_bonus_attack: 3}
    steps:
      - sync_all_auras
      - expect: {board: ["Harmless Bonehead 4/1"]}
      - play: {hand: Robust Evolution, pos: 0}
      - if: {board: {0: {tribe: undead}}}
        then:
          - expect: {board: [{attack: 4}]}

  - name: a_divine_shield_given_over_ichorons_still_expires
    known_bug: a Divine Shield a spell gives a minion with a temporary one stays temporary
    description: >-
      Ichoron's Divine Shield "until next turn" (temp_divine_shield) stays temporary when a spell
      then gives the minion Divine Shield (Sacred Gift: apply_keyword leaves temp_divine_shield
      set), so the permanent shield expires at the start of the next turn.
    tavern:
      board: [Ichoron the Protector]
      hand: [Dune Dweller, Sacred Gift]
    steps:
      - play: Dune Dweller   # Divine Shield until next turn
      - play: {hand: Sacred Gift, pos: 1}   # Divine Shield
      - start_turn
    expect: {board: [Ichoron the Protector, "Dune Dweller divine_shield"]}

  - name: a_card_discovered_with_a_full_hand_leaves_the_pool_for_good
    known_bug: a card Discovered with a full hand is dropped without returning to the pool (rule question)
    description: >-
      Rule question. With a full hand (a Patient Scout sold, a Golden played), the chosen Discover
      card is silently dropped by add_to_hand and never returned to the pool, while the unchosen
      options are: each such Discover loses a copy of the pool for the rest of the game.
    tavern:
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem,
             Blood Gem, Blood Gem]   # 10 cards
      discover_pending: [Imp-lusionist, Soul Rewinder]
    steps:
      - take_from_pool: [Imp-lusionist, Soul Rewinder]   # the Discover drew them
      - choose_discover: 0
    expect:
      hand: {count: 10, none: Imp-lusionist}
      pool: {Imp-lusionist: 11, Soul Rewinder: 15}

  - name: a_choose_one_before_a_triple_reward_leaves_its_target_set
    known_bug: ChooseDiscover clears pending_choice_target only after a Choose One option with no prompt left
    description: >-
      A Golden Sprightly Scarab offers its Choose One, then its Triple Reward. Choosing the option
      leaves pending_choice_target set because the Triple Reward is still pending, and choosing the
      Triple Reward (not an option card) never clears it.
    tavern:
      tavern_tier: 3
      board: ["1/1 beast"]
      hand: [golden Sprightly Scarab]
    steps:
      - play: {hand: 0, pos: 1}
      - expect: {discover_queue: {count: 1}}   # the Triple Reward, behind the Choose One
      - choose_discover: 0
      - choose_discover: 0
    expect: {discover_pending: null, pending_choice_target: null}
