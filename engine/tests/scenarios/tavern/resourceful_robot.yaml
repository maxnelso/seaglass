card: Resourceful Robot
scenarios:
  - name: end_of_turn_magnetizes_a_random_volumizer_and_gets_a_copy
    description: >-
      Every Volumizer adds Attack (Blue 1/3 with its +3 Health, Green 3/3 with +1/+1, Red 3/1 with
      +3 Attack), so the 4/8 Robot ends above 4 Attack whichever one it gets.
    seed: 541
    tavern: {board: [Resourceful Robot]}   # 4/8
    steps:
      - end_turn
    expect:
      board: [{card: Resourceful Robot, attack: "> 4"}]
      hand: [{card: {any_of: [Blue Volumizer, Green Volumizer, Red Volumizer]}}]

  - name: a_golden_robot_magnetizes_twice_when_its_first_copy_completes_a_triple
    description: >-
      The first Volumizer copy completes a Triple with the two Red Volumizers on the board, left of
      the Robot. The Triple waits until the end-of-turn triggers are over (docs/tavern.md §5), so
      the Robot keeps its place for its second Magnetization (the stale slot used to panic).
    seed: 1   # the first Volumizer is a Red Volumizer
    tavern:
      board: [Red Volumizer, Red Volumizer, golden Resourceful Robot]
    steps:
      - end_turn
    expect:
      board: [{card: Resourceful Robot, magnetizations_count: 2}]
      hand: {count: 2, any: "golden Red Volumizer"}

  - name: a_triple_one_robot_completes_does_not_skip_the_next_robot
    description: >-
      The first Robot's Red Volumizer copy completes a Triple with the two on the board. The Triple
      waits until the end-of-turn triggers are over, so the second Robot is still in its slot and
      triggers too (it used to be skipped).
    seed: 1   # the first Volumizer is a Red Volumizer
    tavern:
      board: [Red Volumizer, Red Volumizer, Resourceful Robot, Resourceful Robot]
    steps:
      - end_turn
    expect:
      board: {count: 2, all: {card: Resourceful Robot, magnetizations_count: 1}}
      hand: {count: 2, any: "golden Red Volumizer"}
