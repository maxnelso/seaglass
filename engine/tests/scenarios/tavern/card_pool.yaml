topic: The card pool and the cards the shop offers
scenarios:
  - name: fresh_pool_has_15_copies_and_the_bought_card_is_the_one_played
    seed: 99
    tavern: {catalog: tier1}
    steps:
      - expect: {pool: {Joyous: 15}}   # every Tier 1 minion starts with 15 copies
      - start_turn
      - expect:
          gold: 3
          shop: {count: 3, 0: {card_id: {capture: bought}}}
      - buy: 0
      - play: 0
    expect: {board: [{card_id: {same_as: bought}}]}

  - name: a_card_discovered_with_a_full_hand_is_lost_and_returns_to_the_pool
    description: >-
      A Discover still happens with a full hand: the chosen card is lost and its copy returns to
      the pool, like the unchosen options (confirmed; it used to leave the pool for good).
    tavern:
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem,
             Blood Gem, Blood Gem]   # 10 cards
      discover_pending: [Imp-lusionist, Soul Rewinder]
    steps:
      - take_from_pool: [Imp-lusionist, Soul Rewinder]   # the Discover drew them
      - choose_discover: 0
    expect:
      hand: {count: 10, none: Imp-lusionist}
      pool: {Imp-lusionist: 11, Soul Rewinder: 15}
