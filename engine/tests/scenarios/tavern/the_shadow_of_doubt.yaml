card: The Shadow of Doubt
scenarios:
  - name: a_card_added_to_hand_gives_the_deity_4_5
    tavern: {board: [The Shadow of Doubt]}
    steps:
      - add_to_hand: Blood Gem
    expect: {auras: {deity: {attack: 5, health: 6}}}   # 1/1 + 4/5

  - name: deathstrider_hand_generation_in_tavern_triggers_once_per_card
    tavern:
      gold: 10
      board: [The Shadow of Doubt, Sky-hatch Runaway, Glim Guardian, Deathstrider, Imp-lusionist]
    steps:
      - activate: {pos: Sky-hatch Runaway, target: 2}
    expect:
      hand: [Methodical Madness]
      auras: {deity: {attack: 5, health: 6}}

  - name: deathstrider_hand_generation_in_combat_triggers_once_per_card
    seed: 623
    combat:
      board_a: [Glim Guardian, Deathstrider, Imp-lusionist, The Shadow of Doubt]
      board_b: ["0/10"]
    expect:
      hand_a: [Methodical Madness]
      auras_a: {deity: {attack: 5, health: 6}}
