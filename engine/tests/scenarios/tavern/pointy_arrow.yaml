card: Pointy Arrow
scenarios:
  - name: gives_a_minion_4_attack
    tavern: {board: [Iron Groundskeeper]}
    steps:
      - add_to_hand: Pointy Arrow
      - play: {hand: Pointy Arrow, pos: 0}
    expect: {board: ["Iron Groundskeeper 6/2"]}

  - name: health_spell_power_adds_health_too
    description: With an extra +1 Health from Giant Dewdrop, the +4 Attack spell gives +4/+1.
    tavern: {board: [Iron Groundskeeper]}
    steps:
      - add_to_hand: Intrepid Botanist
      - play: Intrepid Botanist
      - choose_discover: 1   # Giant Dewdrop: your Tavern spells give an extra +1 Health
      - add_to_hand: Pointy Arrow
      - play: {hand: Pointy Arrow, pos: 0}
    expect: {board: ["Iron Groundskeeper 6/3", "Intrepid Botanist 3/4"]}

  - name: gives_a_minion_in_the_tavern_4_attack
    tavern: {shop: [Lullabot], hand: [Pointy Arrow]}   # Lullabot: 2/2
    steps:
      - play: {hand: Pointy Arrow, shop: 0}
    expect: {shop: ["Lullabot 6/2"]}
