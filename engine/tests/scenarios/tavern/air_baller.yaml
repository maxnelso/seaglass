card: Air Baller
scenarios:
  - name: selling_it_gives_your_minions_2_2_and_improves_ballers
    tavern: {board: [Patient Scout, Air Baller]}
    steps:
      - sell: Air Baller
    expect:
      board: ["Patient Scout 3/3"]   # +2/+2 (no Baller improvements yet)
      auras: {counters: {Fire Baller: {0: 1}}}   # future Ballers improved by 1

  - name: golden_doubles_the_baller_improvements_too
    tavern:
      board: [Patient Scout, "golden Air Baller 12/12"]
      auras: {counters: {Fire Baller: 2}}   # Ballers improved by 2
    steps:
      - sell: Air Baller
    expect:
      board: ["Patient Scout 9/9"]   # (2 + 2) x 2 = +8/+8
      auras: {counters: {Fire Baller: {0: 4}}}   # improved by 2 more (Golden)
