card: Strike Oil
scenarios:
  - name: gains_1_maximum_gold
    steps:
      - add_to_hand: Strike Oil
      - play: Strike Oil
    expect:
      max_gold: 1
      auras: {base_max_gold_bonus: 1}

  - name: gives_no_gold_now_and_max_gold_can_exceed_10
    tavern: {turn: 9, max_gold: 10, gold: 4}
    steps:
      - add_to_hand: Strike Oil
      - play: Strike Oil
      - expect: {max_gold: 11, gold: 4}
      - start_turn
    expect: {turn: 10, max_gold: 11, gold: 11}   # 10, +1
