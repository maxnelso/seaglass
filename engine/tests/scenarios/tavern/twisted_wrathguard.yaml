card: Twisted Wrathguard
scenarios:
  - name: selling_a_minion_adds_a_fodder_to_the_next_refresh
    tavern: {board: [Twisted Wrathguard, Patient Scout]}
    steps:
      - sell: Patient Scout
    expect:
      # The Demon Fodder player effect: 1 Fodder on each of the next 1 Refresh(es).
      auras: {effects: [{card: Demon Fodder, stacks: 1, duration: {Refreshes: 1}}]}
