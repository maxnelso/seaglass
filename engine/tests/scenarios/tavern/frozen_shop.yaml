topic: "Frozen shop: the next turn keeps every card and refills the free slots"
scenarios:
  - name: a_bought_minion_slot_refills_with_a_minion
    seed: 31
    tavern: {include_shop_spells: true, turn: 9}   # Turn 10: 10 Gold
    steps:
      - start_turn   # Tier 1: 3 minions and a spell
      - buy: 0
      - toggle_freeze
      - expect: {shop: {0: {capture: m1}, 1: {capture: m2}, 2: {capture: spell}}}
      - end_turn
      - start_turn
    expect:
      shop:
        count: 4   # 3 minion slots and the spell slot
        0: {same_as: m1}
        1: {same_as: m2}
        2: {same_as: spell}
        3: {is_spell: false}   # the bought slot

  - name: a_bought_spell_slot_refills_with_a_spell
    seed: 31
    tavern: {include_shop_spells: true, turn: 9}
    steps:
      - start_turn
      - buy: {is_spell: true}
      - toggle_freeze
      - expect: {shop: {0: {capture: m0}, 1: {capture: m1}, 2: {capture: m2}}}
      - end_turn
      - start_turn
    expect:
      shop:
        count: 4
        0: {same_as: m0}
        1: {same_as: m1}
        2: {same_as: m2}
        3: {is_spell: true}   # the bought slot

  - name: upgrading_while_frozen_fills_the_new_minion_slot
    seed: 31
    tavern: {include_shop_spells: true, turn: 9, tavern_tier: 3, upgrade_cost: 8}
    steps:
      - start_turn   # 4 minions and a spell; the upgrade now costs 7
      - upgrade_tavern
      - toggle_freeze
      - end_turn
      - start_turn
    expect:
      tavern_tier: 4
      shop:
        all_of:
          - {count: 6}   # Tier 4: 5 minion slots and the spell slot
          - {where: {is_spell: true}, count: 1}

  # A card frozen on its own (`Unit::frozen`: Varden Dawngrasp's copies; docs/tavern.md §3.1).
  - name: a_card_frozen_on_its_own_stays_through_the_turn_start
    description: >-
      (confirmed) The shop isn't frozen: the 9/9 frozen on its own stays (unfrozen) and the two
      other minion slots refill.
    tavern: {shop: ["1/1", {card: "9/9", frozen: true}, "2/2"]}
    steps:
      - start_turn
    expect:
      is_frozen: false
      shop: {all_of: [{count: 3}, {0: {attack: 9, frozen: false}}, {where: "1/1", count: 0}]}

  - name: a_refresh_replaces_a_card_frozen_on_its_own
    tavern: {gold: 5, shop: [{card: "9/9", frozen: true}, "1/1"]}
    steps:
      - refresh
    expect: {shop: {count: 3, none: {attack: 9}}}

  - name: toggle_freeze_unfreezes_a_card_frozen_on_its_own
    description: With anything frozen in the shop, Toggle Freeze unfreezes it all, and the shop.
    tavern: {shop: [{card: "9/9", frozen: true}, "1/1"]}
    steps:
      - toggle_freeze
      - expect: {is_frozen: false, shop: [{frozen: false}, {frozen: false}]}
      - toggle_freeze
    expect: {is_frozen: true}

  - name: a_bought_card_loses_its_freeze
    tavern: {gold: 5, shop: [{card: "9/9", frozen: true}]}
    steps:
      - buy: 0
    expect: {hand: [{attack: 9, frozen: false}]}
