card: Snare Trapper
scenarios:
  - name: choose_one_collect_the_bounty_gives_1_max_gold
    steps:
      - add_to_hand: Snare Trapper
      - play: Snare Trapper
      - choose_discover: 1   # Collect the Bounty (+1 Max Gold)
    expect: {auras: {base_max_gold_bonus: 1}}

  - name: collect_the_bounty_gives_no_gold_now_and_max_gold_can_exceed_10
    tavern: {turn: 9, max_gold: 10, gold: 4}
    steps:
      - add_to_hand: Snare Trapper
      - play: Snare Trapper
      - choose_discover: 1   # Collect the Bounty (+1 Max Gold)
      - expect: {max_gold: 11, gold: 4}
      - start_turn
    expect: {turn: 10, max_gold: 11, gold: 11}   # 10, +1

  - name: ensnare_the_target_never_gets_a_snare_trapper
    seeds: "1..41"
    tavern: {tavern_tier: 4}
    steps:
      - add_to_hand: golden Snare Trapper
      - play: golden Snare Trapper
      - choose_discover: 0   # Ensnare the Target: get 2 random Quilboar
    expect: {hand: {count: 3, any: Triple Reward, none: {card: Snare Trapper}}}
