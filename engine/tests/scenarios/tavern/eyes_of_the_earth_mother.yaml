card: Eyes of the Earth Mother
scenarios:
  - name: makes_a_tier_4_minion_golden
    tavern: {board: [Conveyor Construct]}   # Tier 4, 5/2
    steps:
      - add_to_hand: Eyes of the Earth Mother
      - play: {hand: Eyes of the Earth Mother, pos: 0}
    expect: {board: ["golden Conveyor Construct 10/4"]}

  - name: cant_target_a_minion_in_the_tavern
    tavern: {board: [Lullabot], shop: [Conveyor Construct], hand: [Eyes of the Earth Mother]}   # "a friendly minion"
    steps:
      - expect_illegal: {play: {hand: Eyes of the Earth Mother, shop: 0}}
