card: Kalecgos, Arcane Aspect
scenarios:
  - name: after_a_battlecry_gives_dragons_2_2
    tavern: {board: ["Kalecgos, Arcane Aspect"]}   # a 4/12 Dragon
    steps:
      - add_to_hand: Southsea Busker   # a Battlecry minion
      - play: Southsea Busker
    expect: {board: {0: "Kalecgos, Arcane Aspect 6/14"}}

  - name: triggers_after_each_repeat_of_a_battlecry_kelp_keeper_triggers
    tavern: {gold: 10, board: [Kelp Keeper, Razorfen Geomancer, Brann Bronzebeard, "Kalecgos, Arcane Aspect"]}
    steps:
      - activate: {pos: Kelp Keeper, target: 1}   # Razorfen Geomancer's Battlecry (get 2 Blood Gems), twice with Brann
    expect:
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem]
      board: {3: "Kalecgos, Arcane Aspect 8/16"}   # 4/12 + 2 x 2/2
