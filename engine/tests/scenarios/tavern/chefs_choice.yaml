card: Chef's Choice
scenarios:
  - name: gets_a_different_minion_of_the_targets_type
    seed: 809
    tavern: {tavern_tier: 3, board: [Glim Guardian]}   # a Dragon
    steps:
      - add_to_hand: Chef's Choice
      - play: {hand: Chef's Choice, pos: 0}
    expect: {hand: [{all_of: [dragon, {not: Glim Guardian}]}]}

  # "A friendly minion's type": only friendly minions, and only ones with a type.
  - name: cant_target_a_minion_in_the_tavern
    tavern: {board: [Glim Guardian], shop: [Lullabot], hand: ["Chef's Choice"]}
    steps:
      - expect_illegal: {play: {hand: "Chef's Choice", shop: 0}}
      - expect_legal: {play: {hand: "Chef's Choice", pos: 0}}

  - name: cant_target_a_minion_without_a_type
    tavern: {board: [Iron Groundskeeper, Glim Guardian], hand: ["Chef's Choice"]}   # Iron Groundskeeper: no type
    steps:
      - expect_illegal: {play: {hand: "Chef's Choice", pos: 0}}
      - expect_legal: {play: {hand: "Chef's Choice", pos: 1}}

  - name: a_two_type_target_gets_a_minion_of_either_type
    seeds: "1..20"
    tavern: {catalog: tier1, board: [Treasure Parrot], hand: ["Chef's Choice"]}   # a Beast/Pirate
    steps:
      - play: {hand: "Chef's Choice", pos: 0}
    expect: {hand: [{any_of: [beast, pirate]}]}

  - name: an_all_type_target_gets_a_minion_of_any_type
    seeds: "1..20"
    tavern: {catalog: tier1, board: [Dark Paradox], hand: ["Chef's Choice"]}   # an All
    steps:
      - play: {hand: "Chef's Choice", pos: 0}
    expect: {hand: [{not: none}]}   # any Tier 1 minion with a type (not Suspicious Prisonguard)

  - name: a_naga_target_can_get_another_naga
    description: >-
      Ominous Seer is a Demon and a Naga, so it can get Firescale Hoarder, a Dragon/Naga (a plain
      one).
    seeds: [1, 7]
    tavern: {catalog: tier5, tavern_tier: 5, board: [Ominous Seer], hand: [Chef's Choice]}   # Tier 5 minions only
    steps:
      - play: {hand: Chef's Choice, pos: 0}
    expect: {hand: ["Firescale Hoarder -golden"]}

  - name: a_golden_naga_target_gets_a_plain_minion
    description: The target being Golden doesn't make the minion Golden.
    seeds: [1, 7]
    tavern: {catalog: tier5, tavern_tier: 5, board: [golden Ominous Seer], hand: [Chef's Choice]}
    steps:
      - play: {hand: Chef's Choice, pos: 0}
    expect: {hand: ["Firescale Hoarder -golden"]}

  - name: a_third_copy_of_the_naga_it_gets_makes_a_triple
    description: The Firescale Hoarder it gets makes a Triple with the 2 in your hand, as any third copy does.
    seeds: [1, 7]
    tavern:
      catalog: tier5
      tavern_tier: 5
      board: [Ominous Seer]
      hand: [Firescale Hoarder, Firescale Hoarder, Chef's Choice]
    steps:
      - play: {hand: Chef's Choice, pos: 0}
    expect: {hand: ["golden Firescale Hoarder 10/10"]}
