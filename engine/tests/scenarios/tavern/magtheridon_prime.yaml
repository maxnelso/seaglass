card: Magtheridon Prime
scenarios:
  - name: is_a_tier_1_magnetic_mech_demon_in_no_pool
    description: Only Mecha-Jaraxxus Sticker gives it (docs/trinkets.md §11.9).
    tavern: {hand: [Magtheridon Prime]}
    expect:
      hand: [{card: Magtheridon Prime, stats: 1/10, tavern_tier: 1, tribe: mech_demon, keywords: [taunt, magnetic]}]
      pool: {Magtheridon Prime: null}

  - name: it_magnetizes_to_a_demon
    tavern: {board: [Wrath Weaver], hand: [Magtheridon Prime]}
    steps:
      - play: {hand: 0, pos: 0}
    expect: {board: [{card: Wrath Weaver, keywords: {contains: taunt}}]}

  - name: it_magnetizes_to_a_mech
    tavern: {board: [Mechagnome Interpreter], hand: [Magtheridon Prime]}
    steps:
      - play: {hand: 0, pos: 0}
    expect: {board: {count: 1, 0: {card: Mechagnome Interpreter}}}
