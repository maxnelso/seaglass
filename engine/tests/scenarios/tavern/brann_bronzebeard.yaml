card: Brann Bronzebeard
scenarios:
  - name: battlecries_trigger_twice
    tavern: {board: [Brann Bronzebeard], hand: [Razorfen Geomancer]}   # Battlecry: get 2 Blood Gems
    steps:
      - play: Razorfen Geomancer
    expect: {hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem]}

  - name: doubles_a_battlecry_triggered_at_the_end_of_turn
    tavern: {board: [Razorfen Geomancer, Young Murk-Eye, Brann Bronzebeard]}
    steps:
      - end_turn   # Young Murk-Eye triggers Razorfen Geomancer's Battlecry, twice
    expect: {hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem]}   # 2 x 2

  - name: doubles_a_battlecry_triggered_by_an_activate
    tavern: {gold: 10, board: [Kelp Keeper, Razorfen Geomancer, Brann Bronzebeard]}
    steps:
      - activate: {pos: Kelp Keeper, target: 1}   # Razorfen Geomancer
    expect: {hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem]}   # 2 x 2

  - name: a_repeated_battlecry_keeps_its_target_and_does_nothing_once_it_is_destroyed
    description: >-
      Disguised Graverobber's second trigger targets the Knight the first one destroyed, so it
      does nothing: 1 Knight destroyed and 1 copy (not 2).
    tavern:
      board: [Brann Bronzebeard, Eternal Knight, Eternal Knight]
      hand: [Disguised Graverobber]
    steps:
      - play: {hand: Disguised Graverobber, pos: 1}   # targets the Knight at 1
    expect:
      auras: {counters: {Eternal Knight: {0: 1}}}   # 1 Knight died
      board: [Brann Bronzebeard, Disguised Graverobber, "Eternal Knight 8/4"]   # 4/2, +4/+2
      hand: ["Eternal Knight 8/4"]

  - name: a_repeated_battlecry_does_not_retarget_the_reborn_copy
    tavern: {board: [Brann Bronzebeard, Scarlet Skull], hand: [Disguised Graverobber]}
    steps:
      - play: {hand: Disguised Graverobber, pos: 1}   # destroys Scarlet Skull, which is Reborn
    expect:
      board: [Brann Bronzebeard, Disguised Graverobber, "Scarlet Skull 2/1 -reborn"]   # a new minion
      hand: ["Scarlet Skull reborn"]   # 1 copy

  - name: a_repeated_maw_caster_battlecry_destroys_and_discovers_once
    seed: 441
    tavern:
      tavern_tier: 4
      board: [Brann Bronzebeard, Eternal Knight, Eternal Knight]
      hand: [Maw Caster]
    steps:
      - play: {hand: Maw Caster, pos: 2}   # targets the Undead to its left: the Knight at 1
    expect:
      auras: {counters: {Eternal Knight: {0: 1}}}   # 1 Knight died
      board: [Brann Bronzebeard, "Eternal Knight 8/4", Maw Caster]
      discover_pending: {count: 3, all: undead}
      discover_queue: []   # 1 Discover

  - name: a_repeated_battlecry_on_a_target_it_already_made_golden_does_nothing
    tavern: {board: [Brann Bronzebeard, Cord Puller], hand: [Captain Sanders]}
    steps:
      - play: {hand: Captain Sanders, pos: 1}   # targets Cord Puller (1/1)
    expect:
      board: ["Brann Bronzebeard -golden", Captain Sanders, "golden Cord Puller 2/2"]

  - name: a_repeated_battlecry_hits_its_surviving_target_again
    tavern:
      board: [Brann Bronzebeard, Southsea Busker, Southsea Busker]   # 3/1 Pirates
      hand: [Lovesick Balladist]
    steps:
      - play: Lovesick Balladist   # Give a Pirate +2 Health (no Gold spent), twice
    expect:
      board: [Brann Bronzebeard, "Southsea Busker 3/5", "Southsea Busker 3/1", Lovesick Balladist]
