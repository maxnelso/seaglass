card: Selfless Sightseer
defaults:
  duos_tavern: {catalog: duos}
scenarios:
  - name: is_a_tier_5_dragon_6_2
    tavern: {hand: [Selfless Sightseer]}
    expect: {hand: [{card: Selfless Sightseer, stats: 6/2, tavern_tier: 5, tribe: dragon}]}

  - name: battlecry_both_players_maximum_gold_goes_up_by_1
    description: No Gold this turn; above 10 too.
    duos_tavern:
      players: [{gold: 2, max_gold: 10, hand: [Selfless Sightseer]}, {gold: 0, max_gold: 10}]
    steps:
      - {player: 0, play: Selfless Sightseer}
    expect:
      players:
        - {gold: 2, max_gold: 11, auras: {base_max_gold_bonus: 1}}
        - {gold: 0, max_gold: 11, auras: {base_max_gold_bonus: 1}}

  - name: it_lasts_the_whole_game
    duos_tavern:
      players: [{hand: [Selfless Sightseer]}, {}]
    steps:
      - {player: 0, play: Selfless Sightseer}
      - start_turn   # turn 1: 3 Gold, +1
    expect:
      players: [{max_gold: 4, gold: 4}, {max_gold: 4, gold: 4}]

  - name: golden_gives_2
    duos_tavern:
      players: [{max_gold: 10, hand: ["golden Selfless Sightseer 12/4"]}, {max_gold: 10}]
    steps:
      - {player: 0, play: Selfless Sightseer}
    expect:
      players: [{max_gold: 12}, {max_gold: 12}]
