card: Winner's Bread
scenarios:
  - name: gives_2_3_and_a_blood_gem_next_turn_after_a_win
    seed: 815
    tavern: {board: [Lullabot], hand: ["Winner's Bread"]}
    steps:
      - play: {hand: "Winner's Bread", pos: 0}
      - expect: {board: [{card: Lullabot, stats: "4/5", winners_bread_stacks: 1}]}
      - fight: {board: [Patient Scout]}
      - start_turn   # plays 1 Blood Gem on it
    expect: {board: ["Lullabot 5/6"]}

  - name: gives_a_minion_in_the_tavern_2_3
    tavern: {shop: [Lullabot], hand: ["Winner's Bread"]}   # Lullabot: 2/2
    steps:
      - play: {hand: "Winner's Bread", shop: 0}
    expect: {shop: [{card: Lullabot, stats: "4/5", winners_bread_stacks: 1}]}

  - name: only_its_cast_counts_not_the_blood_gem_it_plays_next_turn
    description: >-
      Felboar counts Winner's Bread once, and Glambot magnetizes one Satellite to its target, a
      Mech; the Blood Gem it plays next turn triggers neither.
    seed: 815
    tavern:
      board: [Felboar, Glambot]   # Felboar: 2/6; Glambot: 4/4 Mech
      hand: ["Winner's Bread"]
    steps:
      - play: {hand: "Winner's Bread", pos: 1}   # on Glambot: +2/+3 and a 4/4 Satellite
      - expect: {board: [{card: Felboar, counter: 1}, "Glambot 10/11"]}
      - fight: {board: [Patient Scout]}
      - start_turn   # plays 1 Blood Gem on Glambot
    expect:
      board: [{card: Felboar, counter: 1}, {card: Glambot, stats: 11/12, blood_gems_played: 1}]
