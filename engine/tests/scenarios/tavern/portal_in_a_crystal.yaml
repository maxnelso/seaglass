card: Portal in a Crystal
defaults:
  duos_tavern: {catalog: duos}
scenarios:
  - name: is_a_tier_5_tavern_spell_for_2_gold
    duos_tavern:
      players: [{gold: 2, shop: [Portal in a Crystal]}, {}]
    steps:
      - {player: 0, buy: Portal in a Crystal}
    expect:
      players: {0: {gold: 0, hand: [{card: Portal in a Crystal, is_spell: true, tavern_tier: 5}]}}

  - name: passes_a_friendly_non_golden_minion
    description: It leaves the board (not to the pool) and arrives with its stats.
    duos_tavern:
      players: [{board: [Zoatroid, "Joyous 4/4"], hand: [Portal in a Crystal]}, {}]
    steps:
      - take_from_pool: Joyous
      - {player: 0, play: {hand: 0, pos: 1}}
    expect:
      players: [{board: [Zoatroid], hand: []}, {hand: ["Joyous 4/4"]}]
      passes_this_turn: 1
      pool: {Joyous: 14}

  - name: not_a_golden_minion_or_one_in_the_tavern
    duos_tavern:
      players: [{board: ["golden Joyous 4/6", Zoatroid], hand: [Portal in a Crystal], shop: [Joyous]}, {}]
    steps:
      - {player: 0, expect_illegal: {play: {hand: 0, pos: 0}}}
      - {player: 0, expect_illegal: {play: {hand: 0, shop: 0}}}
      - {player: 0, expect_legal: {play: {hand: 0, pos: 1}}}

  - name: the_pass_is_free_and_counts_as_the_teams_pass
    duos_tavern:
      players:
        - gold: 0
          board: [Joyous, Wanderer Cho, Passenger, Transport Reactor]
          hand: [Portal in a Crystal]
        - {}
    steps:
      - {player: 0, play: {hand: 0, pos: 0}}
    expect:
      players:
        - gold: 0
          board: [{card: Wanderer Cho, charges: 1}, Passenger 3/4, Transport Reactor 6/6]
        - {hand: [Joyous]}

  - name: balinda_doubles_nothing
    description: Its second cast fizzles once its target is gone.
    duos_tavern:
      players: [{board: [Joyous, Balinda Stonehearth], hand: [Portal in a Crystal]}, {}]
    steps:
      - {player: 0, play: {hand: 0, pos: 0}}
    expect:
      players: [{board: [Balinda Stonehearth]}, {hand: [Joyous]}]
      passes_this_turn: 1

  - name: a_duos_shop_can_offer_it
    description: In a Duos game the shop's spell can be a Duos spell of its Tier or lower.
    seed: 25
    duos_tavern:
      players: [{tavern_tier: 5, include_shop_spells: true}, {tavern_tier: 5}]
    steps: [start_turn]
    expect: {players: {0: {shop: {-1: {card: Portal in a Crystal, is_spell: true}}}}}
