card: Sprightly Scarab
scenarios:
  - name: sprightly_sprucing_gives_a_beast_1_1_and_reborn
    tavern: {board: [Flittering Bat]}   # a 1/4 Beast
    steps:
      - add_to_hand: Sprightly Scarab
      - play: {hand: Sprightly Scarab, pos: 0}   # targets the Beast it pushes right
      - choose_discover: 0   # Sprightly Sprucing: +1/+1 and Reborn
    expect: {board: [Sprightly Scarab, "Flittering Bat 2/5 reborn"]}

  - name: battlecry_does_not_target_itself_when_no_other_beast_is_on_board
    steps:
      - add_to_hand: Sprightly Scarab
      - play: Sprightly Scarab
    expect:
      discover_pending: null
      board: ["Sprightly Scarab 3/1"]

  - name: a_choose_one_before_a_triple_reward_lets_go_of_its_target
    description: >-
      A Golden Sprightly Scarab offers its Choose One and gives a Triple Reward card. Once the
      option is chosen, no Choose One is left: its target is forgotten, and the Triple Reward
      Discover picked after it leaves none set (the target used to stay set).
    tavern:
      tavern_tier: 3
      board: ["1/1 beast"]
      hand: [golden Sprightly Scarab]
    steps:
      - play: {hand: 0, pos: 1}
      - choose_discover: 0
      - play: {hand: Triple Reward, pos: 0}
      - choose_discover: 0
    expect: {discover_pending: null, pending_choice_target: null}
