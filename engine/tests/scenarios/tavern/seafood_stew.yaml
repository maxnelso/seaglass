card: Seafood Stew
scenarios:
  - name: gives_1_1_plus_1_1_per_bonus_keyword_among_your_minions
    tavern: {board: [Crackling Cyclone, Annoy-o-Module]}
    steps:
      - add_to_hand: Seafood Stew
      - play: {hand: Seafood Stew, pos: 0}
    expect: {board: ["Crackling Cyclone 6/5", Annoy-o-Module]}   # 1 + 3 keywords = +4/+4

  - name: gives_a_minion_in_the_tavern_1_1_per_bonus_keyword_among_your_minions
    tavern: {board: [Crackling Cyclone, Annoy-o-Module], shop: [Lullabot], hand: [Seafood Stew]}
    steps:
      - play: {hand: Seafood Stew, shop: 0}
    expect:
      shop: ["Lullabot 6/6"]   # 2/2 + (1 + 3 keywords on your board) x +1/+1
      board: ["Crackling Cyclone 2/1", Annoy-o-Module]
