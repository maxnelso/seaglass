card: Seafood Stew
scenarios:
  - name: gives_1_1_plus_1_1_per_bonus_keyword_among_your_minions
    tavern: {board: [Crackling Cyclone, Annoy-o-Module]}
    steps:
      - add_to_hand: Seafood Stew
      - play: {hand: Seafood Stew, pos: 0}
    expect: {board: ["Crackling Cyclone 6/5", Annoy-o-Module]}   # 1 + 3 keywords = +4/+4

  - name: spell_power_is_multiplied_too
    tavern: {board: [Crackling Cyclone, Annoy-o-Module]}
    steps:
      - add_to_hand: Humon'gozz   # your Tavern spells give an extra +1/+2 (its Divine Shield is already counted)
      - play: Humon'gozz
      - add_to_hand: Seafood Stew
      - play: {hand: Seafood Stew, pos: 0}
    expect: {board: ["Crackling Cyclone 10/13", Annoy-o-Module, "Humon'gozz 5/5"]}   # (1 + 3 keywords) x +2/+3
