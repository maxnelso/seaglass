card: Perfect Vision
scenarios:
  - name: sets_a_minions_stats_to_20_20
    tavern: {board: [Patient Scout]}
    steps:
      - add_to_hand: Perfect Vision
      - play: {hand: Perfect Vision, pos: 0}
    expect: {board: ["Patient Scout 20/20"]}

  - name: sets_the_stats_of_a_minion_in_the_tavern_to_20_20
    tavern: {shop: [Lullabot], hand: [Perfect Vision]}
    steps:
      - play: {hand: Perfect Vision, shop: 0}
    expect: {shop: ["Lullabot 20/20"]}
