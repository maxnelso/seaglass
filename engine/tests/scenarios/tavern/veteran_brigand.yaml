card: Veteran Brigand
scenarios:
  - name: choose_one_plays_3_blood_gems_on_all_your_minions
    tavern: {board: [Iron Groundskeeper]}
    steps:
      - add_to_hand: Veteran Brigand   # 8/8
      - play: Veteran Brigand
      - choose_discover: 0   # Brigand's Share: play 3 Blood Gems on all your minions
    expect: {board: ["Iron Groundskeeper 5/5", "Veteran Brigand 11/11"]}

  - name: choose_one_casts_blood_gem_barrage_3_times
    tavern: {board: [Iron Groundskeeper]}
    steps:
      - add_to_hand: Veteran Brigand
      - play: Veteran Brigand
      - choose_discover: 1   # Brigand's Barrage: cast Blood Gem Barrage 3 times
    expect: {auras: {refresh_blood_gems: 6, spells_played: 3}}   # 2 Blood Gems per cast; each cast counts
