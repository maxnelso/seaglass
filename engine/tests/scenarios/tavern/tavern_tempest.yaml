card: Tavern Tempest
scenarios:
  - name: battlecry_gets_a_random_elemental
    seed: 456
    tavern: {tavern_tier: 4}
    steps:
      - add_to_hand: Tavern Tempest
      - play: Tavern Tempest
    expect: {hand: [elemental]}

  - name: never_gets_a_tavern_tempest
    seeds: "1..41"
    tavern: {tavern_tier: 4}
    steps:
      - add_to_hand: golden Tavern Tempest
      - play: golden Tavern Tempest   # Battlecry: get 2 random Elementals, then a Triple Reward
    expect: {hand: {count: 3, 0: elemental, 1: elemental, 2: Triple Reward, none: {card: Tavern Tempest}}}
