card: Forsaken Weaver
scenarios:
  - name: casting_a_tavern_spell_gives_undead_3_attack_this_game
    tavern: {board: [Forsaken Weaver], hand: [Tavern Coin]}   # a 3/8 Undead
    steps:
      - play: {hand: Tavern Coin, pos: 0}   # an untargeted spell is played with pos 0
    expect:
      auras: {undead_bonus_attack: 3}
      board: ["Forsaken Weaver 6/8"]

  - name: a_spell_your_minion_casts_in_combat_gives_undead_attack_this_game
    description: >-
      Crimson Vindicator casts Mighty Dragonbreath when it attacks, and Forsaken Weaver gives your
      Undead +3 Attack this game first: at once in combat (itself, Plaguerunner in hand), and in the
      Tavern after it, while the stats the Weaver gained on the combat board are lost.
    tavern: {board: [Crimson Vindicator, Forsaken Weaver], hand: [Plaguerunner]}   # Undead 3/8 and 4/2
    steps:
      - fight: {board: [Patient Scout]}   # A has more minions: the Vindicator attacks first, once
    expect:
      combat:
        events: {where: {type: stat_buff, reason: Forsaken Weaver}, count: 1, all: {unit: 1, attack: 6, health: 8}}
        survivors_a: {1: "Forsaken Weaver 9/10"}   # + 3/2 from Mighty Dragonbreath
        hand_a: ["Plaguerunner 7/2"]
      auras: {undead_bonus_attack: 3}
      board: ["Crimson Vindicator 8/9", "Forsaken Weaver 6/8"]
      hand: ["Plaguerunner 7/2"]

  - name: a_bought_undead_gets_the_undead_attack_its_own_gold_gives
    description: >-
      The 3 Gold of the Buy make Air Revenant cast Easterly Winds, so Forsaken Weaver gives the
      Undead +3 Attack. The bought Undead is already in the hand then (confirmed), so it gets it (it
      used to miss it until the next aura sync).
    tavern:
      gold: 10
      board: [{card: Air Revenant, counter: 4}, Forsaken Weaver]   # 3 more Gold: Easterly Winds
      shop: [Cadaver Caretaker]
    steps:
      - buy: 0
    expect:
      auras: {undead_bonus_attack: 3}
      hand: ["Cadaver Caretaker 6/3"]
