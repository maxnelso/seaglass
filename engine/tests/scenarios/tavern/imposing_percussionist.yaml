card: Imposing Percussionist
scenarios:
  - name: battlecry_discovers_a_demon_and_deals_its_tier_to_the_hero
    seed: 435
    tavern: {tavern_tier: 4}
    steps:
      - add_to_hand: Imposing Percussionist
      - play: Imposing Percussionist
      - expect: {discover_pending: {0: {tavern_tier: {capture: tier}}}}
      - choose_discover: 0
    expect:
      health: "30 - $tier"
      hand: [demon]

  - name: never_discovers_an_imposing_percussionist
    seeds: "1..41"
    tavern: {tavern_tier: 4}
    steps:
      - add_to_hand: golden Imposing Percussionist
      - play: golden Imposing Percussionist   # 2 Discovers, then its Triple Reward
    expect:
      discover_pending: {count: 3, none: {card: Imposing Percussionist}}
      discover_queue: {count: 2, all: {none: {card: Imposing Percussionist}}}

  - name: the_discovered_demon_reaches_the_hand_before_its_tier_damage
    description: >-
      With 9 cards, the Discovered Demon takes the 10th slot, then its Tier is dealt as damage
      (confirmed): Eredar Escapist's Corrupted Cupcakes for that damage meet a full hand and are
      lost (the damage used to come first, and the Demon was lost instead).
    tavern:
      tavern_tier: 4
      board: [Eredar Escapist]   # after 4 damage: a Corrupted Cupcakes
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem,
             Blood Gem]   # 9 cards
      discover_pending:
        - {card: Imp-lusionist, discover_deals_tier_damage: true}   # a Tier 4 Demon
        - {card: Soul Rewinder, discover_deals_tier_damage: true}
    steps:
      - choose_discover: 0
    expect:
      health: 26
      hand: {count: 10, any: Imp-lusionist, none: Corrupted Cupcakes}
