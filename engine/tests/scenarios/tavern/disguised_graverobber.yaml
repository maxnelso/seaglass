card: Disguised Graverobber
scenarios:
  - name: battlecry_destroys_a_buffed_undead_for_a_plain_copy
    tavern:
      board: [Eternal Knight]
      hand: [Fortify, Disguised Graverobber]
    steps:
      - take_from_pool: Eternal Knight   # the copy on the board
      - expect: {pool: {Eternal Knight: 14}}
      - play: {hand: Fortify, pos: 0}
      - expect: {board: ["Eternal Knight 4/5 taunt"]}
      - play: {hand: Disguised Graverobber, pos: 0}   # destroys the Knight
    expect:
      auras: {counters: {Eternal Knight: {0: 1}}}   # Eternal Knights that died
      pool: {Eternal Knight: 14}   # 1 returned when destroyed, 1 taken for the copy
      hand: ["Eternal Knight 8/4 -taunt"]   # a plain 4/2, +4/+2 for the dead Knight

  - name: battlecry_triggers_target_deathrattle_and_reborn
    tavern:
      board: [Scarlet Skull, Risen Rider]
      hand: [Disguised Graverobber]
    steps:
      - play: {hand: Disguised Graverobber, pos: 0}   # destroys Scarlet Skull
    expect:
      board: [Disguised Graverobber, "Scarlet Skull -reborn", "Risen Rider 3/3"]
      hand: ["Scarlet Skull reborn"]

  - name: battlecry_on_a_golden_token_returns_a_plain_token
    tavern:
      board: ["Helping Hand golden"]
      hand: [Fortify, Disguised Graverobber]
    steps:
      - play: {hand: Fortify, pos: 0}
      - expect: {board: ["Helping Hand 2/4 golden reborn taunt"]}
      - play: {hand: Disguised Graverobber, pos: 0}
    expect: {hand: ["Helping Hand 2/1 -golden reborn -taunt"]}

  - name: played_right_of_the_bonehead_it_destroys_it_stays_right_of_the_skeletons
    tavern: {board: [Harmless Bonehead]}   # Deathrattle: summon two 1/1 Skeletons
    steps:
      - add_to_hand: Disguised Graverobber
      - play: {hand: Disguised Graverobber, pos: 1}   # destroys the Bonehead to its left
    expect:
      board: [Skeleton, Skeleton, Disguised Graverobber]   # the Skeletons take the Bonehead's place
      hand: [Harmless Bonehead]

  - name: the_plain_copy_has_its_cards_type
    description: >-
      A Duos-only Undead by the Dark Gift Amalgamation (no Solo template: the copy is built from
      it) comes back with its card's type, without the gift.
    tavern:
      board: ["Well Wisher gift:amalgamation"]
      hand: [Disguised Graverobber]
    steps:
      - play: {hand: Disguised Graverobber, pos: 0}
    expect: {hand: [{name: Well Wisher, tribe: none, dark_gifts: []}]}
