card: Channel the Devourer
scenarios:
  - name: sells_a_minion_and_gives_its_stats_to_another
    seed: 848
    tavern: {board: [Eredar Escapist, Iron Groundskeeper]}
    steps:
      - add_to_hand: Channel the Devourer
      - play: {hand: Channel the Devourer, pos: 0}
    expect:
      gold: 1   # from the sale
      board: ["Iron Groundskeeper 7/12"]

  - name: the_copied_stats_get_no_spell_power
    seed: 848
    tavern: {board: [Eredar Escapist]}   # 5/10
    steps:
      - add_to_hand: Humon'gozz   # your Tavern spells give an extra +1/+2
      - play: Humon'gozz
      - add_to_hand: Channel the Devourer
      - play: {hand: Channel the Devourer, pos: 0}   # sells the Escapist
    expect:
      gold: 1   # from the sale
      board: ["Humon'gozz 10/15"]   # 5/5 + exactly the Escapist's 5/10

  - name: cant_sell_a_minion_in_the_tavern
    tavern: {board: [Lullabot, Iron Groundskeeper], shop: [Glim Guardian], hand: [Channel the Devourer]}
    steps:
      - expect_illegal: {play: {hand: Channel the Devourer, shop: 0}}   # only your minions can be sold

  - name: its_sale_reaches_the_heros_after_sell
    description: (confirmed) Trade Prince Gallywix's Smart Savings sees the sale.
    seed: 848
    tavern:
      auras: {hero: Trade Prince Gallywix}
      board: [Eredar Escapist, Iron Groundskeeper]
      hand: [Channel the Devourer]
    steps:
      - play: {hand: Channel the Devourer, pos: 0}
    expect: {gold: 1, bonus_gold_next_turn: 1}
