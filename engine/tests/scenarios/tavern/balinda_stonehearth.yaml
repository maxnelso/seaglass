card: Balinda Stonehearth
scenarios:
  - name: spells_targeting_a_friendly_minion_cast_twice
    tavern: {board: [Balinda Stonehearth, Iron Groundskeeper], hand: [Fortify]}   # Fortify: +0/+3 and Taunt
    steps:
      - play: {hand: Fortify, pos: 1}
    expect: {board: [Balinda Stonehearth, "Iron Groundskeeper 2/8 taunt"]}   # cast twice: +0/+6

  - name: untargeted_spells_cast_once
    tavern: {board: [Balinda Stonehearth], hand: [Leaf Through the Pages]}   # get 2 free Refreshes
    steps:
      - play: {hand: Leaf Through the Pages, pos: 0}   # untargeted
    expect: {auras: {free_refreshes: 2}}

  # Every cast counts as a spell cast (docs/tavern.md §7.4), so the spell-cast observers below
  # trigger twice. Tavern Dish Banana (+2/+2) is a targeted Tavern spell: +4/+4 with Balinda.

  - name: felboar_counts_both_casts_of_a_targeted_spell
    tavern:
      board: [Balinda Stonehearth, Felboar]   # Felboar: 2/6, consumes a Tavern minion after 3 spells
      shop: [Firelands Fugitive]   # 5/7
      hand: [Blood Gem, Blood Gem]
    steps:
      - repeat: 2
        steps: [{play: {hand: Blood Gem, pos: 1}}]   # on Felboar
    expect:
      shop: []
      board:
        - Balinda Stonehearth
        - {card: Felboar, attack: 11, health: 17, counter: 1}   # 4 casts (+4/+4), the 5/7 after the 3rd

  - name: charging_czarina_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, Charging Czarina], hand: [Tavern Dish Banana]}   # Czarina: 4/1 Divine Shield
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}   # on Balinda
    expect: {board: ["Balinda Stonehearth 10/10", "Charging Czarina 12/1"]}   # +4 Attack per cast

  - name: forsaken_weaver_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, Forsaken Weaver], hand: [Tavern Dish Banana]}   # a 3/8 Undead
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}   # on Balinda
    expect:
      auras: {undead_bonus_attack: 6}   # +3 per cast
      board: ["Balinda Stonehearth 10/10", "Forsaken Weaver 9/8"]

  - name: living_azerite_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, Living Azerite], hand: [Tavern Dish Banana]}
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}   # on Balinda
    expect: {auras: {tavern_elemental_atk: 8, tavern_elemental_hp: 6}}   # +4/+3 per cast

  - name: sha_of_fear_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, Sha of Fear], hand: [Tavern Dish Banana]}   # 10/13; the deity starts 1/1
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}   # on Balinda
    expect:
      board: ["Balinda Stonehearth 16/16", "Sha of Fear 16/19"]   # +3/+3 per cast
      auras: {deity: {attack: 7, health: 7}}

  - name: timecapn_hooktail_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, "Timecap'n Hooktail"], hand: [Tavern Dish Banana]}   # Hooktail: 1/4
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}   # on Balinda
    expect: {board: ["Balinda Stonehearth 12/10", "Timecap'n Hooktail 3/4"]}   # +1 Attack per cast

  - name: vicious_mindslasher_triggers_on_both_casts
    tavern:
      auras: {deity: {kind: cthun}}
      board: [Balinda Stonehearth, Vicious Mindslasher]   # 1/2
      hand: [Tavern Dish Banana]
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}   # on Balinda
    expect:
      board: ["Balinda Stonehearth 10/10", "Vicious Mindslasher 3/6"]   # +1/+2 per cast
      auras: {deity: {attack: 3, health: 5}}

  - name: devilish_distractor_triggers_on_both_casts
    tavern:
      board: [Balinda Stonehearth, Devilish Distractor]   # 4/7
      shop: [Iron Groundskeeper]
      hand: [Tavern Dish Banana]
    steps:
      - play: {hand: Tavern Dish Banana, pos: 1}   # on the Distractor
    expect:
      board: [Balinda Stonehearth, "Devilish Distractor 8/11"]
      auras: {tavern_all_atk: 2, tavern_all_hp: 4}   # +1/+2 per cast
      shop: ["Iron Groundskeeper 4/6"]

  - name: gatekeeper_amalgam_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, Gatekeeper Amalgam, Flittering Bat], hand: [Fortify]}   # a 6/6 All, a 1/4 Beast
    steps:
      - play: {hand: Fortify, pos: 1}   # on the Amalgam: a Misplaced Tea Set per cast
    expect:   # each Tea Set: +4/+4 on the Amalgam (Aberration) and the Bat (Beast)
      board: ["Balinda Stonehearth 6/6", "Gatekeeper Amalgam 14/20 taunt", "Flittering Bat 9/12"]

  - name: glambot_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, Glambot], hand: [Tavern Dish Banana]}   # a 4/4 Mech
    steps:
      - play: {hand: Tavern Dish Banana, pos: 1}   # on Glambot
    expect: {board: [Balinda Stonehearth, "Glambot 16/16"]}   # +2/+2 and a 4/4 Satellite per cast

  - name: shamanic_tidecaller_triggers_on_both_casts
    tavern:
      board: [Balinda Stonehearth, Shamanic Tidecaller]   # a 5/7 Murloc
      hand: [Tavern Dish Banana, Flighty Scout]   # Flighty Scout: 3/3 Murloc
    steps:
      - play: {hand: Tavern Dish Banana, pos: 1}   # on the Tidecaller
    expect:
      board: [Balinda Stonehearth, "Shamanic Tidecaller 15/17"]   # +2/+2 and +3/+3 per cast
      hand: ["Flighty Scout 9/9"]

  - name: twilight_tidehunter_triggers_on_both_casts
    tavern: {board: [Balinda Stonehearth, Twilight Tidehunter], hand: [Iron Groundskeeper, Tavern Dish Banana]}
    steps:
      - play: {hand: Tavern Dish Banana, pos: 1}   # on the Tidehunter
    expect: {hand: ["Iron Groundskeeper 18/18"]}   # +8/+8 per cast

  # Only casts on a friendly minion repeat (docs/tavern.md §7.4).
  - name: a_spell_cast_on_a_tavern_minion_is_cast_once
    tavern: {board: [Balinda Stonehearth], shop: [Lullabot], hand: [Tavern Dish Banana, Tavern Dish Banana]}   # Lullabot: 2/2
    steps:
      - play: {hand: Tavern Dish Banana, shop: 0}   # +2/+2 once
      - expect: {shop: ["Lullabot 4/4"], auras: {tavern_spells_cast: 1}}
      - play: {hand: Tavern Dish Banana, pos: 0}   # on Balinda: cast twice
    expect:
      shop: ["Lullabot 4/4"]
      board: ["Balinda Stonehearth 10/10"]
      auras: {tavern_spells_cast: 3}

  # The casts follow their target; once it is gone, the remaining casts fizzle: they do nothing
  # and trigger nothing.

  - name: a_destroyed_target_fizzles_the_remaining_casts
    tavern: {board: [Balinda Stonehearth, Harmless Bonehead, Felboar], hand: [Butchering]}
    steps:
      - play: {hand: Butchering, pos: 1}   # destroys the Bonehead: its Deathrattle summons two 1/1 Skeletons
    expect:
      # The second cast doesn't destroy the Skeleton that took the Bonehead's place.
      board: [Balinda Stonehearth, "Skeleton 9/1", "Skeleton 9/1", {card: Felboar, counter: 1}]
      auras: {undead_bonus_attack: 8, tavern_spells_cast: 1}   # one cast: +8 Attack, Felboar counts 1 spell

  - name: a_sold_target_fizzles_the_remaining_casts
    seed: 848
    tavern: {gold: 0, board: [Balinda Stonehearth, Flittering Bat, Buzzing Vermin], hand: [Channel the Devourer]}
    steps:
      - play: {hand: Channel the Devourer, pos: 1}   # sells the 1/4 Bat, giving its stats to Balinda or the Vermin
    expect:
      gold: 1   # one sale: the Vermin that slid into the Bat's slot isn't sold
      board: {count: 2, 0: Balinda Stonehearth, 1: {card: Buzzing Vermin}, sum: {health: 11}}   # 6 + 1 + 4
      auras: {tavern_spells_cast: 1}

  - name: a_transformed_target_fizzles_the_remaining_casts
    seed: 823
    tavern: {board: [Balinda Stonehearth, Glim Guardian], hand: [Robust Evolution]}   # Glim Guardian: a 1/4 Tier 1
    steps:
      - play: {hand: Robust Evolution, pos: 1}
    expect:
      board: [Balinda Stonehearth, "1/4 t2"]   # transformed once, not again into a Tier 3
      auras: {tavern_spells_cast: 1}

  - name: the_casts_follow_their_target_when_it_moves
    tavern:
      catalog: tier1   # the only other Tier 1 Beast is Flittering Bat
      board: [Flittering Bat, Flittering Bat, Balinda Stonehearth, Buzzing Vermin]
      hand: ["Chef's Choice"]
    steps:
      # The first cast gets a Flittering Bat: it triples with the two on the board, so the Vermin
      # moves from slot 3 to slot 1. The second cast still targets the Vermin.
      - play: {hand: "Chef's Choice", pos: 3}
    expect:
      board: [Balinda Stonehearth, Buzzing Vermin]
      hand: ["golden Flittering Bat 2/8", "Flittering Bat 1/4"]
      auras: {tavern_spells_cast: 2}

  # A Choose One spell is chosen once; the chosen option applies once per cast.

  - name: a_choose_one_spell_is_chosen_once_for_all_casts
    tavern: {board: [Balinda Stonehearth, Iron Groundskeeper], hand: [Alliance Flag]}   # Iron Groundskeeper: 2/2
    steps:
      - play: {hand: Alliance Flag, pos: 1}
      - expect: {discover_pending: {count: 2}, discover_queue: []}   # a single Choose One
      - choose_discover: 0   # +3/+1
    expect:
      discover_pending: null
      board: [Balinda Stonehearth, "Iron Groundskeeper 8/4"]   # +3/+1 per cast
      auras: {tavern_spells_cast: 2}

  - name: a_combined_choose_one_spell_stays_combined_for_all_casts
    tavern:
      board: [Balinda Stonehearth, {card: Thorned Trailblazer, charges: 1}, Iron Groundskeeper]
      hand: [Alliance Flag]
    steps:
      - play: {hand: Alliance Flag, pos: 2}   # both options (+3/+1 and +1/+3), using the Trailblazer's charge
    expect:
      discover_pending: null
      board: [Balinda Stonehearth, {card: Thorned Trailblazer, charges: 0}, "Iron Groundskeeper 10/10"]   # +4/+4 per cast

  - name: choose_one_observers_trigger_once
    tavern: {board: [Balinda Stonehearth, Turbo Hogrider, Iron Groundskeeper], hand: [Alliance Flag]}   # Hogrider: a 6/8 Quilboar
    steps:
      - play: {hand: Alliance Flag, pos: 2}
      - choose_discover: 0   # +3/+1
    expect:
      discover_pending: null
      # One Choose One card was played: the Hogrider plays 2 Blood Gems (+2/+2) on itself once.
      board: [Balinda Stonehearth, "Turbo Hogrider 8/10", "Iron Groundskeeper 8/4"]

  # Every cast counts as a spell cast, e.g. for Faceless Converter.
  - name: every_cast_counts_as_a_spell_cast
    tavern: {board: [Balinda Stonehearth, Faceless Converter], hand: [Tavern Dish Banana]}   # Converter: 5/5
    steps:
      - play: {hand: Tavern Dish Banana, pos: 1}
      - expect: {auras: {tavern_spells_cast: 2}, board: [Balinda Stonehearth, "Faceless Converter 9/9"]}
      - fight: {board: [Stalwart Kodo]}   # a 16/32: the Converter dies
    # Its Deathrattle gives the 1/1 Deity +2/+1, improved by 2 spells: +6/+3.
    expect: {auras: {deity: {attack: 7, health: 4}}}
