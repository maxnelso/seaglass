card: Sky-hatch Runaway
scenarios:
  - name: activate_triggers_a_friendly_rally
    tavern: {gold: 10, board: [Sky-hatch Runaway, Glim Guardian]}   # Glim Guardian: 1/4, Rally: gain +2 Attack
    steps:
      - activate: {pos: Sky-hatch Runaway, target: 1}
    expect: {board: [Sky-hatch Runaway, "Glim Guardian 3/4"]}

  - name: it_can_only_target_another_friendly_minion
    tavern: {gold: 10, board: [Sky-hatch Runaway, Glim Guardian]}
    steps:
      - expect_illegal: {activate: {pos: Sky-hatch Runaway, target: 0}}   # itself
      - expect_legal: {activate: {pos: Sky-hatch Runaway, target: 1}}   # Glim Guardian
