card: Robust Evolution
scenarios:
  - name: transforms_a_minion_into_a_next_tier_minion_keeping_its_stats
    seed: 823
    tavern:
      board: [Glim Guardian]
      hand: [Tavern Dish Banana, Robust Evolution]
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}
      - play: {hand: Robust Evolution, pos: 0}
    expect: {board: ["3/6 t2"]}

  - name: a_golden_minion_becomes_a_non_golden_one
    seed: 823
    tavern: {board: ["golden Glim Guardian 2/8"], hand: [Robust Evolution]}
    steps:
      - play: {hand: Robust Evolution, pos: 0}
    expect: {board: ["2/8 t2 -golden"]}   # keeps the golden stats

  - name: a_tier_6_minion_becomes_a_random_tier_6_minion
    seed: 823
    tavern:
      board: [Eredar Escapist]   # 6/8, Tier 6
      hand: [Tavern Dish Banana, Robust Evolution]
    steps:
      - play: {hand: Tavern Dish Banana, pos: 0}
      - play: {hand: Robust Evolution, pos: 0}
    # It could roll Eredar Escapist again; this seed rolls another Tier 6.
    expect: {board: [{all_of: ["8/10 t6", {not: Eredar Escapist}]}]}

  - name: transforms_a_minion_in_the_tavern
    seed: 823
    tavern: {shop: [Glim Guardian, Lullabot], hand: [Robust Evolution]}   # Glim Guardian: a 1/4 Tier 1
    steps:
      - play: {hand: Robust Evolution, shop: Glim Guardian}
    expect: {shop: ["1/4 t2", "Lullabot 2/2"]}

  - name: the_undead_attack_is_counted_once
    description: >-
      It keeps the stats without the auras on them, and the new minion gets its own: a 4/1
      Harmless Bonehead (1/1 and the Undead +3 Attack) becomes a 4/1 Undead (it used to count the
      +3 twice: 7/1) or a 1/1 minion of another type.
    seeds: "1..=30"
    tavern:
      board: [Harmless Bonehead]
      hand: [Robust Evolution]
      auras: {undead_bonus_attack: 3}
    steps:
      - sync_all_auras
      - expect: {board: ["Harmless Bonehead 4/1"]}
      - play: {hand: Robust Evolution, pos: 0}
      - if: {board: {0: {tribe: undead}}}
        then:
          - expect: {board: [{attack: 4}]}
        else:
          - expect: {board: [{attack: 1}]}
