card: Wave of Gold
scenarios:
  - name: gives_3_2_twice_for_golden_minions
    tavern: {board: [Iron Groundskeeper, golden Iron Groundskeeper]}
    steps:
      - add_to_hand: Wave of Gold
      - play: {hand: Wave of Gold, pos: 0}   # an untargeted spell is played at 0
    expect: {board: ["Iron Groundskeeper 5/4", "golden Iron Groundskeeper 8/6"]}
