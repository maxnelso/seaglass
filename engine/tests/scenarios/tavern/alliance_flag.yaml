card: Alliance Flag
scenarios:
  - name: choose_one_gives_a_minion_3_1
    tavern: {board: [Iron Groundskeeper]}
    steps:
      - add_to_hand: Alliance Flag
      - play: {hand: Alliance Flag, pos: 0}
      - choose_discover: 0   # +3/+1 (option 1 is +1/+3)
    expect: {board: ["Iron Groundskeeper 5/3"]}

  - name: choose_one_gives_a_minion_in_the_tavern_1_3
    tavern: {board: [Iron Groundskeeper], shop: [Lullabot], hand: [Alliance Flag]}   # Lullabot: 2/2
    steps:
      - play: {hand: Alliance Flag, shop: 0}
      - choose_discover: 1   # +1/+3
    expect:
      shop: ["Lullabot 3/5"]
      board: ["Iron Groundskeeper 2/2"]
