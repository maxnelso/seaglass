card: Hooktusk, Master Marauder
scenarios:
  - name: discovering_gives_other_pirates_stats_improved_by_golden_minions_played
    seed: 615
    tavern:
      board: ["Hooktusk, Master Marauder", Southsea Busker]   # Southsea Busker: 3/1 Pirate
      hand: [golden Cord Puller]
    steps:
      - play: golden Cord Puller   # 1 Golden minion played (+1/+1 -> +2/+2) and a Triple Reward
      - play: {hand: Triple Reward, pos: 0}
      - choose_discover: 0
    expect:
      board: {any: "Southsea Busker 5/3"}

  - name: aureate_laureate_counts_as_a_golden_minion_played
    seed: 615
    tavern:
      board: ["Hooktusk, Master Marauder", Southsea Busker]   # Southsea Busker: 3/1 Pirate
      hand: [Aureate Laureate, golden Cord Puller]
    steps:
      - play: Aureate Laureate   # always Golden, without a Triple Reward
      - play: golden Cord Puller   # and its Triple Reward
      - play: {hand: Triple Reward, pos: 0}
      - choose_discover: 0
    expect:
      auras: {golden_minions_played: 2}
      board: {1: "Southsea Busker 6/4"}   # 3/1 + (1 + 2)/(1 + 2)
