card: Gatekeeper Amalgam
scenarios:
  - name: a_spell_cast_on_it_casts_misplaced_tea_set
    description: >-
      Fortify on the Amalgam casts Misplaced Tea Set: +4/+4 to a friendly minion of each type.
      The Amalgam (All) takes a type other than Beast, so Flittering Bat (1/4 Beast) gets the Beast buff.
    seed: 612
    tavern: {board: [Gatekeeper Amalgam, Flittering Bat], hand: [Fortify]}   # a 6/6 All
    steps:
      - play: {hand: Fortify, pos: 0}
    expect: {board: {1: "Flittering Bat 5/8"}}

  - name: its_misplaced_tea_set_is_a_tavern_spell_you_cast
    description: >-
      Fortify on it casts Misplaced Tea Set, which counts as a Tavern spell you cast: Vicious
      Mindslasher triggers for both spells, and the Tea Set is the last Tavern spell you cast, so
      Cataclysmic Harbinger gets a copy of it at the end of the turn.
    tavern:
      board: [Gatekeeper Amalgam, Vicious Mindslasher, Cataclysmic Harbinger]   # Mindslasher: 1/2
      hand: [Fortify]
    steps:
      - play: {hand: Fortify, pos: 0}
      - expect:
          auras: {tavern_spells_cast: 2}
          board: {1: "Vicious Mindslasher 7/10"}   # +1/+2 per spell and the Tea Set's +4/+4
      - end_turn
    expect: {hand: [Misplaced Tea Set]}

  - name: a_blood_gem_your_minion_plays_on_it_casts_no_tea_set
    description: >-
      Turbo Hogrider plays 2 Blood Gems on each of your Quilboar, the Amalgam (All) included: they
      aren't spells you cast on it, so it casts no Misplaced Tea Set.
    tavern:
      board: [Turbo Hogrider, Gatekeeper Amalgam]   # a 6/8 Quilboar; a 6/6 All
      hand: [Alliance Flag]
    steps:
      - play: {hand: Alliance Flag, pos: 0}   # on the Hogrider
      - choose_discover: 0   # +3/+1
    expect:
      board: ["Turbo Hogrider 11/11", "Gatekeeper Amalgam 8/8"]   # +2/+2 (Blood Gems), no Tea Set
      auras: {tavern_spells_cast: 1}   # Alliance Flag only
