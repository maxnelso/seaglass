card: Gunpowder Courier
scenarios:
  - name: spending_5_gold_gives_your_pirates_3_1
    tavern: {gold: 10, board: [Gunpowder Courier], shop: [Patient Scout, Patient Scout]}   # Courier: 2/5 Pirate
    steps:
      - buy: 0   # 3 Gold spent
      - expect: {board: ["Gunpowder Courier 2/5"]}
      - buy: 0   # 6 Gold spent
    expect: {board: ["Gunpowder Courier 5/6"]}

  - name: ominous_seers_discount_lowers_the_gold_spent
    description: Recruit a Trainee costs 2 - 1 = 1 Gold, so it takes 4 more Gold to make the 5.
    seed: 426
    tavern: {gold: 10, board: [Gunpowder Courier], hand: [Ominous Seer], shop: [Recruit a Trainee]}
    steps:
      - play: Ominous Seer
      - buy: Recruit a Trainee   # 1 Gold
      - repeat: 3   # 1 + 3 = 4 Gold
        steps: [refresh]
      - expect: {gold: 6, board: {0: "Gunpowder Courier 2/5"}}
      - refresh   # the 5th Gold
    expect: {gold: 5, board: {0: "Gunpowder Courier 5/6"}}
