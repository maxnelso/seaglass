card: Misplaced Tea Set
scenarios:
  - name: gives_a_minion_of_each_type_4_4
    seed: 840
    tavern: {board: [Flittering Bat, Cord Puller], hand: [Misplaced Tea Set]}   # 1/4 Beast, 1/1 Mech
    steps:
      - play: {hand: Misplaced Tea Set, pos: 0}
    expect: {board: ["Flittering Bat 5/8", "Cord Puller 5/5"]}

  - name: a_dual_type_minion_takes_the_type_nobody_else_has
    description: >-
      The best assignment buffs both: Treasure Parrot (Beast/Pirate) as the Pirate and Flittering
      Bat as the Beast.
    seeds: "1..20"
    tavern: {board: [Treasure Parrot, Flittering Bat], hand: [Misplaced Tea Set]}   # 5/5, 1/4
    steps:
      - play: {hand: Misplaced Tea Set, pos: 0}
    expect: {board: ["Treasure Parrot 9/9", "Flittering Bat 5/8"]}

  - name: an_all_type_minion_takes_a_type_left_over
    description: >-
      Nightmare Par-tea Guest (All) gets a Tea Set and takes a type nobody else has, so all three
      minions get +4/+4.
    seeds: "1..20"
    tavern: {board: [Treasure Parrot, Flittering Bat], hand: [Nightmare Par-tea Guest]}   # the Guest is a 3/3
    steps:
      - play: Nightmare Par-tea Guest   # Battlecry: get a Misplaced Tea Set
      - play: {hand: Misplaced Tea Set, pos: 0}
    expect: {board: ["Treasure Parrot 9/9", "Flittering Bat 5/8", "Nightmare Par-tea Guest 7/7"]}

  - name: only_one_of_two_bats_can_be_the_beast
    description: The Parrot is the Pirate and one of the Bats, at random, the Beast.
    seeds: "1..20"
    tavern: {board: [Treasure Parrot, Flittering Bat, Flittering Bat], hand: [Misplaced Tea Set]}
    steps:
      - play: {hand: Misplaced Tea Set, pos: 0}
    expect:
      board:
        all_of:
          - {0: "Treasure Parrot 9/9"}
          - {where: "Flittering Bat 5/8", count: 1}
          - {where: "Flittering Bat 1/4", count: 1}

  - name: which_bat_is_the_beast_is_random_left
    seeds: [1, 3]
    tavern: {board: [Treasure Parrot, Flittering Bat, Flittering Bat], hand: [Misplaced Tea Set]}
    steps:
      - play: {hand: Misplaced Tea Set, pos: 0}
    expect: {board: ["Treasure Parrot 9/9", "Flittering Bat 5/8", "Flittering Bat 1/4"]}

  - name: which_bat_is_the_beast_is_random_right
    seeds: [2, 4]
    tavern: {board: [Treasure Parrot, Flittering Bat, Flittering Bat], hand: [Misplaced Tea Set]}
    steps:
      - play: {hand: Misplaced Tea Set, pos: 0}
    expect: {board: ["Treasure Parrot 9/9", "Flittering Bat 1/4", "Flittering Bat 5/8"]}
