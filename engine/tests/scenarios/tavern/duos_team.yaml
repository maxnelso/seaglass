topic: Duos Tavern - the team
defaults:
  duos_tavern: {catalog: duos}
scenarios:
  # --- Shared Health and Armor ------------------------------------------------------------

  - name: the_team_shares_30_health_and_its_armor
    duos_tavern: {armor: 7}
    expect:
      health: 30
      armor: 7
      players: [{health: 30, armor: 7}, {health: 30, armor: 7}]

  - name: a_health_cost_is_paid_from_the_team_pool
    duos_tavern:
      players: [{gold: 0, shop: [Hasty Excavation]}, {}]   # costs 3 Health
    steps:
      - {player: 0, buy: Hasty Excavation}
    expect:
      health: 27
      players: [{health: 27, hand: [Hasty Excavation]}, {health: 27}]

  - name: a_health_cost_needs_the_team_pool_above_it
    duos_tavern:
      health: 3
      players: [{shop: [Hasty Excavation]}, {}]
    steps:
      - {player: 0, expect_illegal: {buy: Hasty Excavation}}
      - set: {armor: 1}
      - {player: 0, expect_legal: {buy: Hasty Excavation}}

  - name: hero_damage_takes_the_team_armor_then_health
    duos_tavern: {armor: 2}
    steps:
      - {player: 1, deal_hero_damage: 5}
    expect:
      armor: 0
      health: 27
      players: [{armor: 0, health: 27}, {armor: 0, health: 27}]

  - name: only_the_damaged_players_minions_trigger
    description: >-
      Player 0's Wrath Weaver deals 1 damage to player 0's hero: the team loses 1 Health, but
      player 1's "your hero takes damage" minions don't trigger.
    duos_tavern:
      players:
        - {board: [Wrath Weaver], hand: [Ominous Seer]}   # a 1/3; a Demon
        - {board: [Soul Rewinder, Tichondrius, Eredar Escapist]}
    steps:
      - {player: 0, play: Ominous Seer}
    expect:
      health: 29
      players:
        - {board: ["Wrath Weaver 3/5", Ominous Seer]}
        - {board: ["Soul Rewinder 4/2", "Tichondrius 4/4", {card: Eredar Escapist, counter: 0}]}

  - name: your_own_minions_trigger_on_your_damage_for_the_team
    description: Player 0's own Soul Rewinder rewinds the damage, so the team keeps its Health.
    duos_tavern:
      players:
        - {board: [Wrath Weaver, Soul Rewinder], hand: [Ominous Seer]}
        - {}
    steps:
      - {player: 0, play: Ominous Seer}
    expect:
      health: 30
      players: {0: {board: ["Wrath Weaver 3/5", "Soul Rewinder 4/4", Ominous Seer]}}

  - name: a_teammates_health_payment_does_not_trigger_your_minions
    description: >-
      Player 0 pays 3 Health for Hasty Excavation: their Eredar Escapist counts it, their
      teammate's doesn't.
    duos_tavern:
      players:
        - {gold: 0, board: [Eredar Escapist], shop: [Hasty Excavation]}
        - {board: [Eredar Escapist]}
    steps:
      - {player: 0, buy: Hasty Excavation}
    expect:
      health: 27
      players:
        - {board: [{card: Eredar Escapist, counter: 3}]}
        - {board: [{card: Eredar Escapist, counter: 0}]}

  - name: holy_vanguard_counts_the_teams_health
    description: >-
      Player 0's hero damage takes the team to 15 Health, which gives player 1's Holy Vanguard
      its +30/+30.
    duos_tavern:
      health: 16
      players: [{}, {board: [Holy Vanguard]}]
    steps:
      - {player: 1, sync_all_auras}
      - expect: {players: {1: {board: ["Holy Vanguard 10/10"]}}}
      - {player: 0, deal_hero_damage: 1}
    expect:
      health: 15
      players: {1: {board: ["Holy Vanguard 40/40"]}}

  - name: armor_stash_sets_the_teams_armor
    duos_tavern:
      armor: 9
      players: [{hand: [Armor Stash]}, {}]
    steps:
      - {player: 0, play: Armor Stash}
    expect: {armor: 5, players: [{armor: 5}, {armor: 5}]}

  - name: a_team_at_0_health_is_out
    duos_tavern: {health: 2}
    steps:
      - expect: {out: false}
      - {player: 0, deal_hero_damage: 2}
    expect: {health: 0, out: true}

  # --- Turns ------------------------------------------------------------------------------

  - name: each_player_starts_their_own_turn
    steps: [start_turn]
    expect:
      players:
        - {turn: 1, gold: 3, max_gold: 3, shop: {count: 3}}
        - {turn: 1, gold: 3, max_gold: 3, shop: {count: 3}}
      ended: [false, false]

  - name: both_shops_come_from_the_one_card_pool
    description: 21 Tier 1 minions with 15 copies each; each player's shop takes 3.
    duos_tavern: {catalog: tier1}
    steps: [start_turn]
    expect: {pool_size: 309}

  - name: teammates_act_in_the_same_turn
    duos_tavern:
      players:
        - {gold: 4, hand: [Joyous], shop: [Zoatroid]}
        - {gold: 3, shop: [Flittering Bat]}
    steps:
      - {player: 0, pass: Joyous}
      - {player: 1, buy: Flittering Bat}
      - {player: 1, play: Joyous}
      - {player: 0, buy: Zoatroid}
      - {player: 0, end_turn}
      - expect: {ended: [true, false]}
      - {player: 1, play: Flittering Bat}
      - {player: 1, end_turn}
    expect:
      ended: [true, true]
      players:
        - {gold: 0, hand: [Zoatroid]}
        - {gold: 0, board: [Joyous, Flittering Bat]}

  - name: a_player_takes_no_actions_after_ending_their_turn
    duos_tavern:
      players: [{gold: 5, hand: [Joyous]}, {}]
    steps:
      - {player: 0, end_turn}
      - {player: 0, expect_illegal: {play: Joyous}}
      - {player: 0, expect_illegal: {pass: Joyous}}
      - {player: 0, expect_error: end_turn}
    expect: {ended: [true, false]}

  - name: a_new_turn_starts_both_players_again
    steps:
      - start_turn
      - {player: 0, end_turn}
      - {player: 1, end_turn}
      - start_turn
    expect:
      ended: [false, false]
      players: [{turn: 2, gold: 4}, {turn: 2, gold: 4}]

  # --- Team counters -------------------------------------------------------------------------

  - name: the_team_counts_both_players_passes
    description: The counters are mirrored into both players' auras, for the cards that read them.
    duos_tavern:
      players:
        - {gold: 2, hand: [Joyous, Zoatroid]}
        - {gold: 1, hand: [Flittering Bat]}
    steps:
      - {player: 0, pass: Joyous}
      - {player: 1, pass: Flittering Bat}
      - {player: 0, pass: Zoatroid}
      - expect:
          passes_this_turn: 3
          passes_this_game: 3
          players:
            - {auras: {team_passes_this_turn: 3, team_passes_this_game: 3}}
            - {auras: {team_passes_this_turn: 3, team_passes_this_game: 3}}
      - start_turn
    expect:
      passes_this_turn: 0
      passes_this_game: 3
      players:
        - {auras: {team_passes_this_turn: 0, team_passes_this_game: 3}}
        - {auras: {team_passes_this_turn: 0, team_passes_this_game: 3}}

  # --- The first fighter ----------------------------------------------------------------------

  - name: the_first_fighter_is_a_coin_flip_on_the_first_turn
    seed: 1
    steps: [start_turn]
    expect: {first_fighter: 1}

  - name: the_first_fighter_coin_flip_can_pick_either_player
    seed: 2
    steps: [start_turn]
    expect: {first_fighter: 0}

  - name: the_first_fighter_switches_with_its_switch_chance
    seeds: "1..=4"
    duos_tavern: {first_fighter_switch_chance: 1.0}
    steps:
      - start_turn
      - expect: {first_fighter: {capture: first}}
      - start_turn
      - expect: {first_fighter: {not: {same_as: first}}}
      - start_turn
    expect: {first_fighter: {same_as: first}}

  - name: with_no_switch_chance_the_first_fighter_stays
    seeds: "1..=4"
    duos_tavern: {first_fighter_switch_chance: 0.0}
    steps:
      - start_turn
      - expect: {first_fighter: {capture: first}}
      - start_turn
      - start_turn
    expect: {first_fighter: {same_as: first}}
