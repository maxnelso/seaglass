card: Lockbox
scenarios:
  - name: opens_into_a_golden_minion_when_the_countdown_ends
    seed: 952
    steps:
      - add_to_hand: {card: Lockbox, lockbox_turns_left: 1}
      - start_turn
    expect: {hand: [{is_spell: false, is_golden: true}]}

  - name: the_golden_minion_gives_a_triple_reward_when_played
    seed: 952
    steps:
      - add_to_hand: {card: Lockbox, lockbox_turns_left: 1}
      - start_turn
      - play: 0
      - expect: {hand: [{card: Triple Reward, counter: 2}]}   # Tavern Tier + 1
      - play: {hand: Triple Reward, pos: 0}
    expect:
      board: [{is_golden: true}]
      discover_pending: {count: 3, all: {tavern_tier: 2}}
