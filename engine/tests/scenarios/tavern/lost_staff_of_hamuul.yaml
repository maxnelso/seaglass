card: Lost Staff of Hamuul
scenarios:
  - name: refreshes_the_tavern_with_minions_of_the_targets_type
    seed: 862
    tavern: {include_shop_spells: true, tavern_tier: 6, board: [Glim Guardian], hand: [Lost Staff of Hamuul]}
    steps:
      - play: {hand: Lost Staff of Hamuul, pos: 0}
    expect:
      shop: {count: ">= 1", all: {any_of: [{is_spell: true}, dragon]}}   # every minion is a Dragon

  - name: cant_target_a_minion_without_a_type
    tavern: {tavern_tier: 6, board: [Iron Groundskeeper], hand: [Lost Staff of Hamuul]}   # Iron Groundskeeper: no type
    steps:
      - expect_illegal: {play: {hand: Lost Staff of Hamuul, pos: 0}}

  - name: a_two_type_target_refreshes_with_both_types
    seed: 862
    tavern: {tavern_tier: 6, board: [Treasure Parrot], hand: [Lost Staff of Hamuul]}   # a Beast/Pirate
    steps:
      - play: {hand: Lost Staff of Hamuul, pos: 0}
    expect:
      shop: {count: 6, all: {any_of: [beast, pirate]}}

  - name: a_naga_target_refreshes_with_demons_and_nagas
    description: Ominous Seer is a Demon and a Naga, so the Tavern can offer Firescale Hoarder (Dragon/Naga).
    seeds: [1, 2]
    tavern: {catalog: tier5, tavern_tier: 6, board: [Ominous Seer], hand: [Lost Staff of Hamuul]}   # Tier 5 minions only
    steps:
      - play: {hand: Lost Staff of Hamuul, pos: 0}
    expect:
      shop: {count: 6, all: {any_of: [demon, naga]}, any: Firescale Hoarder}
