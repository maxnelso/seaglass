card: Menagerie Tableware
scenarios:
  - name: gives_3_3_plus_3_3_per_minion_type
    seed: 865
    tavern:
      board: [Flittering Bat, Flittering Bat, Glim Guardian]   # 1/4 Beasts and 1/4 Dragon
      hand: [Menagerie Tableware]
    steps:
      - play: {hand: Menagerie Tableware, pos: 0}
    expect:
      board: ["Flittering Bat 10/13", "Flittering Bat 10/13", "Glim Guardian 10/13"]   # 2 types: +9/+9

  - name: a_dual_type_minion_counts_as_the_type_nobody_else_has
    description: The Parrot counts as the Pirate and the Bat as the Beast, so 2 types.
    seeds: "1..20"
    tavern: {board: [Treasure Parrot, Flittering Bat], hand: [Menagerie Tableware]}   # 5/5, 1/4
    steps:
      - play: {hand: Menagerie Tableware, pos: 0}
    expect: {board: ["Treasure Parrot 14/14", "Flittering Bat 10/13"]}   # 2 types: +9/+9
