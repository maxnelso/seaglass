card: Faceless Operative
scenarios:
  - name: selling_it_gets_2_aberrations_and_playing_one_discards_the_other
    description: >-
      The Aberrations are drawn at random from the Tier 4 pool: the original setup and seed are
      kept so that the same cards are drawn and played.
    seed: 419
    tavern: {tavern_tier: 4, gold: 10, board: [Faceless Operative]}
    steps:
      - sell: Faceless Operative
      - expect: {hand: {count: 2, all: "aberration"}}
      - play: 0
    expect:
      hand: []
      auras: {cards_discarded: 1}

  - name: discarding_the_other_aberration_counts_for_parasitic_fleshling
    description: The hand is what selling a Faceless Operative that got Brain Rotter and Wandering Willbreaker leaves.
    tavern:
      board: [Parasitic Fleshling]   # 4/6: end of turn, +2/+2 to the left-most minion, improved by each discard
      hand:
        - {card: Brain Rotter, willbreaker_group: 1, willbreaker_remaining: 1}
        - {card: Wandering Willbreaker, willbreaker_group: 1, willbreaker_remaining: 1}
    steps:
      - play: Brain Rotter   # Wandering Willbreaker is discarded
      - end_turn
    expect:
      auras: {cards_discarded: 1}
      hand: []
      board: ["Parasitic Fleshling 7/9", Brain Rotter]   # 4/6 + (2 + 1)/(2 + 1)

  - name: the_played_minion_sees_the_other_being_discarded
    description: >-
      The hand is what selling a Faceless Operative that got Mindbender Ghur'sha and Cutthroat
      K'Thir leaves. The other card is discarded once Ghur'sha's play has resolved.
    tavern:
      board: [Brain Rotter]   # 3/4
      hand:
        - {card: Mindbender Ghur'sha, willbreaker_group: 1, willbreaker_remaining: 1}
        - {card: Cutthroat K'Thir, willbreaker_group: 1, willbreaker_remaining: 1}
    steps:
      - play: Mindbender Ghur'sha   # Cutthroat K'Thir is discarded: +4/+4 to Ghur'sha's other minions
    expect:
      auras: {cards_discarded: 1}
      hand: []
      board: ["Brain Rotter 7/8", "Mindbender Ghur'sha 3/9"]
