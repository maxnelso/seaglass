card: Enterprising Escapee
scenarios:
  - name: spending_6_gold_gets_a_lockbox
    seed: 515
    tavern: {gold: 6, board: [Enterprising Escapee]}
    steps:
      - repeat: 6   # 6 Refreshes: 6 Gold spent
        steps: [refresh]
    expect: {hand: [Lockbox]}

  - name: gold_spent_before_it_is_on_the_board_does_not_count
    description: The 3 Gold that bought it don't count; it takes 6 more once it is on the board.
    seed: 515
    tavern: {gold: 10, shop: [Enterprising Escapee]}
    steps:
      - buy: Enterprising Escapee   # 3 Gold
      - play: Enterprising Escapee
      - repeat: 5   # 5 Gold
        steps: [refresh]
      - expect: {gold: 2, hand: []}
      - refresh   # the 6th Gold since it was played
    expect: {gold: 1, hand: [Lockbox]}

  - name: a_lockbox_got_for_a_buy_with_nine_cards_is_lost
    description: >-
      The bought minion takes its hand slot before its Gold is spent (confirmed): with 9 cards it
      takes the 10th, and the Lockbox the Gold gives meets a full hand and is lost (it used to make
      a hand of 11).
    tavern:
      gold: 10
      board: [{card: Enterprising Escapee, counter: 3}]   # 3 more Gold spent: a Lockbox
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem,
             Blood Gem]   # 9 cards
      shop: [Lullabot]
    steps:
      - buy: 0
    expect:
      hand: {count: 10, any: Lullabot, none: Lockbox}

  - name: a_spell_bought_with_nine_cards_takes_the_last_slot
    description: A bought spell is in the hand before its Gold is spent too.
    tavern:
      gold: 10
      board: [{card: Enterprising Escapee, counter: 5}]   # 1 more Gold spent: a Lockbox
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem,
             Blood Gem]   # 9 cards
      shop: [Fortify]
    steps:
      - buy: 0
    expect:
      hand: {count: 10, any: Fortify, none: Lockbox}
