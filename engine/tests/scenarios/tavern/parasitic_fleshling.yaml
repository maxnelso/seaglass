card: Parasitic Fleshling
scenarios:
  - name: end_of_turn_buffs_the_left_most_minion_improved_by_discards
    tavern:
      board: [Parasitic Fleshling, Brain Rotter]   # Parasitic Fleshling: 4/6
      hand: [Blood Gem]
    steps:
      - activate: {pos: Brain Rotter, target: 0}   # 1 card discarded -> +(2 + 1)/+(2 + 1)
      - end_turn
    expect: {board: ["Parasitic Fleshling 7/9", Brain Rotter]}
