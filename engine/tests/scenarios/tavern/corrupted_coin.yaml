card: Corrupted Coin
scenarios:
  - name: gains_2_gold_or_2_max_gold_if_discarded
    tavern:
      gold: 3
      board: [Brain Rotter]
    steps:
      - add_to_hand: [Corrupted Coin, Corrupted Coin]
      - play: {hand: Corrupted Coin, pos: 0}
      - expect: {gold: 5}
      - activate: {pos: Brain Rotter, target: 0}
    expect: {max_gold: 2}
