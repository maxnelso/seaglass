card: Wandering Willbreaker
scenarios:
  - name: selling_it_gets_2_spells_and_casting_one_discards_the_other
    description: >-
      The spells are random: the setup and seed are the Rust test's, so that the same spells are
      drawn.
    seed: 234
    tavern:
      include_shop_spells: true
      tavern_tier: 2
      gold: 20
      board: [Wandering Willbreaker, Lullabot]
    steps:
      - sell: Wandering Willbreaker
      - expect: {hand: {count: 2, 0: {willbreaker_group: "> 0"}}}
      - play: {hand: 0, pos: 0}
      - if: {discover_pending: {not: null}}
        then: [{choose_discover: 0}]
    expect: {hand: {none: {willbreaker_group: "> 0"}}}

  - name: discarding_the_other_spell_triggers_discard_effects
    description: The hand is what selling a Wandering Willbreaker that got Armor Stash and Tavern Coin leaves.
    tavern:
      board: [Cutthroat K'Thir, "Harbinger Aph'lass"]   # +4/+4 to itself and the Deity; +2/+1 to the Deity
      hand:
        - {card: Armor Stash, willbreaker_group: 1, willbreaker_remaining: 1}
        - {card: Tavern Coin, willbreaker_group: 1, willbreaker_remaining: 1}
    steps:
      - play: {hand: Armor Stash, pos: 0}   # Tavern Coin is discarded
    expect:
      auras: {cards_discarded: 1, deity: {attack: 7, health: 6}}   # 1/1 + 4/4 + 2/1
      hand: []
      board: ["Cutthroat K'Thir 8/8", "Harbinger Aph'lass 3/6"]

  - name: the_other_spell_is_discarded_after_the_cast_resolves
    description: >-
      Channel the Devourer sells Lullabot and gives its 2/2 to Mindbender Ghur'sha before Tavern
      Coin is discarded, so Ghur'sha's +4/+4 has no other minion to buff.
    tavern:
      board: [Mindbender Ghur'sha, Lullabot]   # 3/9; 2/2
      hand:
        - {card: Channel the Devourer, willbreaker_group: 1, willbreaker_remaining: 1}
        - {card: Tavern Coin, willbreaker_group: 1, willbreaker_remaining: 1}
    steps:
      - play: {hand: Channel the Devourer, pos: 1}   # on Lullabot
    expect:
      auras: {cards_discarded: 1}
      hand: []
      board: ["Mindbender Ghur'sha 5/11"]   # 3/9 + 2/2

  - name: the_other_spell_takes_its_hand_slot_until_the_cast_resolves
    description: >-
      With 10 cards in hand, Cloning Conch's Murloc takes the slot the Conch left and its copy
      doesn't fit; only then is Tavern Coin discarded.
    tavern:
      hand:
        - {card: Cloning Conch, willbreaker_group: 1, willbreaker_remaining: 1}
        - {card: Tavern Coin, willbreaker_group: 1, willbreaker_remaining: 1}
        - Armor Stash
        - Armor Stash
        - Armor Stash
        - Armor Stash
        - Armor Stash
        - Armor Stash
        - Armor Stash
        - Armor Stash
    steps:
      - play: {hand: Cloning Conch, pos: 0}   # get a random Murloc and a copy of it
    expect:
      hand:
        all_of:
          - {count: 9}   # 8 Armor Stashes and the Murloc
          - {where: murloc, count: 1}
