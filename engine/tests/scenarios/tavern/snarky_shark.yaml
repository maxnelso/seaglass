card: Snarky Shark
scenarios:
  - name: selling_it_makes_the_left_most_beast_attack_a_fishbait
    description: >-
      Selling it refreshes the Tavern with a 0/1 Fishbait; Wolf Pup (3/6 Beast) attacks and
      kills it, and gains +5/+5.
    seed: 454
    tavern: {board: [Wolf Pup, Snarky Shark]}
    steps:
      - sell: Snarky Shark
    expect: {board: ["Wolf Pup 8/11"]}

  - name: the_beasts_attack_triggers_its_rally_and_cage_gnawer
    description: >-
      Wolf Pup attacks the Fishbait as in combat: before the damage, its Rally gives your other
      minions +4/+1 and Cage Gnawer gives your Beasts +2/+1.
    seed: 454
    tavern: {board: [Wolf Pup, Cage Gnawer, Snarky Shark]}   # 3/6 and 2/7 Beasts
    steps:
      - sell: Snarky Shark
    expect:
      board:
        - "Wolf Pup 10/12"   # +2/+1 (Gnawer) +5/+5 (Fishbait)
        - "Cage Gnawer 8/9"   # +4/+1 (Rally) +2/+1

  - name: at_tier_6_the_refresh_leaves_room_for_the_fishbait
    description: >-
      Bob's Tavern holds 7 cards: at Tier 6 the Refresh draws 5 minions instead of 6, so that the
      Fishbait joins its spell and minions (confirmed). Wolf Pup attacks and kills it.
    seed: 454
    tavern:
      tavern_tier: 6
      include_shop_spells: true
      board: [Wolf Pup, Snarky Shark]
    steps:
      - sell: Snarky Shark
    expect:
      board: ["Wolf Pup 8/11"]
      shop: {all_of: [{count: 6}, {where: {is_spell: true}, count: 1}]}   # 5 minions, the spell

  - name: at_tier_6_a_fishbait_no_beast_attacks_stays_in_a_full_tavern
    seed: 454
    tavern:
      tavern_tier: 6
      include_shop_spells: true
      board: [Snarky Shark]
    steps:
      - sell: Snarky Shark
    expect:
      shop: {all_of: [{count: 7}, {where: Fishbait, count: 1}, {where: {is_spell: true}, count: 1}]}
