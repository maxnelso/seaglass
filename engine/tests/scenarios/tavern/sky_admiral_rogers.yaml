card: Sky Admiral Rogers
scenarios:
  - name: spending_9_gold_gets_a_random_bounty
    seed: 621
    tavern: {gold: 10, board: [Sky Admiral Rogers]}
    steps:
      - repeat: 9
        steps: [refresh]   # 1 Gold each
    expect: {hand: [{is_spell: true}]}

  - name: free_refreshes_spend_no_gold
    description: >-
      Leaf Through the Pages costs 1 Gold but its 2 free Refreshes cost none: the Bounty comes with
      the 8th paid Refresh (1 + 8 = 9 Gold).
    seed: 621
    tavern: {gold: 9, board: [Sky Admiral Rogers], shop: [Leaf Through the Pages]}
    steps:
      - buy: Leaf Through the Pages   # 1 Gold
      - play: {hand: Leaf Through the Pages, pos: 0}
      - repeat: 2   # free
        steps: [refresh]
      - repeat: 7   # 1 + 7 = 8 Gold
        steps: [refresh]
      - expect: {gold: 1, hand: []}
      - refresh   # the 9th Gold
    expect: {gold: 0, hand: [{is_spell: true}]}   # a Bounty

  - name: a_bounty_got_for_a_buy_with_nine_cards_is_lost
    description: >-
      The bought minion takes the 10th slot before its Gold is spent (confirmed), so the Bounty the
      Gold gives meets a full hand and is lost.
    seed: 621
    tavern:
      gold: 10
      board: [{card: Sky Admiral Rogers, counter: 6}]   # 3 more Gold spent: a Bounty
      hand: [Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem, Blood Gem,
             Blood Gem]   # 9 cards
      shop: [Lullabot]
    steps:
      - buy: 0
    expect:
      hand: {count: 10, 9: Lullabot}
