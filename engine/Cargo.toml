[package]
name = "seaglass"
version = "0.1.0"
edition = "2021"
description = "Deterministic headless Hearthstone Battlegrounds engine (Tavern & Combat phases)"

[lib]
name = "seaglass"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
# Test tooling: `SEAGLASS_KNOCKOUT=<card id>` disables that card's hooks (`docs/scenarios.md`).
knockout = []

[dev-dependencies]
libtest-mimic = "0.8"

# The YAML scenario suite: one test per scenario (`tests/scenarios/`, `docs/scenarios.md`).
[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
harness = false
