<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seaglass player view</title>
<!--
  The seaglass player view (engine/docs/replays.md). `match_replay html --player P`
  (tools/src/bin/match_replay/html.rs) embeds a re-simulated replay as JSON in the replay-data
  element at the end of the page. The page follows ONE player through the game, one discrete thing
  at a time (an action, a combat, the end), and draws each action on a game-like shop screen with
  arrows and halos. It needs nothing else: no network, no libraries, no images.
-->
<style>
:root {
  --wood: #3b2a1c;
  --wood-2: #4d3724;
  --wood-3: #6a4b2e;
  --panel: #231a12;
  --panel-2: #2d2218;
  --line: #8a6a40;
  --text: #f5ead6;
  --muted: #b9a98d;
  --cyan: #37e0ff;
  --atk: #f0a020;
  --hp: #d8302f;
  --gold: #f2c53d;
  --spell: #7a3fc4;
  --new: #4ade80;
  --chg: #fbbf24;
  --good: #3fcf6e;
  --bad: #ff5a5a;
  --ice: #5fc8f0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text); background: #120c07;
}
button, select { font: inherit; color: inherit; }
small { color: var(--muted); font-weight: 400; }

/* Page chrome around the stage. */
header { padding: 5px 12px 4px; background: var(--panel); border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 15px; font-weight: 650; }
h1 .brand { color: var(--cyan); }
h1 #source { margin-left: 6px; color: var(--muted); font-weight: 500; }
select { padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
label.check { color: var(--muted); font-size: 13px; cursor: pointer; }
.result { padding: 1px 10px; border-radius: 999px; background: #1d3a44; color: var(--cyan); font-weight: 650; font-size: 13px; }
.result.unfinished { background: #4a3510; color: var(--chg); }
#turns { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.chip { min-width: 30px; height: 22px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); font-size: 12px; cursor: pointer; }
.chip:hover { border-color: var(--cyan); }
.chip.active { background: var(--cyan); border-color: var(--cyan); color: #08222a; font-weight: 700; }
.banner { margin-top: 4px; padding: 5px 10px; border: 1px solid var(--bad); border-radius: 8px; background: #3b1818; font-size: 13px; }
.banner.warn { border-color: var(--chg); background: #3a2c10; }
.banner a { color: var(--cyan); }
.banner ul { margin: 2px 0 0; padding-left: 20px; }
#wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
footer { display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); }
footer button {
  min-width: 110px; height: 38px; border: 2px solid var(--line); border-radius: 10px;
  background: var(--wood-2); font-size: 16px; font-weight: 650; cursor: pointer;
}
footer button:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
footer button:disabled { opacity: .35; cursor: default; }
#caption { flex: 1; min-width: 0; text-align: center; }
#cap-main { font-size: 17px; font-weight: 650; }
#cap-main .auto, #cap-sub .note { color: var(--muted); font-weight: 400; font-size: 13px; }
#cap-sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
#cap-sub b { color: var(--text); }
kbd { padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); font: 11px var(--mono); }

/* The stage: a fixed 1600x900 canvas that is scaled to fit the window. */
#stage {
  position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0;
  overflow: hidden; color: var(--text);
  background:
    radial-gradient(ellipse at 52% 42%, rgba(255, 220, 160, .10), transparent 62%),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .06) 0 3px, transparent 3px 46px),
    linear-gradient(#5a4129, #3d2b1a 55%, #2a1d12);
}
#stage > * { position: absolute; }
.floor { left: 220px; top: 640px; width: 1270px; height: 260px; background: linear-gradient(#2a3144, #1c2130); border-top: 4px solid #6a4b2e; }
.rowlabel { left: 220px; width: 1270px; text-align: center; font-size: 15px; color: var(--muted); }
.rowlabel b { color: var(--text); }
.row { left: 220px; width: 1270px; height: 200px; display: flex; justify-content: center; align-items: center; gap: 12px; }
#shop { top: 148px; }
#board { top: 388px; }
#shop.frozen { background: linear-gradient(rgba(95, 200, 240, .20), rgba(95, 200, 240, .05)); border-radius: 14px; box-shadow: inset 0 0 0 2px rgba(95, 200, 240, .5); }
.empty-note { color: var(--muted); font-size: 16px; font-style: italic; }

/* Keyword legend, under the leaderboard. */
.legend { position: absolute; left: 8px; right: 8px; bottom: 10px; padding: 7px 8px; border: 2px solid #5b4630; border-radius: 9px; background: var(--panel); font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.legend b { color: var(--text); font-weight: 600; }
.legend .sw { display: inline-block; width: 16px; height: 11px; margin-right: 5px; vertical-align: -1px; border-radius: 3px; background: #4b3924; }

/* The hover text: instant, and wide enough for a card's rules text. */
#tip { position: fixed; z-index: 1000; max-width: 340px; padding: 8px 10px; border: 1px solid #d9c8a4; border-radius: 8px; background: rgba(20, 14, 8, .96); color: #f3ead8; font-size: 13px; line-height: 1.35; white-space: pre-line; pointer-events: none; box-shadow: 0 6px 18px rgba(0, 0, 0, .6); }
#tip b { color: #fff; }

/* Leaderboard. */
#board-left { left: 0; top: 0; width: 220px; height: 900px; padding: 10px 8px; background: linear-gradient(#2a1d12, #1c130c); border-right: 4px solid #6a4b2e; }
.turnbox { padding: 4px 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 10px; }
.lb { position: relative; display: flex; align-items: center; gap: 7px; margin-bottom: 6px; padding: 5px 6px 5px 5px; border: 2px solid #5b4630; border-radius: 9px; background: var(--panel); cursor: pointer; }
.lb:hover { border-color: var(--muted); }
.lb.sel { border-color: var(--cyan); box-shadow: 0 0 10px rgba(55, 224, 255, .5); background: #1c2e33; }
.lb.dead { opacity: .62; }
.lb .sq { width: 26px; height: 26px; border-radius: 7px; background: var(--pc); border: 2px solid rgba(255, 255, 255, .5); flex: none; display: grid; place-items: center; font-size: 18px; }
.lb .who { flex: 1; min-width: 0; line-height: 1.2; }
.lb .who b { display: block; font-size: 13px; line-height: 1.15; overflow-wrap: anywhere; }
.lb .line2 { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.lb .line2 small { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
.lb .hpv { font-size: 15px; font-weight: 700; color: #ff8a80; white-space: nowrap; }
.lb .hpv i { font-style: normal; font-size: 11px; color: #c9d1dc; }
.lb .tb { width: 22px; height: 24px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: #7a3fc4; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); flex: none; }
.lb .vs { flex: none; padding: 0 6px; border-radius: 8px; background: #b32020; color: #fff; font-size: 11px; font-weight: 700; line-height: 17px; box-shadow: 0 0 6px rgba(255, 60, 60, .7); }

/* Top center: Tier, Bob, Reroll, Freeze. */
.bob, .round, .tier { position: absolute; }
.tier { left: 598px; top: 18px; width: 80px; height: 96px; }
.tier .hex { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; background: #7a3fc4; color: #fff; clip-path: polygon(50% 0, 100% 18%, 100% 82%, 50% 100%, 0 82%, 0 18%); border: 0; }
.tier .hex b { font-size: 34px; line-height: 1; }
.tier .hex span { font-size: 12px; color: var(--gold); letter-spacing: -1px; }
.tier .rim { position: absolute; inset: -3px; background: var(--gold); clip-path: polygon(50% 0, 100% 18%, 100% 82%, 50% 100%, 0 82%, 0 18%); }
.bubble { position: absolute; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(#ffe08a, #d8a020); color: #3a2600; border: 2px solid #7a5200; font-size: 18px; font-weight: 800; line-height: 1; }
.bubble.sm { width: 26px; height: 26px; font-size: 14px; }
.bubble small { font-size: 10px; color: #3a2600; font-weight: 700; }
.tier .bubble { right: -18px; top: -8px; }
.bob { left: 698px; top: 20px; width: 200px; height: 92px; display: grid; place-content: center; text-align: center; border: 3px solid var(--line); border-radius: 46px 46px 14px 14px; background: linear-gradient(#5a4129, #2d2015); }
.bob b { font-size: 24px; }
.bob span { color: var(--muted); font-size: 15px; }
.round { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; border: 4px solid #3fcf6e; background: radial-gradient(#9a4fe0, #5a2a9a); font-size: 42px; line-height: 1; }
.round .bubble { top: -12px; left: 25px; }
.round .lbl { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
#reroll { left: 928px; top: 24px; }
#freeze { left: 1028px; top: 24px; }
#freeze.on { background: radial-gradient(#d8f4ff, #4aa8d8); border-color: #bfeaff; }
.dim { opacity: .35; filter: grayscale(.6); }

/* Cards: simple rounded rectangles. */
.card {
  position: relative; flex: none; width: 150px; height: 196px; padding: 7px 8px; border: 3px solid #d9c8a4; border-radius: 14px;
  background: linear-gradient(#6b5236, #4b3924); box-shadow: 0 3px 8px rgba(0, 0, 0, .5); overflow: visible;
}
.card .top { display: flex; justify-content: space-between; color: #c9a2ff; font-size: 11px; letter-spacing: 0; height: 15px; text-shadow: 0 0 2px #1a0a33, 0 1px 1px #000; }
.card .name { margin-top: 3px; font-size: 16px; font-weight: 700; line-height: 1.1; max-height: 36px; overflow: hidden; }
.card .tribe { margin-top: 2px; font-size: 11px; color: #d8c7a6; }
.card .glyphs { margin-top: 3px; font-size: 17px; font-weight: 700; color: #e8f4ff; text-shadow: 0 0 3px #000; letter-spacing: 3px; }
.card .notes { margin-top: 2px; font-size: 11px; color: #f0e3c2; line-height: 1.15; max-height: 26px; overflow: hidden; }
.card .atk, .card .hp, .card .cost { position: absolute; bottom: -8px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; font-weight: 800; color: #fff; border: 3px solid #fff; text-shadow: 0 1px 2px #000; }
.card .atk { left: -8px; background: var(--atk); }
.card .hp { right: -8px; background: var(--hp); }
.card .cost { left: 50%; margin-left: -23px; width: 46px; background: var(--spell); border-color: #e2c8ff; font-size: 17px; }
.card.golden { border-color: var(--gold); background: linear-gradient(#8a6a22, #5a4414); box-shadow: 0 0 0 2px #5a4000, 0 3px 8px rgba(0, 0, 0, .5); }
.card.spell { background: linear-gradient(#5a2e8a, #381a5c); border-color: #c8a2f5; border-radius: 40px 40px 14px 14px; }
.card.deity { border-style: double; }
.card.taunt { border: 7px solid #8d98a6; padding: 4px 5px; }
.card.divine { box-shadow: 0 0 0 4px rgba(255, 215, 80, .85), 0 0 16px 5px rgba(255, 200, 40, .75), 0 3px 8px rgba(0, 0, 0, .5); }
.card.stealth { border-style: dashed; opacity: .88; }
.card.new { outline: 3px solid var(--new); outline-offset: 3px; }
.card.changed { outline: 3px solid var(--chg); outline-offset: 3px; }
.card.small { width: 96px; height: 128px; padding: 5px 5px; border-width: 2px; border-radius: 10px; }
.card.small .top { font-size: 9px; height: 11px; }
.card.small .name { font-size: 12px; max-height: 28px; }
.card.small .tribe, .card.small .notes { display: none; }
.card.small .glyphs { font-size: 12px; letter-spacing: 1px; }
.card .lg { font-size: 15px; }
.card .xl { font-size: 12px; letter-spacing: -1px; }
.card.small .atk, .card.small .hp { width: 28px; height: 28px; font-size: 15px; border-width: 2px; bottom: -6px; }
.card.small .atk { left: -6px; }
.card.small .hp { right: -6px; }
.card.small .cost { width: 36px; height: 28px; margin-left: -18px; font-size: 13px; border-radius: 14px; bottom: -6px; }
.card.small.taunt { border-width: 5px; }
.card.big { width: 170px; height: 222px; }
.slot { position: relative; flex: none; width: 26px; height: 196px; border: 3px dashed var(--cyan); border-radius: 10px; background: rgba(55, 224, 255, .12); }
.slot.ghost { width: 96px; height: 128px; }
.mark { font-size: 12px; font-weight: 700; }

/* Halo: a pulsing ring around the element an action uses. */
.halo::after {
  content: ""; position: absolute; inset: -10px; border: 5px solid var(--cyan); border-radius: 18px; pointer-events: none; z-index: 20;
  box-shadow: 0 0 18px 6px rgba(55, 224, 255, .85), inset 0 0 14px 2px rgba(55, 224, 255, .6);
  animation: pulse 1.1s ease-in-out infinite;
}
.round.halo::after, .coin.halo::after, .power.halo::after { border-radius: 50%; inset: -9px; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .halo::after { animation: none; } }

/* Bottom: hero, hero power, trinkets, hand, gold. */
.hero { left: 775px; top: 684px; width: 160px; height: 196px; border: 4px solid #d9c8a4; border-radius: 80px 80px 18px 18px; background: linear-gradient(#5a6e92, #2d3752); text-align: center; }
.hero .hn { position: absolute; left: 4px; right: 4px; bottom: 10px; font-size: 15px; font-weight: 700; line-height: 1.15; text-shadow: 0 1px 3px #000; }
.hero .pn { position: absolute; left: 0; right: 0; top: 30px; font-size: 50px; color: rgba(255, 255, 255, .4); font-weight: 800; }
.hero .hpb { position: absolute; right: -16px; bottom: -6px; width: 56px; height: 64px; display: grid; place-items: center; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(#ff6a5a, #b31a1a); border: 3px solid #fff; font-size: 28px; font-weight: 800; text-shadow: 0 1px 3px #000; }
.hero .arb { position: absolute; left: -16px; bottom: -4px; width: 50px; height: 56px; display: grid; place-items: center; background: #9aa3ae; color: #111; border: 3px solid #fff; font-size: 24px; font-weight: 800; clip-path: none; border-radius: 8px 8px 50% 50%; }
.hero.chg .hpb { box-shadow: 0 0 0 4px var(--chg); }
.power { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; text-align: center; border: 4px solid #d9c8a4; background: radial-gradient(#c09a5a, #6a4b2e); font-size: 12px; font-weight: 700; line-height: 1.1; padding: 8px; }
.power.used { filter: grayscale(1) brightness(.6); }
.power .bubble { right: -10px; top: -10px; }
#power0 { left: 660px; top: 770px; }
#power1 { left: 568px; top: 770px; }
.trinket { width: 74px; height: 58px; padding: 3px; border-radius: 14px; display: grid; place-items: center; overflow: hidden; border: 3px solid #d9c8a4; background: radial-gradient(#6a8cc0, #2d3f66); font-size: 10.5px; font-weight: 700; text-align: center; line-height: 1.1; overflow-wrap: anywhere; }
#trinkets { left: 400px; top: 776px; width: 160px; height: 70px; display: flex; flex-direction: row-reverse; gap: 6px; align-items: center; }
#darkdisc { left: 330px; top: 700px; padding: 8px 12px; border: 3px solid #b15cff; border-radius: 12px; background: #2a0f45; font-weight: 700; }
#darkdisc .left { margin-left: 8px; padding: 0 7px; border-radius: 8px; background: #b15cff; color: #1a0630; font-size: 13px; }
#darkdisc.spent { opacity: .5; }
#hand { left: 960px; top: 706px; width: 440px; height: 150px; }
#hand .card, #hand .slot { position: absolute; top: 8px; }
#handlabel { left: 960px; top: 862px; width: 440px; font-size: 12px; color: var(--muted); text-align: center; }
.coin { left: 1396px; top: 770px; width: 90px; height: 90px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: radial-gradient(#ffe48a, #c98f10); border: 5px solid #8a5d00; color: #3a2600; font-size: 28px; font-weight: 800; line-height: 1; text-align: center; }
.coin small { color: #3a2600; font-size: 11px; font-weight: 700; }
.coin.chg { box-shadow: 0 0 0 4px var(--chg); }
.coinnote { left: 1386px; top: 864px; width: 110px; text-align: center; font-size: 12px; color: var(--gold); }

/* Right edge: End Turn. */
.rightbar { left: 1496px; top: 0; width: 104px; height: 900px; background: linear-gradient(#2a1d12, #1c130c); border-left: 4px solid #6a4b2e; }
#endturn { left: 1506px; top: 300px; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; text-align: center; background: radial-gradient(#e88a4a, #9a3a14); border: 5px solid #f0c070; font-size: 15px; font-weight: 800; line-height: 1.1; }
#turnind { left: 1506px; top: 410px; width: 84px; padding: 6px 0; text-align: center; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 13px; color: var(--muted); }
#turnind b { display: block; font-size: 22px; color: var(--text); }

/* Overlay (discover and hero / trinket choices) and combat banners. */
#overlay { left: 220px; top: 0; width: 1270px; height: 900px; background: rgba(8, 5, 2, .9); z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px; }
#overlay h2 { margin: 0; font-size: 34px; }
#overlay .opts { display: flex; gap: 26px; align-items: center; }
.heroopt, .trinopt { position: relative; width: 190px; height: 240px; padding: 14px; border: 4px solid #d9c8a4; border-radius: 95px 95px 18px 18px; background: linear-gradient(#5a6e92, #2d3752); text-align: center; display: flex; flex-direction: column; justify-content: flex-end; }
.heroopt b, .trinopt b { font-size: 20px; line-height: 1.15; }
.heroopt, .trinopt { width: 230px; height: 290px; }
.heroopt .txt, .trinopt .txt { margin-top: 8px; font-size: 13px; line-height: 1.25; color: #e4e9f2; font-weight: 400; }
.heroopt .txt i { display: block; font-style: normal; font-weight: 700; color: var(--gold); }
.trinopt { border-radius: 24px; background: linear-gradient(#6a8cc0, #2d3f66); justify-content: center; align-items: center; gap: 8px; }
.trinopt .bubble { position: static; }
.banner-big { left: 340px; top: 18px; width: 1030px; height: 110px; display: grid; place-content: center; text-align: center; border: 5px solid #fff; border-radius: 22px; z-index: 5; box-shadow: 0 6px 24px rgba(0, 0, 0, .6); }
.banner-big b { font-size: 46px; line-height: 1.1; letter-spacing: 1px; }
.banner-big span { font-size: 20px; }
.banner-big.won { background: #1c6b3a; border-color: #6ff29c; }
.banner-big.lost { background: #8a1f1f; border-color: #ff9a9a; }
.banner-big.tie { background: #4a525e; border-color: #cfd6df; }
.banner-big.over { background: #3a2b6b; border-color: #c8b8ff; }
#arrows { left: 0; top: 0; width: 1600px; height: 900px; pointer-events: none; z-index: 60; overflow: visible; }
#arrows text { font: 700 22px system-ui, sans-serif; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1><span class="brand">seaglass</span> player view <span id="source"></span></h1>
    <label>Following <select id="player" aria-label="Player"></select></label>
    <span class="result" id="result"></span>
    <label class="check"><input type="checkbox" id="results"> Show results</label>
    <span class="keys" style="color:var(--muted);font-size:12px"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>↑</kbd> <kbd>↓</kbd> turn · <kbd>Home</kbd> <kbd>End</kbd></span>
  </div>
  <div id="turns"></div>
  <div class="banner" id="banner" hidden></div>
</header>
<div id="wrap">
  <div id="stage"></div>
</div>
<div id="tip" hidden></div>
<footer>
  <button id="btn-prev" type="button">◀ Prev</button>
  <div id="caption"><div id="cap-main"></div><div id="cap-sub"></div></div>
  <button id="btn-next" type="button">Next ▶</button>
</footer>
<script type="application/json" id="replay-data">__REPLAY_DATA__</script>
<script>
"use strict";
(() => {
  // The replay: see `ViewerData` in tools/src/bin/match_replay/html.rs.
  const DATA = JSON.parse(document.getElementById("replay-data").textContent);
  const FRAMES = DATA.frames;
  const UNITS = DATA.units;
  // Rules text: cards by card id; trinkets, Hero Powers and heroes by `kind:name`.
  const CARD_TEXT = DATA.card_text || {};
  const TEXTS = DATA.texts || {};
  const PLAYERS = DATA.setup.players;
  const LAST = FRAMES.length - 1;
  const COLORS = ["#2563eb", "#dc2626", "#16a34a", "#d97706", "#7c3aed", "#0891b2", "#db2777", "#4b5563"];
  const GLYPHS = { Reborn: "↺", Windfury: "≋", Venomous: "☣", Magnetic: "∪", Stealth: "◌" };
  const STAGE_W = 1600;
  const STAGE_H = 900;

  // Every player's state at every frame. A frame only holds the states its call changed, so
  // unchanged states are carried forward (as the same objects).
  const STATES = [];
  FRAMES.forEach((frame, i) => {
    STATES.push(frame.states.map((s, p) => s || STATES[i - 1][p]));
  });

  const $ = (id) => document.getElementById(id);
  const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ESCAPES[c]);
  const color = (p) => COLORS[p % COLORS.length];
  const name = (p) => (PLAYERS[p] ? PLAYERS[p].name : "P" + (p + 1));
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const hp = (s) => `${s.health}${s.armor ? "+" + s.armor : ""}`;
  const ordinal = (n) => n + (["th", "st", "nd", "rd"][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10 < 4 ? n % 10 : 0]);
  const stars = (n) => "★".repeat(Math.max(0, Math.min(7, n)));

  // ---- Who is out, who placed where, who fights whom -----------------------------------------

  /** The first frame at which each player is knocked out (Health 0 or less), or null. */
  const KNOCKED_OUT = PLAYERS.map((_, p) => {
    const i = STATES.findIndex((states) => states[p].health <= 0);
    return i < 0 ? null : i;
  });

  /** Final placements parsed from the result ("game over: p7 wins (1. p7, 2. p2, ...)"). */
  const PLACES = new Map();
  if (DATA.result) {
    for (const m of DATA.result.matchAll(/(\d+)\. (.+?)(?=, \d+\. |\)$)/g)) PLACES.set(m[2].trim(), Number(m[1]));
  }
  const placeOf = (p) => PLACES.get(name(p)) || null;

  /** The frames that set the coming turn's pairings (`[unit, unit]` pairs). */
  const PAIR_FRAMES = [];
  FRAMES.forEach((f, i) => { if (f.pairs && f.pairs.length) PAIR_FRAMES.push(i); });

  /** The unit `p` is paired with at frame `ref` (the latest pairings at or before it), or null. */
  function opponentAt(p, ref) {
    for (let k = PAIR_FRAMES.length - 1; k >= 0; k--) {
      if (PAIR_FRAMES[k] > ref) continue;
      const pair = FRAMES[PAIR_FRAMES[k]].pairs.find(([a, b]) => a === p || b === p);
      return pair ? (pair[0] === p ? pair[1] : pair[0]) : null;
    }
    return null;
  }

  // ---- Steps -----------------------------------------------------------------------------------

  let showResults = false;
  try { showResults = localStorage.getItem("seaglass.player.results") === "1"; } catch (e) { /* no storage */ }

  /**
   * What Next / Prev walk through for player `p`: each of their actions (drawn on the state it was
   * taken in), each combat, and the end of the game for them. Each step has the `frame` it comes
   * from, its `turn`, its `type` (act, result, combat, ghost or over), and `ref`, the frame whose
   * states the leaderboard shows.
   */
  function buildSteps(p) {
    const steps = [];
    for (let i = 0; i <= LAST; i++) {
      const f = FRAMES[i];
      if (f.kind === "end") {
        steps.push({ type: "over", frame: i, turn: f.turn, ref: i });
        break;
      }
      if (f.kind === "act" && f.actors[0] === p) {
        steps.push({ type: "act", frame: i, turn: f.turn, ref: i - 1 });
        if (showResults) steps.push({ type: "result", frame: i, turn: f.turn, ref: i });
      } else if (f.kind === "combat" && f.actors.includes(p)) {
        steps.push({ type: "combat", frame: i, turn: f.turn, ref: i });
      } else if (f.ghost && f.ghost.unit === p) {
        steps.push({ type: "ghost", frame: i, turn: f.turn, ref: i });
      }
      if (i > 0 && STATES[i][p].health <= 0) {
        steps.push({ type: "over", frame: i, turn: f.turn, ref: i, out: true });
        break;
      }
    }
    steps.forEach((st, k) => {
      st.n = k;
      const prev = steps[k - 1];
      // The state the step draws, and the state its glow is relative to (the result of the
      // previous action, in the same turn).
      if (st.type === "act") {
        st.state = STATES[st.frame - 1][p];
        st.base = prev && prev.type === "act" && prev.turn === st.turn ? prev.state : null;
      } else if (st.type === "result") {
        st.state = STATES[st.frame][p];
        st.base = STATES[st.frame - 1][p];
      } else {
        st.state = STATES[st.frame][p];
        st.base = null;
      }
    });
    return steps;
  }

  let player = 0;
  let STEPS = [];
  let cur = 0;

  /** The index of the first step in turn `t` or later (the last step if there is none). */
  function stepOfTurn(t) {
    const k = STEPS.findIndex((st) => st.turn >= t);
    return k < 0 ? STEPS.length - 1 : k;
  }
  /** The first step of `i`'s turn. */
  function turnFirst(i) {
    const t = STEPS[i].turn;
    return STEPS.findIndex((st) => st.turn === t);
  }
  function nextTurnStep(i) {
    const t = STEPS[i].turn;
    const k = STEPS.findIndex((st) => st.turn > t);
    return k < 0 ? STEPS.length - 1 : k;
  }
  function prevTurnStep(i) {
    const first = turnFirst(i);
    return first < i ? first : turnFirst(Math.max(0, first - 1));
  }

  // ---- Units -------------------------------------------------------------------------------------

  /** A unit worded like `match_replay log` words it. */
  function unitText(u) {
    if (u.spell) {
      const notes = u.notes ? ` (${u.notes.join(", ")})` : "";
      return `(Spell) "${u.name}" (T${u.tier} ${u.spell})${notes}`;
    }
    const keywords = u.keywords ? ` [${u.keywords.join(", ")}]` : "";
    const notes = [];
    if (u.activate !== undefined) notes.push(u.activated ? "Act:USED" : `Act:${u.activate}g`);
    if (u.notes) notes.push(...u.notes);
    const extra = notes.length ? ` {${notes.join(", ")}}` : "";
    return `"${u.name}" ${u.attack}/${u.health} (T${u.tier} ${u.tribe || "Neutral"}, id=${u.card})${keywords}${extra}`;
  }

  /**
   * How a zone (a list of unit ids) changed. Units that stayed are matched first; a new unit
   * with the card of one that left is a changed version of it. Returns per position of `after`
   * the `marks` ("new" / "changed") and the earlier versions (`was`).
   */
  function diffZone(before, after) {
    const left = new Map();
    for (const id of before) left.set(id, (left.get(id) || 0) + 1);
    const fresh = after.map((id) => {
      const n = left.get(id) || 0;
      if (n > 0) left.set(id, n - 1);
      return n === 0;
    });
    const gone = [];
    left.forEach((n, id) => { for (let k = 0; k < n; k++) gone.push(id); });
    const marks = [];
    const was = [];
    after.forEach((id, k) => {
      if (!fresh[k]) return;
      const j = gone.findIndex((g) => UNITS[g].card === UNITS[id].card);
      if (j < 0) {
        marks[k] = "new";
      } else {
        marks[k] = "changed";
        was[k] = gone[j];
        gone.splice(j, 1);
      }
    });
    return { marks, was };
  }

  /** A class that shrinks the digits of a big stat. */
  const stat = (n) => (String(n).length >= 4 ? " xl" : String(n).length === 3 ? " lg" : "");

  /**
   * A unit card. `o.z` / `o.i` name its zone and index (the anchors of the arrows), `o.small`
   * makes it a hand card, `o.mark` / `o.was` say how it changed since the last step.
   */
  function cardHtml(id, o = {}) {
    const u = UNITS[id];
    const kw = u.keywords || [];
    const classes = ["card"];
    if (o.small) classes.push("small");
    if (o.big) classes.push("big");
    if (u.golden) classes.push("golden");
    if (u.spell) classes.push("spell");
    if (u.deity) classes.push("deity");
    if (kw.includes("Taunt")) classes.push("taunt");
    if (kw.includes("Divine Shield")) classes.push("divine");
    if (kw.includes("Stealth")) classes.push("stealth");
    if (o.mark) classes.push(o.mark);
    const tip = [unitText(u)];
    if (CARD_TEXT[u.card]) tip.push(CARD_TEXT[u.card]);
    if (o.was !== undefined) tip.push("was " + unitText(UNITS[o.was]));
    if (o.mark) tip.push(o.mark === "new" ? "new since the last step" : "changed since the last step");
    const notes = [];
    if (u.activate !== undefined) notes.push(u.activated ? "Act: used" : `Act: ${u.activate}g`);
    if (u.notes) notes.push(...u.notes);
    const kind = u.spell ? "Spell" : u.deity ? "Deity" : u.tribe;
    const glyphs = kw.map((k) => GLYPHS[k]).filter(Boolean).join("");
    const foot = u.spell
      ? `<span class="cost">${esc(u.spell)}</span>`
      : `<span class="atk${stat(u.attack)}">${u.attack}</span><span class="hp${stat(u.health)}">${u.health}</span>`;
    const anchor = o.z ? ` data-z="${o.z}" data-i="${o.i}"` : "";
    return `<div class="${classes.join(" ")}"${anchor} title="${esc(tip.join("\n"))}">` +
      `<div class="top"><span>${stars(u.tier)}</span></div>` +
      `<div class="name">${esc(u.name)}</div>` +
      (kind ? `<div class="tribe">${esc(kind)}</div>` : "") +
      (glyphs ? `<div class="glyphs">${glyphs}</div>` : "") +
      (notes.length ? `<div class="notes">${notes.map(esc).join(" · ")}</div>` : "") +
      foot + `</div>`;
  }

  /** The cards of one zone as HTML; `gap` is `[index, html]`, a marker inserted before that index. */
  function zoneCards(z, ids, base, opts = {}) {
    const d = base ? diffZone(base, ids) : { marks: [], was: [] };
    const out = ids.map((id, i) => cardHtml(id, { z, i, mark: d.marks[i], was: d.was[i], small: opts.small }));
    if (opts.gap) out.splice(opts.gap[0], 0, opts.gap[1]);
    return out;
  }

  // ---- Stage pieces --------------------------------------------------------------------------------

  /** What the card borders and marks mean. */
  const LEGEND = `<div class="legend">` +
    `<div><span class="sw" style="border:3px solid #8d98a6"></span><b>Silver border</b>: Taunt</div>` +
    `<div><span class="sw" style="box-shadow:0 0 0 2px rgba(255,215,80,.85),0 0 6px 2px rgba(255,200,40,.75)"></span><b>Gold glow</b>: Divine Shield</div>` +
    `<div><span class="sw" style="border:2px dashed #d9c8a4"></span><b>Dashed</b>: Stealth</div>` +
    `<div><span class="sw" style="background:linear-gradient(#8a6a22,#5a4414);border:2px solid #e0b44f"></span><b>Gold card</b>: Golden</div>` +
    `<div>${["Windfury", "Venomous", "Reborn", "Magnetic"].map((k) => `<span style="white-space:nowrap"><b>${GLYPHS[k]}</b> ${k}</span>`).join(" · ")}</div>` +
    `<div style="margin-top:3px">Green / orange outline: new / changed by the last action. Hover anything for its text.</div></div>`;

  /** A name, escaped, that may wrap after `_`, `)` or `]` (bot names like `Search(sovereign)_p0`). */
  function breakable(text) {
    return esc(text).replace(/([_)\]])/g, "$1<wbr>");
  }

  function leaderboardHtml(st) {
    const states = STATES[st.ref];
    const order = PLAYERS.map((_, q) => q);
    const dead = (q) => states[q].health <= 0;
    order.sort((a, b) => {
      if (dead(a) !== dead(b)) return dead(a) ? 1 : -1;
      if (dead(a)) return (KNOCKED_OUT[b] || 0) - (KNOCKED_OUT[a] || 0) || a - b;
      return (states[b].health + states[b].armor) - (states[a].health + states[a].armor) || a - b;
    });
    const foe = opponentAt(player, st.ref);
    const rows = order.map((q) => {
      const s = states[q];
      const hero = s.hero ? s.hero.name : "";
      const place = dead(q) && placeOf(q) ? ` · ${ordinal(placeOf(q))}` : "";
      return `<div class="lb${q === player ? " sel" : ""}${dead(q) ? " dead" : ""}" data-p="${q}" style="--pc:${color(q)}" ` +
        `title="${esc(name(q))}${hero ? " · " + esc(hero) : ""} · Health ${hp(s)} · Tier ${s.tier}">` +
        `<span class="sq">${dead(q) ? "☠" : ""}</span>` +
        `<span class="who"><b>${breakable(name(q))}</b><span class="line2">` +
        `<span class="hpv">${dead(q) ? "☠" : s.health + (s.armor ? `<i>+${s.armor}</i>` : "")}</span>` +
        `<span class="tb">${s.tier}</span><small>${esc(hero || "")}${place}</small>` +
        (q === foe && q !== player ? `<span class="vs" title="next opponent">⚔ next</span>` : "") + `</span></span></div>`;
    });
    return `<div class="turnbox">Turn ${FRAMES[st.frame].turn}</div>${rows.join("")}${LEGEND}`;
  }

  /** Tier badge, Bob, Reroll and Freeze. */
  function topbarHtml(s, off) {
    const free = s.free_refreshes > 0;
    const cost = free ? 0 : s.refresh_cost === undefined ? "?" : s.refresh_cost;
    const upg = s.upgrade === null || s.upgrade === undefined ? "" : `<span class="bubble" title="Tavern upgrade cost">${s.upgrade}</span>`;
    return `<div class="${off ? "dim" : ""}">` +
      `<div class="tier" data-z="tier" style="position:absolute" title="Tavern Tier ${s.tier}, upgrade ${s.upgrade === null ? "maxed" : s.upgrade + "g"}">` +
      `<div class="rim"></div><div class="hex"><b>${s.tier}</b><span>${stars(s.tier)}</span></div>${upg}</div>` +
      `<div class="bob" data-z="bob"><b>Bob</b><span>Turn ${s.turn}</span></div>` +
      `<div class="round" id="reroll" data-z="reroll" title="Refresh the shop${free ? " (free)" : ""}">↻<span class="bubble">${cost}</span>${free ? `<span class="lbl">free</span>` : ""}</div>` +
      `<div class="round${s.frozen ? " on" : ""}" id="freeze" data-z="freeze" title="${s.frozen ? "Shop is frozen" : "Freeze the shop"}">❄<span class="bubble">0</span></div></div>`;
  }

  function heroHtml(s, st) {
    const h = s.hero;
    const powers = h ? h.powers : [];
    const parts = [];
    powers.slice(0, 2).forEach((pw, k) => {
      const tip = [`${pw.name} (${pw.cost} Gold)${pw.used ? ", used this turn" : ""}`, TEXTS["power:" + pw.name]].filter(Boolean).join("\n");
      parts.push(`<div class="power${pw.used ? " used" : ""}" id="power${k}" data-z="power${k}" title="${esc(tip)}">` +
        `${esc(pw.name)}<span class="bubble sm">${pw.cost}</span></div>`);
    });
    const trinkets = (s.trinkets || []).map((t) =>
      `<div class="trinket" title="${esc([t, TEXTS["trinket:" + t]].filter(Boolean).join("\n"))}">${esc(t)}</div>`).join("");
    const dd = s.dark_discovery;
    const dark = dd ? `<div id="darkdisc" data-z="darkdisc" class="${dd[0] ? "" : "spent"}" title="Dark Discovery: ${dd[0]} of ${dd[1]} uses left this game">` +
      `Dark Discovery<span class="left">${dd[0]}/${dd[1]}</span></div>` : "";
    const base = st.base;
    const chg = base && (base.health !== s.health || base.armor !== s.armor) ? " chg" : "";
    const label = h ? h.name : name(player);
    return parts.join("") + `<div id="trinkets">${trinkets}</div>` + dark +
      `<div class="hero${chg}" data-z="hero" style="--pc:${color(player)}" title="${esc([`${label} · Health ${hp(s)}`, h && TEXTS["hero:" + h.name]].filter(Boolean).join("\n"))}">` +
      `<div class="pn">${h ? "" : esc(name(player))}</div><div class="hn">${esc(label)}</div>` +
      `<div class="hpb" title="Health">${s.health}</div>` +
      (s.armor ? `<div class="arb" title="Armor">${s.armor}</div>` : "") + `</div>`;
  }

  function handHtml(s, st, ghost) {
    const ids = s.hand;
    const n = ids.length + (ghost ? 1 : 0);
    const w = 96;
    const step = n > 1 ? Math.min(w + 8, (440 - w) / (n - 1)) : 0;
    const base = st.base;
    const d = base ? diffZone(base.hand, ids) : { marks: [], was: [] };
    const cards = ids.map((id, i) => {
      const html = cardHtml(id, { z: "hand", i, mark: d.marks[i], was: d.was[i], small: true });
      return html.replace('<div class="card', `<div style="left:${(i * step).toFixed(1)}px;z-index:${i}" class="card`);
    });
    if (ghost) cards.push(`<div class="slot ghost" data-z="ghost" style="left:${((n - 1) * step).toFixed(1)}px"></div>`);
    return `<div id="hand">${cards.join("")}</div><div id="handlabel">Hand ${ids.length}/10</div>`;
  }

  function goldHtml(s, st) {
    const base = st.base;
    const chg = base && (base.gold !== s.gold || base.max_gold !== s.max_gold) ? " chg" : "";
    const bonus = s.bonus_gold ? `<div class="coinnote">+${s.bonus_gold} gold next turn</div>` : "";
    return `<div class="coin${chg}" data-z="gold" title="Gold">${s.gold}<small>/ ${s.max_gold}</small></div>${bonus}`;
  }

  /** The Discover / hero / trinket choice, if the state has one pending. */
  function overlayHtml(s, a) {
    const chosen = a && ["discover", "choose_hero", "choose_trinket"].includes(a.type) ? a.option : -1;
    const opt = (html, i) => html.replace(/^<div /, `<div data-z="opt" data-i="${i}" `);
    let title = "";
    let opts = [];
    if (s.discover) {
      title = "Discover";
      opts = s.discover.map((id, i) => opt(cardHtml(id, { big: true }), i));
    } else if (s.hero_options && s.hero_options.length && !s.hero) {
      title = "Choose a hero";
      opts = s.hero_options.map((h, i) => {
        const text = TEXTS["hero:" + h] || "";
        const m = /^Hero Power: ([^]*?\)\.) ([^]*)$/.exec(text);
        const body = m ? `<i>${esc(m[1].replace(/\.$/, ""))}</i>${esc(m[2])}` : esc(text);
        return opt(`<div class="heroopt"><b>${esc(h)}</b><div class="txt">${body}</div></div>`, i);
      });
    } else if (s.trinket_options && s.trinket_options.length) {
      title = "Choose a trinket";
      opts = s.trinket_options.map((t, i) =>
        opt(`<div class="trinopt"><b>${esc(t.name)}</b><span class="bubble">${t.cost}</span>` +
          `<div class="txt">${esc(TEXTS["trinket:" + t.name] || "")}</div></div>`, i));
    }
    if (!opts.length) return { html: "", chosen };
    return { html: `<div id="overlay"><h2>${title}</h2><div class="opts">${opts.join("")}</div></div>`, chosen };
  }

  function bannerHtml(st) {
    const f = FRAMES[st.frame];
    const before = STATES[st.frame - 1] ? STATES[st.frame - 1][player] : STATES[st.frame][player];
    const after = STATES[st.frame][player];
    const change = `Health ${hp(before)} → ${hp(after)}`;
    if (st.type === "over") {
      const place = placeOf(player);
      const won = f.kind === "end" && f.winner === player;
      let big = "Game over";
      if (won) big = "WINNER";
      else if (place) big = `Placed ${ordinal(place)}`;
      else if (st.out) big = `Knocked out on turn ${f.turn}`;
      const of = `${PLAYERS.length} players`;
      const sub = st.out ? `Knocked out on turn ${f.turn}` : place ? `${ordinal(place)} of ${of}` : "";
      return `<div class="banner-big over"><b>${esc(big)}</b><span>${esc(sub)}</span></div>`;
    }
    let outcome;
    let dmg = 0;
    let vs = "";
    if (st.type === "ghost") {
      outcome = f.ghost.outcome === "win" ? "won" : f.ghost.outcome === "loss" ? "lost" : "tie";
      dmg = f.ghost.damage;
      vs = `vs the ghost of ${name(f.ghost.ghost)}`;
    } else if (f.combat) {
      const c = f.combat;
      const mine = c.a === player ? "a" : "b";
      outcome = c.outcome === "draw" ? "tie" : c.outcome === mine ? "won" : "lost";
      dmg = c.damage;
      vs = `vs ${name(c.a === player ? c.b : c.a)}`;
    } else {
      return `<div class="banner-big tie"><b>${esc(f.title)}</b></div>`;
    }
    const big = outcome === "won" ? `WON · dealt ${dmg}` : outcome === "lost" ? `LOST · took ${dmg}` : "TIE";
    return `<div class="banner-big ${outcome}"><b>${big}</b><span>${vs} · ${change}</span></div>`;
  }

  // ---- Rendering a step ----------------------------------------------------------------------------

  const stage = $("stage");

  /** Draws the stage for step `st`, then the action on top of it. */
  function renderStage(st) {
    $("tip").hidden = true;
    const f = FRAMES[st.frame];
    const s = st.state;
    const a = st.type === "act" ? f.action : null;
    const combat = st.type === "combat" && f.combat;
    const over = st.type === "over" || st.type === "ghost" || (st.type === "combat" && !f.combat);
    const html = [];
    html.push(`<div id="board-left">${leaderboardHtml(st)}</div><div class="floor"></div>`);
    html.push(topbarHtml(s, combat || over));
    html.push(`<div class="rightbar"></div><div id="endturn" data-z="endturn" class="${combat || over ? "dim" : ""}">END<br>TURN</div>` +
      `<div id="turnind">Turn<b>${s.turn}</b></div>`);

    let shopLabel = "";
    let shopCards;
    let boardCards;
    if (combat) {
      const c = f.combat;
      const mine = c.a === player ? 0 : 1;
      const foe = c.a === player ? c.b : c.a;
      const fs = STATES[st.frame - 1][foe];
      shopLabel = `<div class="rowlabel" style="top:128px">Opponent: <b>${esc(name(foe))}</b> · Tier ${fs.tier} · Health ${hp(fs)}</div>`;
      shopCards = c.boards[1 - mine].map((id, i) => cardHtml(id, { z: "opp", i }));
      boardCards = c.boards[mine].map((id, i) => cardHtml(id, { z: "board", i }));
    } else {
      let gap = null;
      if (a && a.type === "play") gap = [a.board, `<div class="slot" data-z="slot"></div>`];
      if (a && a.type === "move") {
        const at = a.to > a.from ? a.to + 1 : a.to;
        gap = [at, `<div class="slot" data-z="slot"></div>`];
      }
      shopCards = zoneCards("shop", s.shop, st.base && st.base.shop);
      boardCards = zoneCards("board", s.board, st.base && st.base.board, { gap });
    }
    html.push(shopLabel);
    html.push(`<div class="row${s.frozen && !combat ? " frozen" : ""}" id="shop">${shopCards.join("") || `<span class="empty-note">${combat ? "no minions" : "the shop is empty"}</span>`}</div>`);
    html.push(`<div class="row" id="board">${boardCards.join("") || `<span class="empty-note">${combat ? "no minions" : "no minions on the board"}</span>`}</div>`);
    html.push(heroHtml(s, st));
    html.push(handHtml(s, st, a && a.type === "buy"));
    html.push(goldHtml(s, st));
    const ov = a ? overlayHtml(s, a) : { html: "", chosen: -1 };
    if (!combat && !over) html.push(ov.html);
    if (combat || over) html.push(bannerHtml(st));
    html.push(`<svg id="arrows" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${STAGE_W} ${STAGE_H}"></svg>`);
    stage.innerHTML = html.join("");
    drawAction(st, a, ov.chosen);
  }

  // ---- Drawing the action: halos and arrows ---------------------------------------------------------

  /** The element anchored as zone `z` (index `i`), or null. */
  function anchor(z, i) {
    return stage.querySelector(`[data-z="${z}"]` + (i === undefined ? "" : `[data-i="${i}"]`));
  }
  /** An element's box in stage coordinates (independent of the stage's scale). */
  function box(el) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const o = stage.getBoundingClientRect();
    const k = o.width / STAGE_W;
    const x = (r.left - o.left) / k;
    const y = (r.top - o.top) / k;
    const w = r.width / k;
    const h = r.height / k;
    return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, top: { x: x + w / 2, y }, bottom: { x: x + w / 2, y: y + h }, left: { x, y: y + h / 2 }, right: { x: x + w, y: y + h / 2 } };
  }
  const halo = (el) => { if (el) el.classList.add("halo"); };

  /** A point on a quadratic curve. */
  const along = (a, c, b, t) => ({
    x: (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * c.x + t * t * b.x,
    y: (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * c.y + t * t * b.y,
  });

  /**
   * An SVG arrow from `a` to `b`, gently curved (or through `via`), thick and bright with a dark
   * outline. `label` is drawn at the middle of the curve.
   */
  function arrow(out, a, b, opt = {}) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const c = opt.via || { x: (a.x + b.x) / 2 - (dy / len) * len * 0.16, y: (a.y + b.y) / 2 + (dx / len) * len * 0.16 };
    // The arrowhead points along the end of the curve.
    const tx = b.x - c.x;
    const ty = b.y - c.y;
    const tl = Math.hypot(tx, ty) || 1;
    const ux = tx / tl;
    const uy = ty / tl;
    const head = 30;
    const base = { x: b.x - ux * head, y: b.y - uy * head };
    const tri = [b, { x: base.x - uy * 17, y: base.y + ux * 17 }, { x: base.x + uy * 17, y: base.y - ux * 17 }]
      .map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(" ");
    const path = `M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${base.x.toFixed(1)},${base.y.toFixed(1)}`;
    out.push(`<path d="${path}" fill="none" stroke="#06141a" stroke-width="16" stroke-linecap="round"/>`);
    out.push(`<polygon points="${tri}" fill="#06141a" stroke="#06141a" stroke-width="9" stroke-linejoin="round"/>`);
    out.push(`<path d="${path}" fill="none" stroke="#37e0ff" stroke-width="8" stroke-linecap="round"/>`);
    out.push(`<polygon points="${tri}" fill="#37e0ff" stroke="#37e0ff" stroke-width="2" stroke-linejoin="round"/>`);
    if (opt.label) {
      const m = along(a, c, b, 0.5);
      tag(out, m.x, m.y, opt.label);
    }
  }

  /** A label pill centered at (x, y). */
  function tag(out, x, y, text) {
    const w = Math.max(40, text.length * 13 + 22);
    out.push(`<rect x="${(x - w / 2).toFixed(1)}" y="${(y - 20).toFixed(1)}" width="${w}" height="38" rx="19" fill="#06141a" stroke="#37e0ff" stroke-width="3"/>`);
    out.push(`<text x="${x.toFixed(1)}" y="${(y + 8).toFixed(1)}" text-anchor="middle" fill="#fff">${esc(text)}</text>`);
  }

  /** The action of step `st` as halos on the stage and arrows in the SVG overlay. */
  function drawAction(st, a, chosen) {
    const svg = $("arrows");
    const out = [];
    if (a && st.type === "act") {
      const after = STATES[st.frame][player];
      const before = st.state;
      const paid = before.gold - after.gold;
      const A = (z, i) => anchor(z, i);
      const go = (from, to, opt) => { if (from && to) arrow(out, from, to, opt); };
      switch (a.type) {
        case "buy": {
          const src = A("shop", a.shop);
          halo(src);
          const price = paid > 0 ? `-${paid}g` : before.health > after.health ? `-${before.health - after.health} HP` : "";
          const dst = box(A("ghost"));
          if (src && dst) go(box(src).bottom, dst.top, { label: price || undefined });
          break;
        }
        case "play": {
          const src = A("hand", a.hand);
          halo(src);
          const dst = box(A("slot"));
          if (src && dst) go(box(src).top, dst.bottom);
          break;
        }
        case "magnetize": {
          const src = A("hand", a.hand);
          const dst = A("board", a.board);
          halo(src);
          halo(dst);
          if (src && dst) go(box(src).top, box(dst).bottom);
          break;
        }
        case "cast": {
          const src = A("hand", a.hand);
          halo(src);
          if (a.target !== null && a.target !== undefined) {
            const dst = A("board", a.target);
            halo(dst);
            if (src && dst) go(box(src).top, box(dst).bottom);
          } else if (src) {
            const row = box(anchor("board", 0)) || box(A("hero"));
            const end = { x: 855, y: row ? row.cy + 40 : 500 };
            go(box(src).top, end);
            out.push(`<text x="${end.x}" y="${end.y - 30}" text-anchor="middle" font-size="64" fill="#37e0ff" stroke="#06141a" stroke-width="6" paint-order="stroke" style="font-size:64px">✦</text>`);
          }
          break;
        }
        case "cast_on_shop": {
          const src = A("hand", a.hand);
          const dst = A("shop", a.shop);
          halo(src);
          halo(dst);
          if (src && dst) go(box(src).top, box(dst).bottom);
          break;
        }
        case "sell": {
          const src = A("board", a.board);
          halo(src);
          halo(A("bob"));
          const bob = box(A("bob"));
          if (src && bob) {
            const gain = after.gold - before.gold;
            const s0 = box(src).top;
            go(s0, { x: s0.x, y: bob.y + bob.h + 6 }, { via: { x: s0.x, y: (s0.y + bob.y + bob.h) / 2 }, label: gain > 0 ? `+${gain}g` : undefined });
          }
          break;
        }
        case "move": {
          const src = A("board", a.from);
          halo(src);
          const dst = box(A("slot"));
          if (src && dst) {
            const s0 = box(src).bottom;
            const e = dst.bottom;
            go(s0, e, { via: { x: (s0.x + e.x) / 2, y: Math.max(s0.y, e.y) + 110 } });
          }
          break;
        }
        case "activate": {
          const src = A("board", a.board);
          halo(src);
          if (a.target !== null && a.target !== undefined) {
            const dst = A(a.zone || "board", a.target);
            halo(dst);
            if (src && dst) {
              const sb = box(src);
              const db = box(dst);
              go(db.cy < sb.cy ? sb.top : db.cy > sb.cy ? sb.bottom : sb.right, db.cy < sb.cy ? db.bottom : db.cy > sb.cy ? db.top : db.left);
            }
          }
          break;
        }
        case "refresh": halo(A("reroll")); break;
        case "upgrade": {
          halo(A("tier"));
          const t = box(A("tier"));
          if (t) tag(out, t.cx, t.y + t.h + 36, `Tier ${before.tier} → ${after.tier}`);
          break;
        }
        case "freeze": {
          halo(A("freeze"));
          const t = box(A("freeze"));
          if (t) tag(out, t.cx, t.y + t.h + 36, a.frozen ? "Freeze" : "Unfreeze");
          break;
        }
        case "discover":
        case "choose_hero":
        case "choose_trinket": halo(A("opt", chosen)); break;
        case "hero_power": {
          const src = A(a.second ? "power1" : "power0");
          halo(src);
          if (a.target !== null && a.target !== undefined) {
            const dst = A("board", a.target);
            halo(dst);
            if (src && dst) go(box(src).top, box(dst).bottom);
          }
          break;
        }
        case "end_turn": halo(A("endturn")); break;
        case "dark_discovery": halo(A("darkdisc")); break;
        case "pass": {
          const src = A("hand", a.hand);
          halo(src);
          if (src) {
            const s0 = box(src).left;
            go(s0, { x: 6, y: s0.y }, { via: { x: (s0.x + 6) / 2, y: s0.y }, label: "Pass" });
          }
          break;
        }
        default: break;
      }
    }
    svg.innerHTML = out.join("");
  }

  // ---- Page ----------------------------------------------------------------------------------------

  /** The caption for step `st`: what happens, and the small print under it. */
  function renderCaption(st) {
    const f = FRAMES[st.frame];
    let main;
    if (st.type === "act") main = (f.label || f.title).replace(/^[^:]+: /, "");
    else if (st.type === "result") main = "Result: " + (f.label || f.title).replace(/^[^:]+: /, "");
    else if (st.type === "over") main = st.out ? `${name(player)} is knocked out` : "Game over";
    else main = f.title;
    let extra = "";
    if (f.note) {
      if (f.note.forced) extra += ` <span class="auto">auto</span>`;
      const bits = [];
      if (f.note.value !== undefined) bits.push(`value ${f.note.value.toFixed(2)}`);
      if (f.note.p !== undefined) bits.push(`p ${(100 * f.note.p).toFixed(f.note.p >= 0.995 ? 0 : 1)}%`);
      if (bits.length) extra += ` <span class="auto">${bits.join(" · ")}</span>`;
    }
    $("cap-main").innerHTML = esc(main) + extra;
    const inTurn = STEPS.filter((x) => x.turn === st.turn);
    $("cap-sub").innerHTML = `Turn <b>${st.turn}</b> · step <b>${inTurn.indexOf(st) + 1}</b> of ${inTurn.length} · ` +
      `overall <b>${st.n + 1}</b> of ${STEPS.length}`;
    $("btn-prev").disabled = st.n === 0;
    $("btn-next").disabled = st.n === STEPS.length - 1;
  }

  function renderTurns() {
    const box = $("turns");
    const turns = [...new Set(STEPS.map((st) => st.turn))];
    box.innerHTML = turns.map((t) => `<button type="button" class="chip" data-t="${t}" title="Turn ${t}">${t === 0 ? "Start" : "T" + t}</button>`).join("");
  }

  function renderHeader() {
    document.title = `${DATA.source} · ${name(player)} · seaglass player view`;
    $("source").textContent = DATA.source;
    const result = $("result");
    if (DATA.result) {
      const place = placeOf(player);
      result.textContent = place ? `${name(player)} placed ${ordinal(place)}` : DATA.result;
      result.classList.remove("unfinished");
    } else {
      result.textContent = "the replay ends before the match does";
      result.classList.add("unfinished");
    }
  }

  function renderBanner() {
    const problems = [];
    if (DATA.engine_mismatch) {
      problems.push(`Recorded by seaglass <b>${esc(DATA.engine_mismatch)}</b> but re-simulated by <b>${esc(DATA.viewer)}</b>: ` +
        `the states shown may differ from the recorded game.`);
    }
    if (DATA.divergences.length) {
      const shown = DATA.divergences.slice(0, 5).map((d) => `<li>frame ${d.frame} (record ${d.record}): ${esc(d.message)}</li>`);
      if (DATA.divergences.length > 5) shown.push(`<li>and ${DATA.divergences.length - 5} more</li>`);
      problems.push(`${plural(DATA.divergences.length, "call")} re-simulated differently from the recording:<ul>${shown.join("")}</ul>`);
    }
    if (DATA.error) {
      problems.push(`Re-simulation stopped at record ${DATA.error.record}: ${esc(DATA.error.message)}. Later frames are missing.`);
    }
    const banner = $("banner");
    banner.hidden = problems.length === 0;
    banner.classList.toggle("warn", DATA.faithful);
    const heading = DATA.faithful ? "Engine mismatch" : "This replay does not re-simulate faithfully";
    banner.innerHTML = problems.length ? `<strong>⚠ ${heading}</strong>${problems.map((x) => `<div>${x}</div>`).join("")}` : "";
  }

  /** Shows step `k` of the followed player's steps. */
  function go(k) {
    k = Math.round(Number(k));
    if (!Number.isFinite(k) || !STEPS.length) return;
    cur = Math.max(0, Math.min(STEPS.length - 1, k));
    const st = STEPS[cur];
    renderStage(st);
    renderCaption(st);
    document.querySelectorAll("#turns .chip").forEach((c) => c.classList.toggle("active", Number(c.dataset.t) === st.turn));
    const hash = `#player=${player}&step=${cur}`;
    if (location.hash !== hash) {
      try {
        history.replaceState(null, "", hash);
      } catch (err) {
        location.hash = hash;
      }
    }
  }

  /** Follows player `p` (staying in the same turn if `turn` is given), showing step `k` if given. */
  function follow(p, turn, k) {
    player = p;
    STEPS = buildSteps(p);
    $("player").value = String(p);
    renderHeader();
    renderTurns();
    go(k !== undefined ? k : turn === undefined ? 0 : stepOfTurn(turn));
  }

  /** The scale that fits the 1600x900 stage into its box. */
  function fit() {
    const wrap = $("wrap");
    const k = Math.min(wrap.clientWidth / STAGE_W, wrap.clientHeight / STAGE_H);
    stage.style.transform = `scale(${k})`;
    stage.style.left = `${Math.max(0, (wrap.clientWidth - STAGE_W * k) / 2)}px`;
    stage.style.top = `${Math.max(0, (wrap.clientHeight - STAGE_H * k) / 2)}px`;
  }

  function stateFromHash() {
    const p = /[#&]player=(\d+)/.exec(location.hash);
    const k = /[#&]step=(\d+)/.exec(location.hash);
    return { player: p ? Number(p[1]) : null, step: k ? Number(k[1]) : null };
  }

  /**
   * Shows the stage's `title` texts at once, in a wide box (the browser's own tooltip waits a
   * second and wraps narrowly). Each `title` moves to `data-tip` so the browser's stays away.
   */
  function wireTips() {
    const tip = $("tip");
    const hide = () => { tip.hidden = true; };
    stage.addEventListener("mouseover", (e) => {
      const el = e.target.closest("[title], [data-tip]");
      if (!el || !stage.contains(el)) return hide();
      if (el.hasAttribute("title")) {
        el.dataset.tip = el.getAttribute("title");
        el.removeAttribute("title");
      }
      const [head, ...rest] = el.dataset.tip.split("\n");
      tip.innerHTML = `<b>${esc(head)}</b>${rest.length ? "\n" + esc(rest.join("\n")) : ""}`;
      tip.hidden = false;
    });
    stage.addEventListener("mousemove", (e) => {
      if (tip.hidden) return;
      const pad = 14;
      const w = tip.offsetWidth;
      const h = tip.offsetHeight;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      if (x + w > window.innerWidth - 4) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 4) y = e.clientY - h - pad;
      tip.style.left = Math.max(4, x) + "px";
      tip.style.top = Math.max(4, y) + "px";
    });
    stage.addEventListener("mouseleave", hide);
  }

  function wireControls() {
    $("player").innerHTML = PLAYERS.map((pl, p) => `<option value="${p}">${esc(pl.name)}</option>`).join("");
    $("player").addEventListener("change", (e) => {
      follow(Number(e.target.value), STEPS[cur].turn);
      e.target.blur();
    });
    $("btn-prev").addEventListener("click", () => go(cur - 1));
    $("btn-next").addEventListener("click", () => go(cur + 1));
    $("turns").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) go(stepOfTurn(Number(chip.dataset.t)));
    });
    wireTips();
    stage.addEventListener("click", (e) => {
      const row = e.target.closest(".lb");
      if (row && Number(row.dataset.p) !== player) follow(Number(row.dataset.p), STEPS[cur].turn);
    });
    const cb = $("results");
    cb.checked = showResults;
    cb.addEventListener("change", () => {
      showResults = cb.checked;
      try { localStorage.setItem("seaglass.player.results", showResults ? "1" : "0"); } catch (err) { /* no storage */ }
      const frame = STEPS[cur].frame;
      STEPS = buildSteps(player);
      const k = STEPS.findIndex((st) => st.frame >= frame);
      go(k < 0 ? STEPS.length - 1 : k);
      cb.blur();
    });
    window.addEventListener("resize", () => { fit(); go(cur); });
    // The header changes height when the player changes (more turn chips, a warning banner).
    if (window.ResizeObserver) new ResizeObserver(() => { fit(); }).observe($("wrap"));
    window.addEventListener("hashchange", () => {
      const h = stateFromHash();
      if (h.player === null && h.step === null) return;
      if (h.player !== null && h.player !== player && h.player < PLAYERS.length) follow(h.player, undefined, h.step === null ? 0 : h.step);
      else if (h.step !== null && h.step !== cur) go(h.step);
    });
    const moves = {
      ArrowLeft: () => cur - 1, p: () => cur - 1,
      ArrowRight: () => cur + 1, " ": () => cur + 1, n: () => cur + 1,
      ArrowUp: () => prevTurnStep(cur), PageUp: () => prevTurnStep(cur),
      ArrowDown: () => nextTurnStep(cur), PageDown: () => nextTurnStep(cur),
      Home: () => 0, End: () => STEPS.length - 1,
    };
    document.addEventListener("keydown", (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const t = e.target;
      if (t instanceof HTMLElement && (t.tagName === "SELECT" || t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && e.key === " "))) return;
      const move = moves[e.key];
      if (!move) return;
      e.preventDefault();
      go(move());
    });
  }

  renderBanner();
  wireControls();
  fit();
  const start = stateFromHash();
  const initial = start.player !== null && start.player < PLAYERS.length ? start.player
    : DATA.focus !== undefined && DATA.focus !== null && DATA.focus < PLAYERS.length ? DATA.focus : 0;
  follow(initial, undefined, start.player !== null && start.step !== null ? start.step : 0);
  fit();
  document.documentElement.dataset.ready = "true";
})();
</script>
</body>
</html>
